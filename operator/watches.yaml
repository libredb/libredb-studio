# Use the 'create api' subcommand to add watches to this file.
- group: studio.libredb.org
  version: v1alpha1
  kind: LibreDBStudio
  chart: helm-charts/libredb-studio
  # Chart values the operator sets on every LibreDBStudio. They win over the
  # resource's spec, so whoever writes a resource cannot change them.
  #
  # helm-operator expands $NAME from the controller's environment and applies
  # each value like `helm --set-string`, so every one reaches the chart as a
  # string: "true" is the string "true", and "{}" is a list holding one empty
  # string, which renders nothing. Never pin a boolean here: the string "false"
  # is truthy in a template.
  overrideValues:
    # O14: cross-namespace and cluster-scoped objects render only for the
    # resource in the operator's own namespace, the only one it watches
    # (WATCH_NAMESPACE, from the pod's namespace in config/manager/manager.yaml).
    operator.managed: "true"
    operator.clusterStudioNamespace: $WATCH_NAMESPACE
    # Keep every object of the bundled PostgreSQL subchart in the resource's own
    # namespace, also for a resource stored before the CRD refused these values.
    postgresql.namespaceOverride: ""
    postgresql.extraDeploy: "{}"
    postgresql.serviceAccount.name: ""
    postgresql.metrics.serviceMonitor.namespace: ""
    postgresql.metrics.prometheusRule.namespace: ""
    # The console plugin's server receives every console user's token, so it
    # runs in the operator's own namespace (WATCH_NAMESPACE, the cluster Studio
    # namespace, which only cluster admins write) with the image the operator
    # release pins (RELATED_IMAGE_PLUGIN), never where or what the resource
    # asks. Unset, the render fails naming the variable.
    openshift.consolePlugin.namespace: $WATCH_NAMESPACE
    openshift.consolePlugin.image: $RELATED_IMAGE_PLUGIN
# +kubebuilder:scaffold:watch
