spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: A LibreDB Studio instance managed by the operator. The spec mirrors
        the Helm chart values except extraObjects, which the operator refuses, and
        the bundled PostgreSQL (postgresql), which takes only the values Studio's
        storage needs and always runs in this resource's namespace; every field left
        unset falls back to the chart defaults. Reconciled only in the namespace the
        operator is installed in.
      displayName: LibreDB Studio
      kind: LibreDBStudio
      name: libredbstudios.studio.libredb.org
      version: v1alpha1
  description: |
    LibreDB Studio is an open-source, web-based SQL IDE. Query PostgreSQL,
    MySQL, Oracle, Db2 LUW, SQL Server, SQLite, libSQL, DuckDB, MongoDB, Redis, Couchbase,
    Firestore, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Trino, BigQuery, Snowflake, Apache Spark,
    Apache Cassandra, Prometheus, Apache Kafka, MQTT, RabbitMQ, etcd, Neo4j, Milvus, Qdrant, Weaviate, InfluxDB,
    InfluxDB 3, Oxia, Databend, S3-compatible object storage, Kubernetes, OPC UA, MTConnect, Modbus, NETCONF, SNMP and Sparkplug B from the browser,
    with AI-powered query assistance (natural-language-to-SQL, explain, fix),
    an ERD viewer, schema diff and a data profiler. No desktop client required.

    This Helm-based operator installs and manages LibreDB Studio through the
    `LibreDBStudio` custom resource, which exposes the full Helm chart
    configuration. With no credentials provided, the instance starts in
    zero-config bootstrap mode: a JWT secret is generated automatically and a
    first-run admin account is created. For production, switch
    `config.authBootstrap` to `"off"` and supply an existing Secret.

    ### Usage

    Create a `LibreDBStudio` resource; every field left unset falls back to
    the chart defaults. See the sample on this page for a minimal start.

    ### Namespace

    The operator manages only its own namespace. Install it for a specific
    namespace, the recommended `libredb-studio` (the install creates it when
    it does not exist), and create one `LibreDBStudio` there, the cluster's
    Studio. A `LibreDBStudio` in any other namespace is not reconciled; teams
    install Studio with the Helm chart. An operator 1.1.0 install is not
    upgraded in place: see
    [Moving from operator 1.1.0](https://github.com/libredb/libredb-studio/blob/main/docs/OPENSHIFT.md#moving-from-operator-110).
