apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting fifteen engines - PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino, Apache Cassandra and libSQL
type: application
version: 0.1.53
appVersion: "0.13.4"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  # Two keywords for one engine, and the second is the one that gets searched: the
  # provider is registered as `libsql`, but the product an evaluator types is Turso.
  - libsql
  - turso
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # False: 0.1.53 changes no packaged template and no value - it names one more engine in
  # the README, the description and the keywords, libSQL, which is a new provider in the
  # app rather than a chart change. The README is a packaged file, so #167 costs it a
  # chart version even though nothing an operator deploys moves.
  # False: 0.1.52 adds one value, config.authCookieSecure, and changes no behaviour on its
  # own - unset (the default) writes no AUTH_COOKIE_SECURE and the app keeps deciding, so
  # every existing install renders exactly as before. It makes an already-supported setting
  # discoverable from values.yaml instead of reachable only through extraEnv; `false` is a
  # deliberate weakening an operator asks for, not one this version applies.
  # False: 0.1.50 changes no packaged template and no value - it corrects the README's own
  # copy-paste recipes, which rendered an unquoted YAML boolean into `core/v1.EnvVar.value`
  # and left bracket arguments a zsh user's shell globs away. The README is a packaged file,
  # so #167 costs it a chart version even though nothing an operator deploys moves.
  # 0.1.49 carried only the appVersion move to 0.13.4, whose fixes are correctness rather
  # than security: a MySQL protocol choice, the monitoring dashboard's all-or-nothing
  # aggregate, a ScyllaDB connection and an Oracle LOB read. Its dependency moves are routine patch bumps with no advisory behind them.
  # 0.13.3's transport fixes (a rediss:// or couchbases:// URL landing on SSL mode disable,
  # and Couchbase posting plain HTTP to the TLS management port) stay recorded on 0.1.47
  # with this flag set, which is where an operator looking for them will find them. The
  # app-level security fixes of earlier releases remain recorded on 0.1.37, the chart
  # version that first shipped them; the adm-zip pin note belongs to 0.1.44, unchanged.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.4
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "config.authCookieSecure is now a first-class value: it writes AUTH_COOKIE_SECURE, the setting a browser reaching Studio over plain HTTP on a LAN or home-server address needs, which previously had to go through extraEnv. Three-state - leave it unset and nothing is written, so the app decides exactly as before"
    - "MySQL: reads no longer go through the prepared protocol unconditionally, which had broken statements MySQL itself only answers on the text protocol - CHECK TABLE and its relatives returned an error instead of a result"
    - "Monitoring: one refused read no longer costs the whole dashboard - the seven panels degrade individually, so a permission the user lacks hides that panel rather than blanking the page, and two panels stop reporting a fabricated zero"
    - "ScyllaDB connections could not be created at all, and an Oracle query touching a LOB column failed in full rather than returning its rows"
    - "The query agent carries measured settings for ten models rather than one default, records which model drove a run and where its settings came from, and no longer scores a plan run as answered while handing back prose glued to its SQL"
    - "Track app release 0.13.4 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
