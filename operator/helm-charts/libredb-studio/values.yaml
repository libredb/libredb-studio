global:
  security:
    # -- Required by the Bitnami common library because the postgresql
    # subchart image is redirected to docker.io/bitnamilegacy (see
    # postgresql.image below); without it the render fails with "Original
    # containers have been substituted for unrecognized ones". Ignored by
    # this chart's own templates and harmless when the subchart is disabled.
    allowInsecureImages: true
  compatibility:
    openshift:
      # -- OpenShift restricted-v2 SCC compatibility: "auto" drops the chart's
      # fixed runAsUser/runAsGroup/fsGroup (letting the SCC assign range-valid
      # IDs) when the API server is OpenShift, "force" always drops them,
      # "disabled" never does. The Bitnami postgresql subchart honours the
      # same value.
      adaptSecurityContext: auto
      # -- How the chart decides that an OpenShift API is served, for every
      # OpenShift-only object it renders (openshiftRoute,
      # openshift.trustedCABundle, the NetworkPolicy's OpenShift DNS and API
      # server ports): "auto" detects each API through the API server, "force"
      # renders them without detection, for GitOps or an offline
      # `helm template` that has no cluster to ask. Separate from
      # adaptSecurityContext, which a GitOps render sets to "force" as well.
      apis: auto

# -- Number of replicas. Note: SQLite storage mode only supports 1 replica.
# The agent runtime carries a second single-instance constraint: its zero-config
# durable backend keeps run state on local disk behind file locks, and each pod
# gets its own copy, so a run started on one replica is invisible to the next
# request. Lifting it needs WORKFLOW_TARGET_WORLD=@workflow/world-postgres,
# which the published image cannot load yet - so the chart REFUSES TO RENDER
# when an agent could run here and more than one replica is asked for. Set
# agent.enabled=false to run Studio on many replicas without agents. See
# "Agent Runtime" in the chart README.
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/libredb/libredb-studio
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: Chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# =============================================================================
# Secrets — sensitive values stored in a Kubernetes Secret
# =============================================================================
secrets:
  # -- Use an existing Secret instead of creating one.
  # When set, all other secret values are ignored.
  existingSecret: ""
  # -- Key name mapping for existing secrets.
  # Override if your existing secret uses different key names.
  existingSecretKeys:
    jwtSecret: jwt-secret
    adminEmail: admin-email
    adminPassword: admin-password
    userEmail: user-email
    userPassword: user-password
    adminTotpSecret: admin-totp-secret
    userTotpSecret: user-totp-secret
    llmApiKey: llm-api-key
    oidcClientId: oidc-client-id
    oidcClientSecret: oidc-client-secret
    storagePostgresUrl: storage-postgres-url
    governancePostgresUrl: governance-postgres-url
    governancePrivateKeys: governance-private-keys
  # -- JWT signing secret (min 32 chars). Required in strict mode (config.authBootstrap=off);
  # otherwise generated on first start.
  jwtSecret: ""
  # -- Admin account email. Mirrors the app's own default; set to "" to let the app apply it
  # instead (no ADMIN_EMAIL is then written to the Secret or the pod).
  adminEmail: "admin@libredb.org"
  # -- Admin account password. Required in strict mode (config.authBootstrap=off);
  # otherwise generated on first start.
  adminPassword: ""
  # -- Regular user account email (used only when userPassword is set). Mirrors the app's own
  # default; set to "" to let the app apply it instead.
  userEmail: "user@libredb.org"
  # -- Regular user account password. Optional: the non-admin account exists only when set;
  # it is never generated.
  userPassword: ""
  # -- Base32 TOTP secret for the admin account (RFC 4648: A-Z and 2-7), at least 26 characters
  # so the decoded secret carries the 128 bits RFC 4226 requires. Optional and
  # local-provider only: when set, admin login requires a 6-digit authenticator code after the
  # password. A value that is not base32 stops login with a clear 503 rather than silently
  # dropping the second factor. Under config.authProvider=oidc the login page shows no password
  # form and MFA belongs to the identity provider, but this still guards POST /api/auth/login
  # whenever a password is also set. Generate one with: openssl rand 20 | base32 | tr -d '='
  adminTotpSecret: ""
  # -- Base32 TOTP secret for the regular user account. Same rules as adminTotpSecret; inert
  # unless userPassword is also set, since without it there is no user account to protect.
  userTotpSecret: ""
  # -- LLM API key (optional, for AI features)
  llmApiKey: ""
  # -- OIDC client ID (required when authProvider=oidc)
  oidcClientId: ""
  # -- OIDC client secret (required when authProvider=oidc)
  oidcClientSecret: ""
  # -- A Secret that holds only the OIDC client id and secret, under the keys
  # existingSecretKeys.oidcClientId and existingSecretKeys.oidcClientSecret (oidc-client-id
  # and oidc-client-secret by default). OIDC_CLIENT_ID and OIDC_CLIENT_SECRET come from it and
  # nothing else does: the JWT secret and the admin password stay with this chart's own Secret
  # or the zero-config bootstrap. Both keys are required, so the pod does not start until the
  # Secret holds them. Needs authProvider=oidc, and refuses existingSecret, oidcClientId and
  # oidcClientSecret beside it. Made for a setup tool that writes the client credentials of
  # an identity provider it registered, such as Rancher Manager's OIDC provider.
  oidcExistingSecret: ""
  # -- PostgreSQL connection URL for storage (required when storageProvider=postgres and postgresql.enabled=false)
  storagePostgresUrl: ""
  # -- The governance source for Studio's own role, as a postgresql:// URL that reaches the
  # primary (required when governance.enabled=true, unless existingSecret carries it).
  # Rendered as GOVERNANCE_POSTGRES_URL from the Secret, never into the ConfigMap.
  governancePostgresUrl: ""
  # -- The keyring document that opens sealed credentials:
  # {"version":1,"keys":["<base64url raw 32-byte X25519 private key>", ...]} (required when
  # governance.enabled=true, unless existingSecret carries it). Mounted read-only as a file at
  # /etc/libredb/governance/keyring.json, never an environment variable.
  governancePrivateKeys: ""

# =============================================================================
# Config — non-sensitive values stored in a ConfigMap
# =============================================================================

# -- Authentication provider: "local" or "oidc"
authProvider: "local"

config:
  # -- Must match BASE_PATH baked into a custom image. Prefixes default health probes;
  # this value cannot change the routes in a prebuilt image. Empty means root.
  basePath: ""
  # -- Log level
  logLevel: "info"
  # -- Address the container listens on, written to HOSTNAME. Empty is the
  # default and means "let the image choose": the container entrypoint binds a
  # throwaway listener on "::", connects to it over IPv4, and keeps "::" only
  # when that connection is accepted - a dual-stack listener it proved rather
  # than assumed. It falls back to "0.0.0.0" when the namespace has no IPv6 at
  # all, or when the "::" listener turns out to be IPv6-only while a
  # non-loopback IPv4 address exists, and it logs one line naming the address
  # it picked and the evidence for it. Set this only to overrule that: "::"
  # forces a dual-stack listener, "0.0.0.0" pins the container to IPv4 and is
  # what releases before chart 0.1.42 did unconditionally. A pinned IPv4
  # literal alongside a dual-stack Service is the one combination that breaks,
  # and NOTES.txt warns about it.
  bindAddress: ""
  # -- Auth bootstrap mode: "" (default: AUTH_BOOTSTRAP is omitted and the app's zero-config
  # first run applies — missing JWT_SECRET / ADMIN_PASSWORD are auto-generated on first start,
  # printed once to the pod log, and stored in /app/data/auth-bootstrap.json), "on" (same,
  # explicit), or "off" (strict: secrets.jwtSecret and secrets.adminPassword are required
  # and a missing value fails the install).
  # The zero-config default makes the chart deployable with default values (e.g. Rancher Apps).
  authBootstrap: ""
  # -- Whether auth cookies carry the `Secure` flag, written to AUTH_COOKIE_SECURE.
  # Three-state, and unset is the default: the chart then writes no
  # AUTH_COOKIE_SECURE at all and the app decides for itself (Secure in
  # production, except on a loopback host reached over plain http).
  #
  # Set `false` for the one case the app cannot detect: the BROWSER reaches
  # Studio over plain http on a host that is not loopback - a LAN address or a
  # home server. There the browser rejects a Secure cookie outright and login
  # silently loops. Only an operator can state that; no request-scoped signal
  # proves it, and x-forwarded-proto is attacker-supplied, so trusting it to
  # DROP the flag would be a downgrade vector.
  #
  # TLS terminated at an ingress does NOT need this: the browser still speaks
  # https, so it accepts a Secure cookie. Leave it unset there.
  #
  # `false` means session cookies travel in cleartext - keep it to trusted
  # networks. `true` is accepted and explicit, and forces the flag on.
  #
  # The flag covers the session cookie and the two passkey ceremony cookies,
  # passkey-registration and passkey-sign-in, alike.
  #
  # A YAML boolean (or `--set config.authCookieSecure=false`), not a string: the
  # value is rendered as a quoted string for the ConfigMap, so no --set-string is
  # needed, and the app's other spellings ("on"/"off"/"0"/"1") are rejected here
  # by values.schema.json rather than silently mis-read.
  authCookieSecure: null
  # -- The public address people open Studio at, written to PASSKEY_ORIGIN when
  # set: scheme, host and port only, with no path, so no config.basePath either,
  # such as https://studio.example.com. Empty (the default) writes nothing and
  # passkey sign-in stays off.
  #
  # Passkeys also need config.storageProvider sqlite or postgres (a browser-local
  # store has no account registry to keep them in) and authProvider local (an
  # identity provider manages its own passkeys); NOTES.txt warns when either is
  # missing. Browsers offer passkeys only over https, or on http://localhost.
  # The app validates the value at startup and says what is wrong with it.
  # Passkeys belong to the host name, so changing it means every user registers
  # their passkeys again.
  #
  # This needs an application image that includes passkey sign-in (#785):
  # appVersion 0.17.0, which this chart version pins, does not read
  # PASSKEY_ORIGIN, so the value acts only once an application release moves
  # appVersion or image.tag names such an image. Guide: docs/PASSKEYS.md.
  passkeyOrigin: ""
  # -- Storage provider: "local" (browser), "sqlite" (file), or "postgres" (database)
  storageProvider: "local"
  # -- SQLite database file path (when storageProvider=sqlite)
  storageSqlitePath: "/app/data/libredb-storage.db"
  # -- LLM provider: gemini, openai, ollama, custom (optional)
  llmProvider: ""
  # -- LLM model name (optional)
  llmModel: ""
  # -- LLM API URL for ollama/custom providers (optional)
  llmApiUrl: ""
  # -- LLM_MODEL_EFFORT, the reasoning effort for llmProvider openai only (optional):
  # none, minimal, low, medium, high, xhigh or max. Empty writes nothing and the model keeps its
  # own default. Which values a model takes is the model's own (GPT-6.1 Sol has no none), and the
  # app refuses the variable with any other provider. Needs an application image after 1.0.0.
  llmModelEffort: ""
  # -- OIDC issuer URL (required when authProvider=oidc)
  oidcIssuer: ""
  # -- OIDC scopes (space-separated)
  oidcScope: "openid profile email"
  # -- OIDC claim path for role extraction
  oidcRoleClaim: ""
  # -- Case-sensitive prefix filter for custom seed roles from the OIDC role claim (optional)
  oidcRolePrefix: ""
  # -- OIDC admin role values (comma-separated)
  oidcAdminRoles: "admin"
  # -- OIDC user role values (comma-separated). Empty writes nothing, and any signed-in user
  # without an admin role is a user. Set, a user with neither an admin nor a user role is
  # refused. Required when governance.enabled=true, which installs use "user".
  oidcUserRoles: ""
  # -- The prompt sent to the identity provider on sign-in: empty writes nothing (the app's
  # default, login), "omit" sends none so a provider session signs in silently, "consent" and
  # "select_account" are passed through.
  oidcPrompt: ""
  # -- Send a signed-out visitor of /login straight to the identity provider. false (the
  # default) writes nothing; true writes OIDC_AUTO_REDIRECT=true.
  oidcAutoRedirect: false
  # -- Send id_token_hint with the provider's end-session request on logout. false (the
  # default) writes nothing; true writes OIDC_LOGOUT_HINT=true. Turn it on only after
  # verifying it against the identity provider.
  oidcLogoutHint: false
  # -- Session lifetime in seconds, from 300 to 86400. null (the default) writes nothing and
  # the app keeps 86400; governance installs use 28800.
  sessionTtlSeconds: null
  # -- ALLOW_CUSTOM_CONNECTIONS, whether a signed-in user may open a connection of their own,
  # one that is not a seed connection. null (the default) writes nothing and the app keeps
  # them on. false switches them off: the server refuses a connection a request supplies and
  # the editor lists seed connections only. Switch it off where Studio shares a network with
  # services its users must not reach. A YAML boolean, not a string. Governance refuses true.
  # See docs/SEED_CONNECTIONS.md (Custom Connections).
  allowCustomConnections: null
  # -- SEED_LITERAL_VALUES: false (the default) writes nothing; true writes
  # SEED_LITERAL_VALUES=true, so no ${ENV} or ${vault:...} reference in the seed file is
  # resolved and every value is used as written. Turn it on for a seed file a platform
  # writes from data its users control. See docs/SEED_CONNECTIONS.md (Literal values).
  seedLiteralValues: false
  # -- Schema of the PostgreSQL storage tables (storageProvider=postgres). Empty writes
  # nothing and the tables stay unqualified. Studio never creates the schema: create it
  # first, owned by the storage role. Required when governance.enabled=true.
  storagePostgresSchema: ""

# =============================================================================
# Governance (docs/GOVERNANCE.md)
# =============================================================================
# Runs Studio under a control plane: the governance source it reads in PostgreSQL
# becomes the only catalog of connections and grants, and the identity provider the
# only way to sign in. Until governance.enabled is true, nothing below is written.
#
# Enabled, the chart writes GOVERNANCE_SOURCE=postgres and the values below, takes
# GOVERNANCE_POSTGRES_URL from secrets.governancePostgresUrl (or the existingSecret
# key governance-postgres-url), mounts the keyring from secrets.governancePrivateKeys
# (or the existingSecret key governance-private-keys) read-only at
# /etc/libredb/governance/keyring.json, and moves the readiness probe to /api/ready.
# The render fails, naming the value, for any combination Studio would refuse to
# start with: authProvider other than oidc, an empty config.oidcRoleClaim,
# config.oidcUserRoles or config.storagePostgresSchema, a missing URL or keyring,
# seedConnections, mcp or agent enabled, secrets.adminPassword or userPassword set,
# an extraEnv entry named GOVERNANCE_*, or more than one replica without
# stickySessions.enabled.
governance:
  # -- Run Studio under governance (GOVERNANCE_SOURCE=postgres).
  enabled: false
  # -- The schema the governance source lives in.
  postgresSchema: "bridge"
  # -- This instance's id in its heartbeat. Empty uses the chart's fullname, which stays
  # the same across rollouts, so a new pod updates the same heartbeat row. With more than
  # one replica each pod reports its own name instead, and a set value fails the render.
  instanceId: ""
  # -- Reload interval in milliseconds without a change notification, from 1000 to 600000.
  # null (the default) writes nothing and the app keeps 30000.
  refreshMs: null
  # -- How old the snapshot may grow while reloads fail before data routes answer 503, in
  # milliseconds, from refreshMs to 3600000. null (the default) writes nothing and the app
  # keeps 120000.
  maxStalenessMs: null
  # -- The engine type ids Studio admits, separated by commas. Empty (the default) writes
  # nothing and the app keeps postgres,mysql,mssql,oracle,mongodb,redis.
  allowedEngines: ""

# =============================================================================
# Agent Runtime
# =============================================================================
# The read-only investigation agent is NOT a separate on-switch: the app derives
# whether it can run from what is true at runtime - a model configured through
# the AI settings above (there is no second place to enter a key) plus a writable
# ledger directory - and GET /api/agent/config reports which of the two failed.
# The chart sets WORKFLOW_LOCAL_DATA_DIR=/app/data/workflow itself, inside the
# volume mounted on /app/data in every render, so the ledger is writable under
# readOnlyRootFilesystem: true with nothing to configure. It sets it rather than
# leaning on the image because image.tag defaults to this chart's appVersion, and
# the container image gained its own default for that variable in a LATER app
# version: on the image a default install pulls today, an unset variable resolves
# to .workflow-data under WORKDIR /app, which is read-only, and every run refuses
# with LEDGER_UNAVAILABLE. Both name the same path, so the two agree once such an
# image ships. Override it through extraEnv (written after this, so it wins).
#
# WHERE RUN HISTORY LIVES: in that ledger, under /app/data. With
# persistence.enabled=false that path is an emptyDir - the agent works, every run
# is written, and the whole history goes with the pod. Set persistence.enabled=true
# if a finished run should still be readable after a restart or a node drain.
agent:
  # -- Explicit off-switch, and nothing else. Leave it unset (the default) and the
  # chart writes no LIBREDB_AGENT_ENABLED at all, so the runtime keeps deriving the
  # answer. `false` writes LIBREDB_AGENT_ENABLED=false, which is the supported way
  # to have AI configured and no agent - use it when upgrading a deployment that
  # already has an LLM key and does not want an agent. `true` is accepted and
  # explicit, but it cannot conjure a model: with no AI configuration the agent
  # still reports itself absent. The value is rendered as a quoted string, so no
  # --set-string is needed.
  enabled: null

  # -- Whether a run may be told about the CONVERSATION it belongs to. Leave unset
  # (the default) and the chart writes nothing, so the runtime keeps its own default,
  # which is on. `false` writes LIBREDB_AGENT_THREAD_CONTEXT=false: every run then
  # opens on its own, and the rail says so rather than going quiet.
  #
  # A follow-up asked on the same connection otherwise continues the previous run's
  # conversation - the earlier steps' objectives and the most recent step's report are
  # derived server-side from those runs' own ledgers and handed to the model fenced.
  # Set this where no question's context may reach another. The user already has the
  # equivalent control (the rail names the conversation and offers to leave it); this
  # is for when the choice may not be theirs.
  threadContext: null

  # -- Measured per-model settings, layered over the ones the image ships with.
  #
  # The image carries a document recording what specific models were measured under -
  # turn limit, how many readings before a model is asked to report, whether an empty
  # turn is asked again - and a model it does not name is driven with the defaults.
  # This is how a model the image has never measured gets settings somebody else
  # measured, with no new release and no code change.
  #
  # There is deliberately no `enabled` flag: naming a source IS enabling it, so there
  # is no combination that renders a pod mounting a ConfigMap nobody created. Give
  # either `existingConfigMap` (the natural home for a document you were handed:
  # `kubectl create configmap my-tuning --from-file=model-tuning.json`) or `document`
  # (inline, for a short overlay). Setting both uses the existing ConfigMap.
  #
  # A document that is missing, unreadable or off-schema is IGNORED and the shipped
  # measurements stand - so this cannot break a working agent. It is also the reason
  # `GET /api/agent/config` reports what became of it to an admin session: fail-open is
  # only safe when the operator can find out it happened.
  modelTuning:
    # -- Inline JSON document, rendered into a ConfigMap by this chart
    document: {}
    # -- An existing ConfigMap holding the document, instead of the inline one
    existingConfigMap: ""
    # -- Key within the ConfigMap that holds the document
    configMapKey: "model-tuning.json"

# =============================================================================
# MCP server (#246)
# =============================================================================
# An AI client of the user's own (Claude Code, Codex, Cursor, VS Code, Gemini CLI)
# reads schemas and runs bounded read-only SQL at /api/mcp, with a token each user
# mints on the settings screen. The endpoint stays disabled, and nothing below is
# written, until enabled is true. An image built before the MCP server shipped
# ignores all four variables. Guide, client configuration and limits: docs/MCP.md.
mcp:
  # -- Serve /api/mcp. false (the default) writes no LIBREDB_MCP_* variable, and the
  # endpoint answers an authenticated request with 404. true writes all four
  # variables below as strings and requires url and tokenLabel: the render fails
  # without them.
  enabled: false
  # -- The address MCP clients use, which every token is bound to: an absolute
  # http(s) URL ending in /api/mcp, with config.basePath when one is set, and no
  # user name, password, query or fragment, such as
  # https://studio.example.com/api/mcp
  url: ""
  # -- Any non-empty value. The token signing key is derived from the JWT secret
  # under it, so changing it revokes every MCP token at once, which is the only
  # revocation there is. To offboard a person, stop them signing in, then change
  # it once ten minutes have passed, since minting needs a sign-in that recent.
  tokenLabel: ""
  # -- How many days a minted token stays valid, from 1 to 365.
  tokenTtlDays: 30

# =============================================================================
# Persistence — PVC for SQLite storage mode
# =============================================================================
persistence:
  # -- Enable persistent storage. Auto-enabled when storageProvider=sqlite.
  enabled: false
  # -- Storage class name (leave empty for default)
  storageClassName: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Storage size
  size: 1Gi
  # -- Use an existing PVC instead of creating one
  existingClaim: ""
  # -- Annotations for the PVC
  annotations: {}
  # -- Size limit for the /app/data emptyDir used when persistence is disabled (e.g. "512Mi").
  # Empty means unlimited, which is the historical behaviour; a limit makes the kubelet evict
  # the pod once the volume grows past it, so set it only if you know the workload's ceiling.
  emptyDirSizeLimit: ""
  # -- Chown the mounted /app/data volume to podSecurityContext.runAsUser:fsGroup before the app
  # starts, via a short root init container. Only for statically provisioned volumes the kubelet
  # does not apply fsGroup to (hostPath, some local PVs), where the app otherwise hits EACCES.
  # Requires a volume (persistence.enabled or storageProvider=sqlite). Rendering FAILS when the
  # OpenShift security-context adaptation is active: restricted-v2 rejects a root container, and
  # there the pod's UID/GID come from the namespace range, so the chown would target the wrong
  # owner. Use a storage class whose volumes get fsGroup applied instead.
  fixPermissions: false

# =============================================================================
# Security
# =============================================================================
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations (e.g., for IRSA or Workload Identity)
  annotations: {}
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Mount an API token into the pod; set on the pod spec and on the created ServiceAccount,
  # so it also holds with create=false. Only true mounts one. Studio reads the pod's token only
  # for Vault Kubernetes auth (VAULT_ROLE); see docs/SEED_CONNECTIONS.md.
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# =============================================================================
# Probes — uses /api/db/health endpoint
# =============================================================================
startupProbe:
  httpGet:
    path: /api/db/health
    port: http
  failureThreshold: 30
  periodSeconds: 2

readinessProbe:
  httpGet:
    path: /api/db/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /api/db/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# =============================================================================
# Networking
# =============================================================================
service:
  # -- Service type: ClusterIP, NodePort, or LoadBalancer
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Container target port
  targetPort: 3000
  # -- NodePort (only when type=NodePort)
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Address families the Service is allocated from: "SingleStack",
  # "PreferDualStack" (two families on a dual-stack cluster, one on a
  # single-stack cluster) or "RequireDualStack" (fails to create on a
  # single-stack cluster). Empty renders no field at all, which is deliberate:
  # Kubernetes does not treat an omitted policy as a static SingleStack default
  # (on update it inherits the live Service's policy), and an explicit
  # SingleStack is read as intent to TRUNCATE - it releases the secondary
  # clusterIP of a Service that is already dual-stack.
  # THE POD MUST LISTEN ON BOTH FAMILIES TOO, and since chart 0.1.42 it does
  # without a second setting: config.bindAddress defaults to empty, the
  # container proves a dual-stack listener at startup and binds "::". Nothing
  # in Kubernetes checks what address the container bound - on a dual-stack
  # cluster the IPv6 EndpointSlice is populated from the pod's own IPv6 address
  # regardless, and kubelet probes only the primary podIP - so an IPv4-only
  # listener here fails silently. That is now reachable only by pinning it:
  # config.bindAddress="0.0.0.0", or an extraEnv HOSTNAME entry with an IPv4
  # literal. Do not pair either with a dual-stack policy.
  ipFamilyPolicy: ""
  # -- Explicit family order, e.g. ["IPv4", "IPv6"]. Empty leaves the choice to
  # the cluster's own default family. Entry 0 is the PRIMARY family: it is what
  # spec.clusterIP (the address every IPv4-only client reads) is allocated from,
  # and it is immutable - reordering the list on a live Service is rejected
  # ("may not change once set"), so switching primaries needs the Service
  # deleted and recreated. Two entries require service.ipFamilyPolicy to be
  # PreferDualStack or RequireDualStack; the chart refuses to render otherwise.
  # Naming a family the cluster does not have is rejected even under
  # PreferDualStack, so leave this empty unless the order matters.
  ipFamilies: []

ingress:
  # -- Enable Ingress
  enabled: false
  # -- Ingress class name (e.g., nginx, traefik)
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: libredb.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []
  #  - secretName: libredb-tls
  #    hosts:
  #      - libredb.local

route:
  # -- Labels added to every enabled route (a per-route `labels` entry with the
  # same key wins). Because `labels` and `annotations` are read as shared
  # settings here, they are reserved key names and cannot be used as route names.
  labels: {}
  # -- Annotations added to every enabled route (a per-route `annotations` entry
  # with the same key wins). Reserved key name, as `labels` above.
  annotations: {}

  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1
    # -- Set the route kind. `HTTPRoute` is the only accepted value (enforced by
    # values.schema.json): only an HTTPRoute-shaped body is rendered, so any other
    # kind would produce a manifest the API server rejects.
    kind: HTTPRoute

    annotations: {}
    labels: {}

    hostnames: []
    # - libredb.local
    # -- Required whenever this route is enabled: rendering fails without it. It
    # cannot be defaulted because the Gateway to attach to is specific to each
    # cluster's Gateway API install (name, namespace and listener).
    parentRefs: []
    # - name: traefik-gateway
    #   namespace: traefik
    #   sectionName: websecure

    matches:
      - path:
          type: PathPrefix
          value: /

    ## Filters define the filters that are applied to requests that match this rule.
    filters: []

    ## Additional custom rules that can be added to the route
    additionalRules: []

    ## httpsRedirect adds a filter for redirecting to https (HTTP 301 Moved Permanently).
    httpsRedirect: false

# OpenShift Route (route.openshift.io/v1), independent of ingress.* and route.*.
# Needs a cluster that serves route.openshift.io/v1, or
# global.compatibility.openshift.apis=force; otherwise the render fails.
openshiftRoute:
  # -- Render an OpenShift Route to the Service's http port
  enabled: false
  # -- Route host; empty lets the router generate one. Setting a host needs the
  # routes/custom-host permission in the namespace.
  host: ""
  tls:
    # -- TLS termination. Only "edge" is accepted: the router terminates TLS,
    # because the image serves plain HTTP and has no TLS listener for
    # reencrypt or passthrough.
    termination: edge
    # -- What the router does with plain HTTP: Redirect, Allow or None
    insecureEdgeTerminationPolicy: Redirect
  # -- haproxy.router.openshift.io/timeout. The router cuts a request after 30s
  # by default; this must exceed the largest per-connection queryTimeout an
  # admin allows (Studio's default query timeout is 60s). Empty omits it.
  timeout: 120s
  # -- haproxy.router.openshift.io/hsts_header, e.g. "max-age=31536000";
  # empty omits it
  hstsHeader: ""
  # -- Extra Route annotations (an entry with the same key as the timeout or
  # HSTS annotation wins)
  annotations: {}
  # -- Extra Route labels (the chart's own labels win on a collision)
  labels: {}

# OpenShift-only settings beside openshiftRoute.
openshift:
  trustedCABundle:
    # -- Mount the cluster's trusted CA bundle (the proxy's trustedCA plus the
    # system roots), which the Cluster Network Operator injects into a labelled
    # ConfigMap, and point NODE_EXTRA_CA_CERTS at it, so Studio trusts the
    # private CAs the cluster trusts. Needs config.openshift.io/v1 (or
    # global.compatibility.openshift.apis=force) and refuses an extraEnv
    # NODE_EXTRA_CA_CERTS. See "Trusting a private CA" for other clusters.
    enabled: false
  topology:
    # -- app.kubernetes.io/part-of on every Deployment the chart renders and its
    # pod template, e.g. "libredb", shown as an application in the OpenShift
    # console's Topology selector (a Helm install is grouped by its release).
    # Empty renders no label. The bundled PostgreSQL takes the same label
    # through postgresql.commonLabels.
    partOf: ""
    # -- app.openshift.io/runtime on the same objects, the Topology node icon,
    # e.g. "nodejs". Empty renders no label.
    runtime: ""

networkPolicy:
  # -- Enable NetworkPolicy
  enabled: false
  # -- Additional ingress rules
  additionalIngress: []
  # -- Additional egress rules
  additionalEgress: []

# =============================================================================
# Autoscaling & HA
# =============================================================================
autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 2
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 75
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

# -- Records that the operator configured cookie affinity at the ingress or load balancer,
# so that each browser stays on one pod. Studio keeps interactive transactions, rate limits
# and per-user providers in process memory, so under governance.enabled more than one
# replica (or autoscaling) renders only with this set. The chart renders no affinity
# annotation and has no cookie name value: the affinity belongs to the ingress controller.
stickySessions:
  enabled: false

podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: false
  # -- Minimum available pods (mutually exclusive with maxUnavailable; unset the
  # default with --set podDisruptionBudget.minAvailable=null when using maxUnavailable)
  minAvailable: 1
  # -- Maximum unavailable pods (mutually exclusive with minAvailable)
  # maxUnavailable: 1

# =============================================================================
# PostgreSQL Subchart (Bitnami)
# =============================================================================
postgresql:
  # -- Deploy a PostgreSQL instance for storage backend
  enabled: false
  # Broadcom's August 2025 Bitnami catalog freeze removed the version-pinned
  # postgresql images from docker.io/bitnami (the chart-pinned tag now 404s);
  # they live on unchanged under docker.io/bitnamilegacy, which receives no
  # further updates. This override keeps the subchart installable. For
  # production, prefer an external database (secrets.storagePostgresUrl) or a
  # dedicated operator such as CloudNativePG.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  # The subchart's optional helper images moved to bitnamilegacy the same way.
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  metrics:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
  auth:
    # -- PostgreSQL username
    username: "libredb"
    # -- PostgreSQL password
    password: ""
    # -- PostgreSQL database name
    database: "libredb_storage"
  tls:
    # -- Serve the bundled PostgreSQL over TLS. Off (the subchart's default), the chart
    # writes sslmode=disable into STORAGE_POSTGRES_URL; on, it writes no sslmode and
    # Studio connects with TLS. Turning it on also needs the subchart's certificate
    # settings (postgresql.tls.autoGenerated or postgresql.tls.certificatesSecret).
    enabled: false

# =============================================================================
# Scheduling
# =============================================================================
# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []

# =============================================================================
# Extra configuration
# =============================================================================
# -- Additional environment variables
extraEnv: []
#  - name: MY_VAR
#    value: "my-value"

# -- Additional envFrom references
extraEnvFrom: []
#  - configMapRef:
#      name: my-config

# -- Additional volumes for the pod, e.g. a private CA from a ConfigMap or Secret
extraVolumes: []
#  - name: internal-ca
#    configMap:
#      name: internal-ca

# -- Additional volume mounts for the app container. With the volume above, point
# NODE_EXTRA_CA_CERTS (extraEnv) at the file so the OIDC issuer or Vault is trusted.
extraVolumeMounts: []
#  - name: internal-ca
#    mountPath: /etc/ssl/internal
#    readOnly: true

# -- Additional Kubernetes objects deployed with the release, each rendered
# through tpl. A string item is taken as a template as it is. Write a literal
# {{ as {{ "{{" }}, or the install fails.
extraObjects: []
#  - apiVersion: v1
#    kind: ConfigMap
#    metadata:
#      name: my-config
#    data:
#      key: value

# -- Seed connections: pre-configured database connections
seedConnections:
  # -- Enable seed connections feature
  enabled: false
  # -- Inline config (rendered as YAML in ConfigMap)
  config: {}
  # -- Use an existing ConfigMap instead of inline config
  existingConfigMap: ""
  # -- Use an existing Secret instead of inline config, for a seed file that holds passwords.
  # It is mounted read-only at /app/config like the ConfigMap. Set one source only: config,
  # existingConfigMap or existingSecret.
  existingSecret: ""
  # -- Key within the ConfigMap or Secret containing the YAML config
  configMapKey: "seed-connections.yaml"
  # -- Cache TTL in milliseconds for config reloading
  cacheTTL: 60000

# =============================================================================
# Rancher Manager
# =============================================================================
rancher:
  navLink:
    # -- Render a ui.cattle.io/v1 NavLink, Rancher's link in the cluster's navigation, to
    # https://<first ingress host><config.basePath>. Rendered only when the cluster serves
    # the NavLink API, and NOTES.txt says when it does not. Needs ingress.enabled with a
    # host, and TLS for that host, since the link is always https. A NavLink is
    # cluster-scoped, so installing it needs a cluster owner. Not offered through the OLM
    # operator, whose role grants no NavLink.
    enabled: false
    # -- The link's text
    label: "LibreDB Studio"
    # -- The navigation group the link appears under
    group: "Databases"
    # -- The browser target the link opens in
    target: "_blank"
    # -- The link's icon, as an https URL or a data:image URI. Empty uses the LibreDB logo,
    # inline, so the browser fetches nothing; Rancher draws a book when a link has none.
    iconSrc: ""

# =============================================================================
# Kubernetes access review (docs/SEED_CONNECTIONS.md, "Kubernetes access review")
# =============================================================================
# Studio asks the Kubernetes API, through a SubjectAccessReview as the signed-in
# identity provider subject, who may sign in, who is an admin (whoever may update
# Studio's own Deployment) and who may use each Kubernetes-discovered database
# (whoever may get its credential Secret). Until enabled is true, nothing below is
# rendered.
#
# Enabled, the chart writes KUBERNETES_ACCESS_REVIEW=on and the admin Deployment,
# grants Studio's ServiceAccount create on subjectaccessreviews through a
# ClusterRole and ClusterRoleBinding named <namespace>.<fullname>-access-review,
# and mounts a projected token and the cluster's CA for the reviews only, read-only
# at /var/run/secrets/libredb/access-review; the pod's own token mount stays as
# serviceAccount.automountServiceAccountToken says. The ClusterRole needs a cluster
# owner to install. It writes no ADMIN_PASSWORD, USER_EMAIL or USER_PASSWORD from
# secrets.existingSecret. The render fails, naming the value, for every combination
# Studio refuses to start with: authProvider other than oidc, config.oidcRoleClaim,
# mcp.enabled, agent.enabled=true, governance.enabled, secrets.adminPassword or
# secrets.userPassword, config.sessionTtlSeconds unset or above 900, more than one
# replica or autoscaling (the groups record and the caches live in one process),
# serviceAccount.create=false with no serviceAccount.name (the namespace's default
# account would get the right), or an extraEnv entry named KUBERNETES_ACCESS_REVIEW*.
accessReview:
  # -- Switch the access review on.
  enabled: false
  # -- KUBERNETES_ACCESS_REVIEW_CACHE_SECONDS: how long an answer is kept, whole
  # seconds from 0 to 60. null (the default) writes nothing and the app keeps 30;
  # Rancher installs use 15.
  cacheSeconds: null
  # -- KUBERNETES_ACCESS_REVIEW_SIGN_IN: the review a person must pass to sign in,
  # as kubectl auth can-i takes it. Empty (the default) writes nothing and the app
  # keeps "list navlinks.ui.cattle.io", which on Rancher every role a cluster grants
  # allows; set it on a cluster without Rancher.
  signIn: ""
  # -- Lifetime of the projected token the reviews authenticate with, in seconds,
  # from 600 to 86400. The kubelet renews it before it expires.
  tokenExpirationSeconds: 3600

# =============================================================================
# Kubernetes discovery (docs/SEED_CONNECTIONS.md, "Platform discovery (Kubernetes)")
# =============================================================================
discovery:
  # Lists the CloudNativePG databases of the namespaces below as managed connections.
  # Until enabled is true, nothing below is rendered.
  #
  # Enabled, the chart runs the exporter (docker/discover-kubernetes.mjs) as a
  # Deployment <fullname>-discovery of one replica from Studio's image, with a
  # ServiceAccount of its own, gives that account list on clusters.postgresql.cnpg.io
  # and get on secrets in each namespace below (a Role and RoleBinding
  # <fullname>-discovery there, so the namespaces must exist) and get and update on
  # the export Secret by name, creates the export Secret <fullname>-discovery-export
  # with no data, mounts it read-only into Studio's pod and writes
  # SEED_KUBERNETES_DISCOVERY_PATH and SEED_CACHE_TTL_MS (seedConnections.cacheTTL).
  # Without the access review the discovered databases are listed for admins only.
  # The render fails with no namespace, with governance.enabled, with more than one
  # replica or autoscaling, or with an extraEnv entry named SEED_KUBERNETES_DISCOVERY*.
  kubernetes:
    # -- Run the exporter and read its export.
    enabled: false
    # -- The namespaces to discover, at most 256 (KUBERNETES_DISCOVERY_NAMESPACES).
    namespaces: []
    # -- Time between scans in milliseconds, at least 5000 (KUBERNETES_DISCOVERY_INTERVAL_MS).
    intervalMs: 30000
    # -- The kinds to discover: cnpg (CloudNativePG), edbpg (EDB Postgres for
    # Kubernetes), pgo (Crunchy PGO) and mongo (MongoDB Community). Empty (the
    # default) writes nothing and the exporter discovers cnpg alone. Each kind needs
    # its CRD on the cluster, or every discovered namespace reports crd_missing and is
    # withdrawn; the exporter's Roles list exactly these kinds. mongo lets the MongoDB
    # driver follow the replica set members the server advertises, which only an
    # egress policy confines.
    kinds: []
    # -- SEED_KUBERNETES_DISCOVERY_MAX_AGE_MS: age of the last good scan after which
    # the discovered connections are withdrawn. null (the default) writes nothing and
    # the app keeps 180000; keep it above intervalMs plus 90000.
    maxAgeMs: null
    # -- Resources of the exporter container.
    resources: {}
