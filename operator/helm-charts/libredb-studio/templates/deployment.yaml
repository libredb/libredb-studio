{{- /*
Zero-config bootstrap generates JWT_SECRET per pod on its own data volume, so
two replicas would sign sessions with different keys (intermittent 401s behind
the Service). Refuse the combination instead of shipping it broken.
*/}}
{{- if and (not (include "libredb-studio.authStrict" .)) (not .Values.secrets.jwtSecret) (not .Values.secrets.existingSecret) (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1)) }}
{{- fail "zero-config bootstrap generates a per-pod JWT secret, which breaks sessions across replicas: with replicaCount > 1 or autoscaling.enabled, set secrets.jwtSecret (or secrets.existingSecret), or use config.authBootstrap=off" }}
{{- end }}
{{- /*
The seed ConfigMap is only rendered from inline config; with neither an
inline config nor an existing ConfigMap the pod would mount a ConfigMap
that does not exist and never start. Refuse the combination instead.
*/}}
{{- if and .Values.seedConnections.enabled (not .Values.seedConnections.config) (not .Values.seedConnections.existingConfigMap) }}
{{- fail "seedConnections.enabled requires either seedConnections.config (inline) or seedConnections.existingConfigMap - with neither, the pod would mount a ConfigMap that does not exist" }}
{{- end }}
{{- /*
The permission-fix init container needs root, which OpenShift's restricted-v2
SCC rejects - and where the SCC applies, the pod's UID/GID come from the
namespace range instead of podSecurityContext, so chowning to the configured
runAsUser/fsGroup would target the wrong owner anyway. Refuse the combination
rather than render a manifest that cannot work (#170).
*/}}
{{- if and .Values.persistence.fixPermissions (include "libredb-studio.adaptOpenShiftSecurityContext" .) }}
{{- fail "persistence.fixPermissions cannot be combined with the OpenShift security-context adaptation: restricted-v2 rejects the root init container, and the pod's UID/GID come from the namespace range rather than podSecurityContext, so the chown would target the wrong owner. On OpenShift, use a storage class whose volumes the kubelet applies fsGroup to (or pre-chown the volume) and leave persistence.fixPermissions=false; set global.compatibility.openshift.adaptSecurityContext=disabled only if this is not an OpenShift cluster" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "libredb-studio.fullname" . }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
spec:
  {{- if not (include "libredb-studio.autoscalingEnabled" .) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "libredb-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "libredb-studio.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "libredb-studio.serviceAccountName" . }}
      securityContext:
        {{- include "libredb-studio.podSecurityContext" . | nindent 8 }}
      {{- /* The kubelet does not apply fsGroup to hostPath (and some local) volumes, so a
             statically provisioned PV leaves /app/data unwritable until someone chowns it.
             Opt-in, and only with a real volume: it needs a root container, which the
             restricted-v2 SCC on OpenShift rejects, and an emptyDir gets fsGroup anyway (#170). */}}
      {{- if and (include "libredb-studio.persistenceEnabled" .) .Values.persistence.fixPermissions }}
      initContainers:
        - name: fix-data-permissions
          image: {{ include "libredb-studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} /app/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "libredb-studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "libredb-studio.configMapName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.secrets.jwtSecret .Values.secrets.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.jwtSecret }}
                  {{- if not (include "libredb-studio.authStrict" .) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.secrets.adminEmail .Values.secrets.existingSecret }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.adminEmail }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.adminPassword .Values.secrets.existingSecret }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.adminPassword }}
                  {{- /* A hard ref only where a missing password really is an error: strict
                         mode AND the local provider. Under OIDC the app never reads it, so an
                         existingSecret built for OIDC must not keep the pod from starting (#170). */}}
                  {{- if not (and (include "libredb-studio.authStrict" .) (include "libredb-studio.localAuth" .)) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.secrets.userPassword .Values.secrets.existingSecret }}
            - name: USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.userEmail }}
                  optional: true
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.userPassword }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.llmApiKey .Values.secrets.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.llmApiKey }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.oidcClientId .Values.secrets.existingSecret }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.oidcClientId }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.oidcClientSecret .Values.secrets.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.oidcClientSecret }}
                  optional: true
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.postgresql.fullname" . }}
                  key: password
            - name: STORAGE_POSTGRES_URL
              value: {{ include "libredb-studio.postgresql.url" . | quote }}
            {{- else if or .Values.secrets.storagePostgresUrl .Values.secrets.existingSecret }}
            - name: STORAGE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.storagePostgresUrl }}
                  optional: true
            {{- end }}
            {{- if .Values.seedConnections.enabled }}
            - name: SEED_CONFIG_PATH
              value: "/app/config/{{ .Values.seedConnections.configMapKey | default "seed-connections.yaml" }}"
            - name: SEED_CACHE_TTL_MS
              value: {{ .Values.seedConnections.cacheTTL | default 60000 | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            {{- if .Values.seedConnections.enabled }}
            - name: seed-config
              mountPath: /app/config
              readOnly: true
            {{- end }}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if include "libredb-studio.persistenceEnabled" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "libredb-studio.pvcName" . }}
        {{- else }}
        - name: data
          {{- /* /app/data is the one volume a user can grow (SQLite storage, seeded samples),
                 so it is the one worth capping. Empty stays uncapped: a retroactive limit
                 would start evicting pods that are fine today (#170). */}}
          {{- if .Values.persistence.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.seedConnections.enabled }}
        - name: seed-config
          configMap:
            name: {{ .Values.seedConnections.existingConfigMap | default (printf "%s-seed-connections" (include "libredb-studio.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
