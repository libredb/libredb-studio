{{- if .Values.networkPolicy.enabled }}
{{- $onOpenShift := include "libredb-studio.openshiftApiServed" (dict "ctx" $ "api" "security.openshift.io/v1") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "libredb-studio.fullname" . }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "libredb-studio.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        {{- if $onOpenShift }}
        # OpenShift's dns-default Service listens on 53 and forwards to the CoreDNS pods on 5353;
        # a policy is matched after that rewrite, so 53 alone leaves resolution failing there.
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
        {{- end }}
    # Allow HTTPS outbound (for database connections, AI APIs, OIDC)
    - ports:
        - port: 443
          protocol: TCP
    {{- if or (include "libredb-studio.accessReviewEnabled" .) $onOpenShift }}
    # The access review calls https://kubernetes.default.svc, which kube-proxy rewrites to the
    # API server's endpoint port, 6443 on RKE2, k3s and kubeadm. A policy is matched after that
    # rewrite, so 443 alone leaves every review failing closed. On OpenShift the API server
    # also listens on 6443 behind that Service, and sign-in, self reviews and discovery reach
    # it there. One rule serves both, so 6443 appears once. An API server on another
    # port goes in networkPolicy.additionalEgress.
    - ports:
        - port: 6443
          protocol: TCP
    {{- end }}
    # Allow common database ports
    - ports:
        - port: 5432
          protocol: TCP
        - port: 3306
          protocol: TCP
        - port: 1521
          protocol: TCP
        - port: 1433
          protocol: TCP
        - port: 27017
          protocol: TCP
        - port: 6379
          protocol: TCP
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
