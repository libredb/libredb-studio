# The manager's cluster-wide rights. The operator manages only its own
# namespace, and everything it renders there is granted by the Role in
# namespace_role.yaml. This ClusterRole holds only what must reach other
# namespaces or cluster-scoped kinds. It holds no rule on libredbstudios and no
# list or watch on Secrets, so a controller whose watch is widened past its own
# namespace cannot fill its cache and exits instead of reconciling.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get

##
## Rules for studio.libredb.org/v1alpha1, Kind: LibreDBStudio
##
# Kubernetes discovery renders a Role and a RoleBinding in each discovered
# namespace (templates/kubernetes-discovery.yaml); the bundled PostgreSQL
# subchart can render a Role and a RoleBinding in the operator's namespace
# behind rbac.create.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The discovery Role grants get on Secrets and Services in its namespace, and
# Kubernetes lets the operator create a Role only with verbs it holds there.
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - get
# openshift.consoleLink.enabled renders a cluster-scoped ConsoleLink, which the
# chart renders only for the LibreDBStudio in the operator's own namespace
# (operator.clusterStudioNamespace). Every authenticated user may already
# read ConsoleLinks, so no reader role ships.
- apiGroups:
  - console.openshift.io
  resources:
  - consolelinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# openshift.consolePlugin.enabled renders the cluster-scoped ConsolePlugin
# libredb-studio, again only for that LibreDBStudio. A create cannot be limited
# by name and the watch lists the kind, so those stay open; every verb that
# changes or reads an existing object holds only for libredb-studio, the one
# name the chart renders, so the operator can rewrite or delete no other plugin.
# Nothing on consoles: a cluster admin turns the plugin on.
- apiGroups:
  - console.openshift.io
  resources:
  - consoleplugins
  verbs:
  - create
  - list
  - watch
- apiGroups:
  - console.openshift.io
  resourceNames:
  - libredb-studio
  resources:
  - consoleplugins
  verbs:
  - delete
  - get
  - patch
  - update
# Kubernetes discovery renders a Role in each discovered namespace that lets the
# exporter list these kinds (discovery.kubernetes.kinds), and Kubernetes lets
# the operator create a Role only with verbs it holds itself. Read-only: the
# operator never changes a database resource.
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.k8s.enterprisedb.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgres-operator.crunchydata.com
  resources:
  - postgresclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mongodbcommunity.mongodb.com
  resources:
  - mongodbcommunity
  verbs:
  - get
  - list
  - watch

# A rule added here holds in every namespace; a namespaced rule belongs in
# namespace_role.yaml.
# +kubebuilder:scaffold:rules
