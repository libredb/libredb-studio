apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for studio.libredb.org/v1alpha1, Kind: LibreDBStudio
##
- apiGroups:
  - studio.libredb.org
  resources:
  - libredbstudios
  - libredbstudios/status
  - libredbstudios/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - services/finalizers
  - endpoints
  - persistentvolumeclaims
  - events
  - configmaps
  - secrets
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The chart renders these behind feature flags (ingress.enabled,
# networkPolicy.enabled, autoscaling.enabled, podDisruptionBudget.enabled)
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The bundled PostgreSQL subchart can render these behind its own flags
# (passwordUpdateJob -> Job, backup -> CronJob, rbac.create -> Role/RoleBinding)
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The chart renders an HTTPRoute per enabled route.<name> (route.main.enabled);
# without this rule the release fails with "cannot get resource httproutes"
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# (postgresql.metrics.serviceMonitor / prometheusRule flags; rules for CRDs
# that may not exist on the cluster are harmless)
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  - prometheusrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# openshiftRoute.enabled renders a route.openshift.io Route with the host the
# resource sets; setting spec.host needs create on routes/custom-host, and
# changing it on an existing Route needs update there, or the API server
# refuses the Route
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - route.openshift.io
  resources:
  - routes/custom-host
  verbs:
  - create
  - update
# openshift.consoleLink.enabled renders a cluster-scoped ConsoleLink, which the
# chart renders only for the LibreDBStudio in the namespace the cluster admin
# names (LIBREDB_CLUSTER_STUDIO_NAMESPACE). Every authenticated user may already
# read ConsoleLinks, so no reader role ships. No consoleplugins rule: the console
# plugin is not part of this release.
- apiGroups:
  - console.openshift.io
  resources:
  - consolelinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Kubernetes discovery renders a Role in each discovered namespace that lets the
# exporter list these kinds (discovery.kubernetes.kinds), and Kubernetes lets
# the operator create a Role only with verbs it holds itself. Read-only: the
# operator never changes a database resource.
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.k8s.enterprisedb.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgres-operator.crunchydata.com
  resources:
  - postgresclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mongodbcommunity.mongodb.com
  resources:
  - mongodbcommunity
  verbs:
  - get
  - list
  - watch

# +kubebuilder:scaffold:rules
