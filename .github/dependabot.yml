# Dependabot version updates (docs/BACKLOG.md C5).
#
# Grouping is the whole point of this file. Ungrouped, a repository with ~1170
# installed packages raises one pull request per package, every one of which has
# to pass the same six gates as a human's - and the 100 percent line-coverage
# gate means a bot pull request is never a rubber stamp. So updates are batched
# into a handful of pull requests a week, split only where the split changes how
# a reviewer reads them: what ships versus what does not.
#
# Bun is its own ecosystem (`package-ecosystem: "bun"`), NOT part of `npm`. The
# `npm` ecosystem covers npm, pnpm and Yarn - internally Dependabot calls it
# `npm_and_yarn` - so its updater looks for package-lock.json, pnpm-lock.yaml or
# yarn.lock, and cannot see `bun.lock` at all. Configuring bun under `npm` is what
# shipped in #375, and the result was five pull requests that bumped
# `package.json` alone - every CI job then died in its first step on
# `error: lockfile had changes, but lockfile is frozen`. That internal name was
# the tell twice over: the compatibility badge in those pull request bodies said
# `package-manager=npm_and_yarn`, and the branches were called
# `dependabot/npm_and_yarn/...`. Only version updates work today; Bun security
# updates are not implemented upstream, which is why the security side still runs
# through Trivy and `bun audit`.
#
# CI installs with `bun install --frozen-lockfile` (scripts/ci-install.sh), so a
# pull request whose `bun.lock` does not match its `package.json` fails loudly
# rather than resolving around the difference. That is the safety net behind
# every group below - and it worked exactly as designed above; the bug was the
# ecosystem name, never the gate.

version: 2

updates:
  # ---------------------------------------------------------------------- bun
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    # Every group batches minor and patch only, which means a major that is not
    # ignored below arrives as its own pull request. That is deliberate, not an
    # oversight: batching majors with routine updates makes one pull request that
    # cannot be merged as a unit - refusing recharts 3 would also hold back the
    # `next` patch riding along with it - and majors are individually a decision
    # rather than a bump. The fan-out is bounded: nine majors are outstanding as
    # of 2026-08-15 across ~1170 installed packages, and open-pull-requests-limit
    # caps how many wait at once.
    #
    # `dependency-type` under `bun` works, despite the warning. The options
    # reference lists it inside `groups` for bundler, composer, mix, maven, npm
    # and pip only, and every bun run logs "The 'dependency-type' option is not
    # supported for the 'bun' package manager ... This option will be ignored"
    # (update jobs 1672062153 and 1673702438, Actions runs 41381574627 and
    # 41433090980, 2026-11-02). It is not ignored: that
    # check only writes the warning, while DependencyGroup#contains? in
    # dependabot-core applies the rule for every package manager. Both runs
    # split the two groups cleanly: #2167 and #2188 hold production
    # dependencies only, #2168 development ones only. If a later Dependabot
    # release starts doing what the warning says, both groups match everything
    # and the split collapses into one pull request; separate them with
    # `patterns` then.
    groups:
      # The node-opcua trio, in one pull request of its own. node-opcua-client
      # and node-opcua-certificate-manager ship and node-opcua-server is the
      # devDependency the integration suite starts, so without this group they
      # split across the production and development pull requests whenever
      # both sides have an update. They move together and to one version
      # (781e89b6c, docs/providers/opcua.md section 2.1): a client and server
      # on different releases install a second node-opcua-types, whose classes
      # then register twice.
      #
      # Group order does not decide this, whatever the options reference says
      # about "the first group that it matches". dependabot-core ranks every
      # group that contains a dependency by pattern specificity, and a group
      # with no `patterns` scores 500 against 97 for "node-opcua-*"
      # (PatternSpecificityCalculator). With this group first, update job
      # 1673702438 (Actions run 41433090980) still logged "Skipping
      # node-opcua-client for group 'node-opcua' - belongs to more specific
      # group 'production'", the same for the other two, then "Skipping update
      # group for 'node-opcua' as it does not match any allowed dependencies".
      # So the two groups below exclude the trio with `exclude-patterns`,
      # which makes them stop containing it at all.
      #
      # It does not make the three share a version: Dependabot offers each
      # package its own newest release, and the monorepo publishes a package
      # only when it changes (there is no node-opcua-certificate-manager
      # 2.187.18), so check that all three land on one version before merging.
      node-opcua:
        applies-to: version-updates
        patterns: ["node-opcua-*"]
        update-types: ["minor", "patch"]

      # What ships. Kept separate from tooling because a reviewer weighs these
      # against "does the editor still work in a browser", not "does lint pass".
      production:
        applies-to: version-updates
        dependency-type: "production"
        exclude-patterns: ["node-opcua-*"]
        update-types: ["minor", "patch"]

      # What never leaves CI or a developer's machine. Safe to batch wide: the
      # gates are themselves the test of a tooling bump.
      development:
        applies-to: version-updates
        dependency-type: "development"
        exclude-patterns: ["node-opcua-*"]
        update-types: ["minor", "patch"]

    ignore:
      # Database driver majors are deliberate work, not a merge. Each one is
      # bound by the provider tri-sync rule (code, docs and tests move in the
      # same pull request) and, more importantly, our unit tests mock these
      # drivers - so a major that changes wire behaviour passes CI green and
      # breaks only against a real server. ioredis 6 is the live example: it
      # defaults to RESP3, and src/lib/db/providers/keyvalue/redis.ts parses
      # INFO, SLOWLOG GET and CLIENT LIST by hand. A bot pull request for that
      # would look safe and would not be. Patch and minor updates still flow.
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "oracledb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mssql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongodb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]

      # The agent runtime is pinned to exact versions the owner ratified, and
      # tests/unit/agent-dependency-boundary.test.ts fails if any of them moves.
      # A bot bump here is a guaranteed red build, so do not raise one.
      - dependency-name: "ai"
      - dependency-name: "workflow"
      - dependency-name: "@workflow/world-local"
      - dependency-name: "@workflow/world-postgres"
      - dependency-name: "@ai-sdk/openai"
      - dependency-name: "@ai-sdk/google"
      - dependency-name: "@ai-sdk/anthropic"

      # Exact-pinned on purpose: the html-to-image family mis-renders Tailwind 4
      # computed styles, which is why the ER diagram export uses this engine and
      # this version (see tsup.config.ts). Moving it is an export-quality
      # decision to make in a browser, not a version bump.
      - dependency-name: "@zumer/snapdom"

      # db2-node 1.0.26 and 1.0.27 intermittently fail a statement with
      # QRYNOPRM on a live Db2, where 1.0.25 passes the live check 8 of 8
      # (docs/BACKLOG.md P11). Our unit tests mock the driver, so the bump goes
      # green in CI, and the weekly production group proposed it again in #1966
      # and #2167, to be held by hand. Only these two versions are ignored, so a
      # later release is still proposed, and it is measured live before it
      # merges. Remove this entry when P11 closes.
      - dependency-name: "db2-node"
        versions: ["1.0.26", "1.0.27"]

      # neo4j-driver-lite 6.3.0 waits for the agent-boundary captures of
      # tests/live/neo4j-agent-captures.ts, which need Neo4j Enterprise, whose
      # licence only the person running them can accept (docs/BACKLOG.md P13).
      # The weekly production group proposed it in #2167 and again in #2188, to
      # be held by hand each time. Only this version is ignored, so a later
      # release is still proposed, and it is measured before it merges. Remove
      # this entry when the pin moves and P13 closes.
      - dependency-name: "neo4j-driver-lite"
        versions: ["6.3.0"]

      # Held at the major @simplewebauthn/server depends on (^2.1.0 as of
      # 14.0.3). tests/helpers/attestation-chain.ts builds attestation chains
      # with it, and tests/unit/lib/passkey/dependency-floor.test.ts fails unless
      # this range equals the server's own, so both resolve to one copy. Two
      # copies register into the one shared tsyringe container and the first to
      # load answers for both: measured with x509 3 beside the server's x509 2
      # (#2169), certificate generation fails with "Cannot get schema for
      # 'AlgorithmIdentifier' target", and node-opcua-crypto, split off onto its
      # own nested copy, fails the same way once the server has loaded. Lift
      # this when a server release moves to x509 3.
      - dependency-name: "@peculiar/x509"
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------- VS Code extension
  # vscode-extension/ is an npm package with its own package-lock.json (vsce
  # reads dependencies only through npm or Yarn 1), so it is the one place the
  # `npm` ecosystem is right. No groups: its packages are build and test tools,
  # and each bump is reviewed on its own (docs/TOOLCHAIN.md, "VS Code
  # extension"). The VS Code builds the tests run on, in
  # test/vscode-versions.json, are bumped by hand; the scheduled Insiders run
  # (.github/workflows/vscode-extension-insiders.yml) is the early warning.
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Pinned to the engines.vscode floor: vsce refuses typings above it, so
      # it moves only with the floor.
      - dependency-name: "@types/vscode"
      # Both runtimes, the job's Node and VS Code's Electron, are Node 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ------------------------------------------------------------ GitHub Actions
  # Actions are SHA-pinned with the human-readable tag in a trailing comment
  # (`uses: actions/checkout@de0fac2... # v6`). Dependabot moves both together,
  # which is the only practical way to keep SHA pinning current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # ------------------------------------------------------------------- Docker
  # Two Dockerfiles: the application image and the OLM operator image. The
  # generated .next/standalone/Dockerfile is build output and is not tracked.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/operator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      # `oven/bun:<version>` in the Dockerfile and `bun-version:` in the
      # workflows are the same number maintained in two places Dependabot cannot
      # see as one. Bumping only the image would build the release with a
      # different Bun than every CI job used - including a different lockfile
      # writer - and would still go green, which is the worst shape a drift can
      # take. Move both by hand, in one pull request.
      - dependency-name: "oven/bun"
