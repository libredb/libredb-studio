name: Release Artifacts

# Builds per-platform tarballs of the standalone Next.js server
# (libredb-studio-standalone-<version>-<os>-<arch>.tar.gz) and attaches them,
# plus a SHA256SUMS file, to the GitHub release. These tarballs are the
# canonical artifact consumed by downstream channels (npx, homebrew, deb).
# The linux-packages job additionally turns the linux tarballs into .deb and
# .rpm packages (nfpm + bundled Node runtime, issue #112) and attaches them.
# The publish job also renders the Homebrew formula from SHA256SUMS and pushes
# it to libredb/homebrew-tap when TAP_GITHUB_TOKEN is configured (issue #111).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.9.41 - no v prefix)'
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate version against package.json
        id: version
        # Event payload values go through env (never inline ${{ }} in run:) so a
        # crafted tag name or dispatch input cannot inject into the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PKG_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Version '$VERSION' is not a valid semver (no v prefix) - refusing to build release artifacts" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '$VERSION' - refusing to publish mismatched artifacts" >&2
            exit 1
          fi
          # Tarball names always derive from package.json (see the build
          # script), so a dispatched version must match it too.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Requested version '$VERSION' does not match package.json version '$PKG_VERSION' - refusing to publish mismatched artifacts" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

  build:
    name: Build standalone tarball (${{ matrix.platform }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-13
            platform: darwin-x64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        # Node runs the standalone server (and the smoke test); pin the major
        # to match the Dockerfile runner image and package.json engines.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build payload and run smoke test
        run: bash scripts/build-standalone-payload.sh dist --smoke

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.platform }}
          path: dist/libredb-studio-standalone-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach artifacts to release
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout provides the Homebrew formula template and its render script;
      # it must run before download-artifact so it cannot clobber dist/.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: standalone-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum libredb-studio-standalone-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.version }}
        run: |
          gh release upload "$TAG" dist/libredb-studio-standalone-*.tar.gz dist/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"

      # The Homebrew tap update is optional: it only runs when TAP_GITHUB_TOKEN
      # (a token with write access to libredb/homebrew-tap) is configured, so
      # forks without the secret still publish artifacts cleanly - mirroring
      # the DOCKER_HUB_TOKEN gate in docker-build-push.yml.
      - name: Check Homebrew tap availability
        id: tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_GITHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN is not configured - skipping the Homebrew tap update"
          fi

      - name: Render Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          node scripts/render-homebrew-formula.mjs \
            packaging/homebrew/libredb-studio.rb.tmpl \
            dist/SHA256SUMS \
            "$VERSION" \
            dist/libredb-studio.rb

      - name: Push formula to libredb/homebrew-tap
        if: steps.tap.outputs.enabled == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/libredb/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp dist/libredb-studio.rb "$TAP_DIR/Formula/libredb-studio.rb"
          cd "$TAP_DIR"
          git add Formula/libredb-studio.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula already up to date for ${VERSION} - nothing to push"
            exit 0
          fi
          git -c user.name=cevheri -c user.email=cevheribozoglan@gmail.com \
            commit -m "libredb-studio ${VERSION}"
          git push origin HEAD

  linux-packages:
    name: Build .deb and .rpm (${{ matrix.arch }})
    # Turns the linux standalone tarballs into native packages (issue #112):
    # unpack the payload, bundle the pinned Node runtime (fetch-node.sh),
    # run nfpm (one config -> both formats), smoke test the .deb on the
    # amd64 runner, and attach the packages to the release.
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64 # nfpm/GOARCH label
            tarball_arch: x64 # release tarball + nodejs.org label
            rpm_arch: x86_64
          - arch: arm64
            tarball_arch: arm64
            rpm_arch: aarch64
    env:
      NFPM_VERSION: 2.47.0
      # sha256 of nfpm_2.47.0_Linux_x86_64.tar.gz from the release checksums.txt
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download linux tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-linux-${{ matrix.tarball_arch }}
          path: dist

      - name: Install nfpm (pinned, checksum-verified)
        run: |
          curl -fsSL --retry 3 -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          mkdir -p /tmp/nfpm-dist
          tar -xzf /tmp/nfpm.tar.gz -C /tmp/nfpm-dist nfpm
          sudo install -m 0755 /tmp/nfpm-dist/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Unpack payload and bundle Node runtime
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TARBALL_ARCH: ${{ matrix.tarball_arch }}
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD_DIR"
          tar -xzf "dist/libredb-studio-standalone-${VERSION}-linux-${TARBALL_ARCH}.tar.gz" -C "$PAYLOAD_DIR"
          bash packaging/linux/fetch-node.sh "$PAYLOAD_DIR" "$TARBALL_ARCH"
          echo "PAYLOAD_DIR=$PAYLOAD_DIR" >> "$GITHUB_ENV"

      - name: Build .deb and .rpm with nfpm
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          mkdir -p pkgs
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t "pkgs/libredb-studio_${VERSION}_${ARCH}.deb"
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "pkgs/libredb-studio-${VERSION}.${RPM_ARCH}.rpm"
          ls -l pkgs

      - name: Smoke test the .deb (native arch only)
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo dpkg -i "pkgs/libredb-studio_${VERSION}_${ARCH}.deb"
          # No systemd smoke on shared runners: run the packaged wrapper
          # directly; zero-config bootstrap generates the missing secrets.
          # HOSTNAME pins the bind address (an inherited HOSTNAME env var
          # would make the server bind the machine hostname instead).
          sudo env STORAGE_SQLITE_PATH=/var/lib/libredb-studio-smoke/storage.db \
            HOSTNAME=127.0.0.1 \
            libredb-studio > /tmp/studio-smoke.log 2>&1 &
          HEALTHY=false
          for _ in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/db/health || true)
            if [ "$CODE" = "200" ]; then HEALTHY=true; break; fi
            sleep 1
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "Smoke test FAILED: /api/db/health did not return 200 within 30s" >&2
            cat /tmp/studio-smoke.log >&2 || true
            exit 1
          fi
          grep -q "first run: generated admin credentials" /tmp/studio-smoke.log
          echo "Smoke: /api/db/health returned 200 and first-run banner printed"

      - name: Upload packages to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.version }}
        run: gh release upload "$TAG" pkgs/* --clobber --repo "$GITHUB_REPOSITORY"
