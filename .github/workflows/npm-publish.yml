name: NPM Publish

# Publish when a GitHub Release is published, regardless of the tag's naming
# (the project uses plain "0.9.x" tags now, but older ones were "v0.9.x" — a
# tag-name filter kept missing the plain ones). The release commit's
# package.json is the version source. workflow_dispatch remains a manual fallback.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.9.8). Leave empty to use package.json version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    # Product releases only: chart releases (libredb-studio-<chart-version>)
    # are published by helm-release.yml and must not reach npm.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'libredb-studio-')
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Per-file process isolation (run-core.sh) — bun's mock.module() is
        # process-wide, so the single-process `bun run test` is load-order flaky
        # here. This mirrors the reliable path ci.yml uses via test:coverage.
        run: bun run test:ci

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: test-secret-for-ci-build-only-32ch
          ADMIN_EMAIL: admin@libredb.org
          ADMIN_PASSWORD: test-admin
          USER_EMAIL: user@libredb.org
          USER_PASSWORD: test-user

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      # npm --provenance mints a Sigstore attestation from this job's GitHub
      # OIDC identity (repo + workflow + commit), so the tarball's trust root
      # sits outside the release it ships with. Job-level permissions replace
      # the workflow-level block entirely — contents: read must be repeated.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Build library (tsup)
        run: bun run build:lib

      - name: Set version (if provided)
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: npm version "$INPUT_VERSION" --no-git-tag-version

      - name: Verify package
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"

      # --provenance is deliberately absent here: a dry run publishes nothing,
      # so there is nothing to attest, and npm still tries to contact Sigstore
      # for it (a failure mode that would break the manual dry-run fallback).
      - name: Publish (dry run)
        if: inputs.dry_run == true
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      # --provenance requires id-token: write (above), a public package, and a
      # resolvable package.json repository field. npm generates and uploads the
      # Sigstore bundle itself; no extra secret and no cosign install needed.
      - name: Publish
        if: inputs.dry_run != true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## Published @libredb/studio@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** https://www.npmjs.com/package/@libredb/studio" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Install:** \`npm install @libredb/studio@${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  dispatch-smoke:
    # npx-engine-smoke listens for this workflow's completion via
    # workflow_run, but that event never fires when THIS run was itself
    # dispatched with GITHUB_TOKEN (the release chain path) - the 0.9.48
    # chain published npm cleanly and the smoke silently never ran. Dispatch
    # it explicitly; workflow_dispatch API calls are not subject to the
    # GITHUB_TOKEN event restriction. The workflow_run trigger stays for
    # PAT/manual runs; if both paths fire for the same publish the second
    # smoke run is a harmless duplicate (read-only npx install checks).
    name: Dispatch npx engine smoke
    needs: publish
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dispatch npx-engine-smoke with the published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh workflow run npx-engine-smoke.yml -f "expected-version=$VERSION"
          echo "Dispatched npx-engine-smoke expecting ${VERSION}."
