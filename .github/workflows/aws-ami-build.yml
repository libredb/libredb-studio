name: AWS AMI Build

# Same trigger pair as npm-publish.yml. Note what `release: published` does and
# does not buy here: release-artifacts.yml publishes the release with
# GITHUB_TOKEN, and a GITHUB_TOKEN-created event starts no workflow, so this
# trigger fires only when a human publishes a draft by hand. Tracking every
# release means joining the explicit `dispatch-downstream` chain in
# release-artifacts.yml - see deploy/aws/README.md - and that chain arrives as a
# `workflow_dispatch`, which is why every decision below lives in the preflight
# job rather than in a release-only `if:` that a dispatch would walk straight
# past.
#
# Until the listing is live, no machine path may build: the preflight job reads
# `aws-marketplace` in distribution/channels.yaml and stands down unless its
# status is `live`. A person who names a version in the dispatch input still
# builds - that is how the AMI for the first submission gets made - so the
# channel status is the switch, and flipping it to `live` is the whole change
# needed to turn the release path on.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to ship - must exist on ghcr.io/libredb/libredb-studio (e.g. 0.14.0). Leave empty to use package.json; while the AWS channel is not live in distribution/channels.yaml a version is REQUIRED, an empty run stands down.'
        required: false
        type: string

# One AMI namespace in one AWS account, so the group is constant rather than
# per-ref: a release run and a manual dispatch would otherwise land in different
# groups and each register a chargeable AMI. Never cancel one in flight - a
# killed Packer run leaves the build instance, its key pair and its security
# group behind.
concurrency:
  group: aws-ami-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether there is anything to build, on every path: a published
  # release, a dispatch from the release chain, and a human dispatch. A human
  # who names a version gets a loud failure when something is wrong; every other
  # path stands down quietly, because none of them should be able to turn
  # somebody else's release red.
  preflight:
    runs-on: ubuntu-latest
    # The concurrency group is constant and never cancels, so a hung preflight
    # would block every later run.
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - id: decide
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SUPPORT_EMAIL: ${{ vars.AWS_SUPPORT_EMAIL }}
          BUILD_ROLE_ARN: ${{ vars.AWS_AMI_BUILD_ROLE_ARN }}
          INGESTION_ROLE_ARN: ${{ vars.AWS_AMI_INGESTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          stand_down() { echo "::notice::$1 - nothing to build"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # An explicit input is a person asking for this build by name, so a
          # problem with it is an error. Everything else is a machine path.
          explicit=$([ -n "$INPUT_VERSION" ] && echo yes || echo no)
          refuse() {
            if [ "$explicit" = yes ]; then echo "::error::$1"; exit 1; fi
            stand_down "$1"
          }

          # The listing gate. `aws-marketplace` in distribution/channels.yaml is
          # the single source of truth for whether this product is on sale, and
          # nothing automatic may register a marketplace AMI before it is: a
          # release run, or the chained dispatch described above, stands down
          # while the status is anything but `live`. Read with awk rather than
          # a yaml parser so the gate needs no dependency install; the block is
          # two-space indented and its keys four, so the next `  - id:` ends it.
          CHANNEL_STATUS=$(awk '
            $0 == "  - id: aws-marketplace" { found = 1; next }
            found && /^  - id: / { exit }
            found && /^    status: / { print $2; exit }
          ' "$GITHUB_WORKSPACE/distribution/channels.yaml")
          if [ "$CHANNEL_STATUS" != live ]; then
            # Not `refuse`: a person who named a version is building the AMI the
            # submission itself needs, which is exactly the pre-live case.
            if [ "$explicit" = no ]; then
              stand_down "aws-marketplace is '${CHANNEL_STATUS:-absent}' in distribution/channels.yaml, not live (run this workflow by hand with a version to build anyway)"
            fi
            echo "::notice::aws-marketplace is '${CHANNEL_STATUS:-absent}' in distribution/channels.yaml - building because a version was named explicitly"
          fi

          # Chart releases (libredb-studio-<chart version>) emit release:published
          # too and are not product releases. npm-publish.yml and
          # docker-build-push.yml filter them the same way.
          case "$RELEASE_TAG" in
            libredb-studio-*) stand_down "chart release $RELEASE_TAG" ;;
          esac

          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version')
          fi

          # A marketplace version is a product release. Prereleases ship here
          # (release-artifacts.yml triggers on `0.0.0-*` tags) and they are NOT
          # flagged `prerelease` on the GitHub release, so the tag shape - not
          # the flag - is what tells them apart.
          case "$VERSION" in
            *[!0-9.]*|*..*|.*|*.) refuse "version is not a product release: $VERSION" ;;
          esac
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            refuse "version is not a product release: $VERSION"
          fi

          # On a release run the tag and package.json must agree, the way
          # docker-build-push.yml checks it: a mismatch would register a
          # marketplace AMI under a version nobody released.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $VERSION"
            exit 1
          fi

          # All three are repository variables rather than secrets: the support
          # address is printed in every buyer's banner by design, and the two
          # role ARNs are only useful to someone who can already assume them.
          for name in SUPPORT_EMAIL BUILD_ROLE_ARN INGESTION_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              refuse "repository variable for $name is not set"
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC - no long-lived AWS access keys anywhere
    # The build is ~15 minutes; the digest wait below can add 30 when it races
    # docker-build-push, whose arm64 half runs under emulation.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: deploy/aws/ami
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Nothing here pushes; leaving the token in .git/config for the rest of
          # the job buys nothing.
          persist-credentials: false

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3

      # Resolve the tag to a digest here, so the AMI and the job summary agree on
      # exactly which image shipped (Buildx is present on GitHub runners), and
      # wait for the tag rather than assuming it exists: on a release path
      # docker-build-push.yml may still be pushing it, and its arm64 build runs
      # under QEMU inside a 60-minute budget. Failing on that race would blame
      # this workflow for another job's timing.
      - name: Resolve image digest
        run: |
          for attempt in $(seq 1 60); do
            DIGEST="$(docker buildx imagetools inspect \
              "ghcr.io/libredb/libredb-studio:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            [ -n "$DIGEST" ] && break
            echo "image not on ghcr yet (attempt $attempt/60), waiting"
            sleep 30
          done
          # Exact shape, not a prefix: this value is interpolated into the image
          # ref the AMI is built from, so "starts with sha256:" is not a check.
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest resolution failed for ${VERSION}, got: $DIGEST"
            exit 1
          fi
          echo "IMAGE_REF=ghcr.io/libredb/libredb-studio@${DIGEST}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_AMI_BUILD_ROLE_ARN }}
          aws-region: us-east-1

      # The one input chosen at run time rather than pinned in the repo. Packer
      # resolves the same parameter moments later, so a Canonical publish landing
      # between the two would make this line name the previous serial - it is an
      # audit trail, not the pin.
      - name: Record the base image
        run: |
          BASE_AMI=$(aws ssm get-parameter \
            --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id \
            --query Parameter.Value --output text)
          echo "BASE_AMI=$BASE_AMI" >> "$GITHUB_ENV"

      - name: Packer init & validate
        env:
          SUPPORT_EMAIL: ${{ vars.AWS_SUPPORT_EMAIL }}
        run: |
          packer init .
          packer validate \
            -var "version=$VERSION" \
            -var "image_ref=$IMAGE_REF" \
            -var "support_email=$SUPPORT_EMAIL" .

      - name: Packer build
        env:
          SUPPORT_EMAIL: ${{ vars.AWS_SUPPORT_EMAIL }}
        run: |
          packer build \
            -var "version=$VERSION" \
            -var "image_ref=$IMAGE_REF" \
            -var "support_email=$SUPPORT_EMAIL" .

      # amazon-ebs artifact_id is "region:ami-id" - the ID is after the colon.
      - name: AMI ID to job summary
        env:
          INGESTION_ROLE_ARN: ${{ vars.AWS_AMI_INGESTION_ROLE_ARN }}
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)
          {
            echo "## AWS Marketplace AMI"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| AMI ID | \`${AMI_ID}\` |"
            echo "| Region | \`us-east-1\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Base image | \`${BASE_AMI}\` (Canonical Ubuntu 24.04 server) |"
            echo "| Ingestion role | \`${INGESTION_ROLE_ARN}\` |"
            echo
            echo "### Next steps in the portal"
            echo "1. AWS Marketplace Management Portal -> Server products -> LibreDB Studio."
            echo "2. Request changes -> Update versions -> Test 'Add version' with the AMI ID above to run a scan without creating a version."
            echo "3. When the scan passes, Add new version: OS Ubuntu 24.04, OS user \`ubuntu\`, scanning port 22, endpoint http / / 3000."
            echo "4. Do not deregister this AMI or delete its snapshot while the version request is under review."
          } >> "$GITHUB_STEP_SUMMARY"
