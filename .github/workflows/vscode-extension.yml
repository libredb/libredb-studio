# The VS Code extension's gates (docs/TOOLCHAIN.md, "VS Code extension").
# A reusable workflow: ci.yml calls it on every push and pull request, and
# vscode-extension-release.yml calls the same file on a vscode-extension-* tag,
# so the gates a release passes cannot drift from a pull request's.
#
# vscode-extension/ is its own npm package beside the Bun root. Its bundles and
# tests resolve React, the drivers and the provider layer from the root's
# node_modules, so the root's `bun install` runs before `npm ci`.
#
# No path filter and no `needs`: the child bundles the provider layer from
# source, so a provider change is also an extension change.
name: VS Code Extension

on:
  workflow_call:

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install the root's dependencies
        uses: ./.github/actions/bun-install

      - name: Install the extension's dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build the bundles, their metafile checks, LICENSE and notices
        run: npm run build

      - name: Unit leg and its 100% line coverage gate
        run: npm run test:unit && npm run coverage:check

      - name: Install Chromium for the browser leg, through the root's Playwright
        working-directory: .
        run: bunx playwright install --with-deps chromium

      - name: Browser leg, the results webview in Chromium
        run: npm run test:browser

      - name: Restore the pinned VS Code builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The builds only: the e2e leg keeps its VS Code profile in
          # .vscode-test/user-data and .vscode-test/extensions, and a cached
          # profile would reach every later run, fork pull requests included.
          path: vscode-extension/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vscode-extension/test/vscode-versions.json') }}

      - name: Integration leg on the job's Node
        run: npm run test:integration
        env:
          LIBREDB_BACKEND_RUNTIME: node

      - name: Integration leg on the pinned VS Code binary
        run: npm run test:integration
        env:
          LIBREDB_BACKEND_RUNTIME: vscode

      - name: E2e leg on the floor and stable builds
        run: xvfb-run -a npm run test:e2e

      - name: Package the VSIX and check it
        run: npm run package

      - name: Install the packed VSIX into the stable build
        run: npm run test:vsix

      - name: Upload the VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension-vsix
          path: vscode-extension/dist-vsix/*.vsix
          if-no-files-found: error

      # The VSIX leaves the source maps out; vsce's prepublish build wrote them
      # beside the bundles it packed, so they are kept for symbolicating a
      # released build's stack traces.
      - name: Upload the packaged build's source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension-sourcemaps
          path: vscode-extension/dist/*.js.map
          if-no-files-found: error

  # Hosted macOS and Windows runners cannot start the Linux database containers,
  # so these two run the e2e leg's smoke subset only: activation, the child forked
  # from VS Code's own binary, and its shutdown. Neither needs Xvfb.
  vscode-extension-smoke:
    name: VS Code Extension Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install the root's dependencies
        uses: ./.github/actions/bun-install

      - name: Install the extension's dependencies
        run: npm ci --ignore-scripts

      - name: Build the bundles
        run: npm run build

      - name: Restore the pinned VS Code builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The builds only: the e2e leg keeps its VS Code profile in
          # .vscode-test/user-data and .vscode-test/extensions, and a cached
          # profile would reach every later run, fork pull requests included.
          path: vscode-extension/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vscode-extension/test/vscode-versions.json') }}

      - name: E2e smoke subset on the floor and stable builds
        run: npm run test:e2e
        env:
          LIBREDB_E2E_SUBSET: smoke
