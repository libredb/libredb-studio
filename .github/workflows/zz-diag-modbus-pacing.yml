# TEMPORARY Windows diagnostic for the Modbus pacing test hang; removed before merge.
name: zz diag modbus pacing
on:
  pull_request:
    paths:
      - "tests/live/zz-diag-pacing.ts"
      - "tests/live/zz-diag-seven.test.ts"
      - "tests/unit/db/modbus/agent-pacing.test.ts"
      - ".github/workflows/zz-diag-modbus-pacing.yml"
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/bun-install
      - name: "variant a: first released by hand, a new timer after the refusal"
        timeout-minutes: 1
        continue-on-error: true
        env:
          DIAG_VARIANT: "a"
        run: bun test tests/live/zz-diag-seven.test.ts --timeout 5000
      - name: "variant c: only a new timer after the refusal, first still on its 80 ms sleep"
        timeout-minutes: 1
        continue-on-error: true
        env:
          DIAG_VARIANT: "c"
        run: bun test tests/live/zz-diag-seven.test.ts --timeout 5000
      - name: "variant b: first on its 80 ms sleep"
        timeout-minutes: 1
        continue-on-error: true
        env:
          DIAG_VARIANT: "b"
        run: bun test tests/live/zz-diag-seven.test.ts --timeout 5000
      - name: pacing test file alone
        timeout-minutes: 2
        continue-on-error: true
        run: bun test tests/unit/db/modbus/agent-pacing.test.ts --timeout 5000
