# TEMPORARY Windows diagnostic for the Modbus pacing test hang; removed before merge.
name: zz diag modbus pacing
on:
  pull_request:
    paths:
      - "tests/live/zz-diag-pacing.ts"
      - ".github/workflows/zz-diag-modbus-pacing.yml"
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/bun-install
      - name: diag script
        timeout-minutes: 2
        continue-on-error: true
        run: bun tests/live/zz-diag-pacing.ts
      - name: pacing test file alone
        timeout-minutes: 3
        continue-on-error: true
        run: bun test tests/unit/db/modbus/agent-pacing.test.ts --timeout 5000
