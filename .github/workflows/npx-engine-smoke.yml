# Post-release validation of the bare-npx experience against the LIVE npm
# registry (issue #130 regression class): npm's version picker avoids
# engine-incompatible versions for bare specs, so `npx @libredb/studio` must
# resolve a runnable release on every Node tier - not fall back to an ancient
# bin-less version.
#
# Since the floor moved to Node 24 (#326) this workflow covers two outcomes,
# not one. On 24/26 bare npx must resolve the release just published; on 22 the
# picker silently pins users to the last <24 release, and the assertion is that
# the pin lands on something that still BOOTS. Note the pinning is silent by
# design - `npm` prints no notice when the floor excludes a newer version, which
# is why the release runbook deprecates the pinned version with a pointer
# instead.
#
# Runs automatically after a successful "NPM Publish" (the expected version is
# the release tag - workflow_run.head_branch - which the release guards pin to
# package.json's version; the job waits for the registry to serve it before
# asserting). Manual dispatch stays available for re-runs; see the
# first-release validation runbook in docs/DISTRIBUTION.md.
name: npx Engine Smoke

on:
  workflow_run:
    workflows: ["NPM Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected-version:
        description: "Version bare npx must resolve (empty = only assert a runnable server)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  npx-smoke:
    name: bare npx on Node ${{ matrix.node-version }} (${{ matrix.expect }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported runtimes: bare npx must resolve the release just published.
          - node-version: "24"
            expect: exact
          - node-version: "26"
            expect: exact
          # Below the engines floor (>=24.0.0). npm's picker does not error
          # here - it silently resolves the newest ENGINE-COMPATIBLE release,
          # so these users are pinned to the last <24 version. That pin is only
          # acceptable while it lands on a RUNNABLE release; issue #130 was
          # exactly this mechanism dropping users onto an ancient bin-less one.
          # This leg keeps that guarantee under test.
          #
          # 22 is the whole below-floor tier now. A 20.9 leg used to sit beside
          # it and started failing after releases; it was asserting a promise
          # this project does not make - 20.9 is two majors under the floor and
          # is not a supported runtime, so a red leg there reported an unmet
          # guarantee rather than a regression. The property it shared with this
          # one - that the floor is honoured and the pin still boots - is fully
          # covered here, so nothing is lost by dropping it.
          - node-version: "22"
            expect: pinned
    steps:
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      # No checkout needed (and none wanted - a workflow_run checkout of
      # head_sha is the pattern CodeQL rightly flags): on release-triggered
      # NPM Publish runs, head_branch IS the release tag, and this repo's
      # release guards enforce tag == package.json version. Anything that is
      # not plain semver (e.g. a manually dispatched publish from a branch)
      # falls back to the runnable-server-only assertion.
      - name: Resolve expected version
        id: expected
        env:
          # Both values are maintainer-provided (dispatch input / release
          # tag), but validate anyway - they are only used after a strict
          # semver check.
          INPUT_VERSION: ${{ inputs.expected-version }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECTED="$RUN_HEAD_BRANCH"
          else
            EXPECTED="$INPUT_VERSION"
          fi
          if ! printf '%s' "$EXPECTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$EXPECTED" ]; then
              echo "Invalid expected-version '$EXPECTED' (plain semver or empty)" >&2
              exit 1
            fi
            echo "'$EXPECTED' is not a release tag - asserting a runnable server only"
            EXPECTED=""
          fi
          echo "version=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "expected version: ${EXPECTED:-<none - runnable-server assertion only>}"

      - name: Wait for the registry to serve the expected version
        if: steps.expected.outputs.version != ''
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if npm view "@libredb/studio@${EXPECTED_VERSION}" version >/dev/null 2>&1; then
              echo "registry serves ${EXPECTED_VERSION}"
              exit 0
            fi
            echo "waiting for the registry to serve ${EXPECTED_VERSION} (attempt ${i}/30)"
            sleep 20
          done
          echo "FAIL: registry never served ${EXPECTED_VERSION} within 10 minutes" >&2
          exit 1

      - name: Run bare npx and assert resolution
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          EXPECT_MODE: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          echo "==> node $(node --version), bare: npx -y @libredb/studio"
          # S6505 (npx installs on demand and runs lifecycle scripts) is accepted
          # here deliberately: that invocation IS the subject of this workflow.
          # Issue #130 was npm's picker resolving a bin-less release for exactly
          # this command, and it is the command the install instructions give
          # users, so replacing it would test something nobody runs. The package
          # is this repository's own, published minutes earlier by this same
          # release chain. `--ignore-scripts` is not the mitigation either - the
          # published dependency tree carries native modules (better-sqlite3,
          # oracledb) whose install steps a real user does run.
          npx -y @libredb/studio --port 3105 --host 127.0.0.1 > npx.log 2>&1 & # NOSONAR
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null http://127.0.0.1:3105/api/db/health && break
            sleep 2
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:3105/api/db/health; then
            echo "FAIL: bare npx never served /api/db/health; log:" >&2
            cat npx.log >&2
            exit 1
          fi
          echo "PASS: health 200"
          grep -F "Checksum verified" npx.log
          RESOLVED=$(sed -n 's/^Starting LibreDB Studio \([0-9][0-9.]*\) .*/\1/p' npx.log | head -1)
          echo "resolved version: ${RESOLVED:-unknown}"
          if [ -z "$RESOLVED" ]; then
            echo "FAIL: could not read the resolved version from the launcher banner; log:" >&2
            cat npx.log >&2
            exit 1
          fi
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "==> OK (runnable-server assertion only)"
            exit 0
          fi
          case "$EXPECT_MODE" in
            exact)
              if [ "$RESOLVED" != "$EXPECTED_VERSION" ]; then
                echo "FAIL: bare npx resolved '$RESOLVED', expected '$EXPECTED_VERSION'; log:" >&2
                cat npx.log >&2
                exit 1
              fi
              ;;
            pinned)
              # Serving health above already proved this release is runnable.
              # What is left to prove is that the engines floor actually held:
              # resolving the NEW version here would mean npm ignored it and
              # the floor is decorative.
              if [ "$RESOLVED" = "$EXPECTED_VERSION" ]; then
                echo "FAIL: bare npx resolved '$RESOLVED' on a runtime below the engines floor - the floor is not being honoured; log:" >&2
                cat npx.log >&2
                exit 1
              fi
              echo "pinned to '$RESOLVED' as expected (floor excludes '$EXPECTED_VERSION')"
              ;;
            *)
              echo "FAIL: unknown expect mode '$EXPECT_MODE'" >&2
              exit 1
              ;;
          esac
          echo "==> OK"
