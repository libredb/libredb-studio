name: Helm Chart Release

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:
    inputs:
      force_republish:
        description: >-
          Republish this chart version even though it is already released. ONLY for
          repairing a failed index/OCI push whose chart content is unchanged since the
          release - it overwrites the published index digest and OCI tag (#167).
        type: boolean
        default: false

# Serialize helm-release runs: overlapping runs would race on the shared
# gh-pages index/release state, so queue them instead. Defense-in-depth -
# the #146 incident itself turned out to be a post-publish release deletion
# (the run created the release and asset successfully; the runs were hours
# apart), not a workflow race, but rapid successive charts/** pushes should
# still never be able to overlap here.
concurrency:
  group: helm-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  preflight:
    # Two gates decide whether this run may publish at all: the image gate
    # below (may the chart be released yet?) and the publish gate in the last
    # step (is this chart version already published, #167?).
    #
    # Image gate: the chart deploys ghcr.io/libredb/libredb-studio:<appVersion>
    # by default, so nothing here may run (or publish) before that image
    # exists. A version-bump merge fires this workflow ~25-35 minutes before
    # the release chain has built the image; in that case the push-triggered
    # run ends here as a green no-op and docker-build-push dispatches this
    # workflow again after it publishes the version tag (and never dispatches
    # it when the build failed - a failed image makes every downstream job
    # pointless). Chart-only releases pass instantly: their appVersion image
    # is already published. No polling by design: a wait would burn 45 min on
    # an image that a failed Docker run will never produce.
    name: Preflight gates
    runs-on: ubuntu-latest
    # A registry query is near-instant; never let a network hang hold a
    # runner.
    timeout-minutes: 5
    # The image gate only reads Chart.yaml and queries the registry
    # anonymously - this relies on the GHCR package being PUBLIC (if
    # visibility ever changes, this step fails loudly and needs a registry
    # login). The already-published check reads releases, which contents:read
    # covers. Do not inherit the workflow-level write scopes.
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      chart_published: ${{ steps.published.outputs.chart_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check the appVersion image exists on GHCR
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # grep/awk on purpose (matching the description: extraction in the
          # release job below): yq is not preinstalled and this job stays
          # lean - do not "improve" this into a yq dependency.
          app_version=$(grep '^appVersion:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ -z "$app_version" ]; then
            echo "::error::could not read appVersion from charts/libredb-studio/Chart.yaml"
            exit 1
          fi
          image="ghcr.io/libredb/libredb-studio:${app_version}"
          if inspect_out=$(docker manifest inspect "$image" 2>&1); then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "OK: ${image} is published - proceeding."
            exit 0
          fi
          # Only a genuinely missing tag may defer the release. Any other
          # inspect failure (registry outage, DNS, auth, CLI) must fail
          # loudly: treating it as "missing" would green-no-op a chart-only
          # release that nothing ever re-dispatches - a silent never-publish.
          # Every alternative requires manifest context: a bare "not found"
          # would also match unrelated failures (e.g. "docker: command not
          # found") and wrongly defer instead of failing loudly.
          if ! grep -qiE "manifest unknown|no such manifest|manifest for .+ not found" <<< "$inspect_out"; then
            # Collapse newlines: a multi-line message breaks the ::error::
            # annotation format (the full output is in the step log anyway).
            echo "::error::could not query GHCR for ${image} - failing instead of deferring. Inspect output: ${inspect_out//$'\n'/ }"
            exit 1
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::${image} is not published. A dispatched run expects the image to exist - check docker-build-push for this version, then re-dispatch."
            exit 1
          fi
          echo "::notice::${image} is not published yet - ending as a no-op. docker-build-push re-dispatches this workflow after it pushes the version tag (release chain), so no action is needed unless that build failed."
          {
            echo "## Helm release deferred"
            echo ""
            echo "\`${image}\` is not on GHCR yet. This push-triggered run is a no-op;"
            echo "the release chain re-dispatches helm-release after the image is published."
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish gate (#167): the release-asset step is guarded against an
      # already-released version, but the gh-pages index push and the OCI push
      # re-package whatever charts/** currently holds, unconditionally. So a
      # charts/** merge that changed chart content WITHOUT bumping the chart
      # version rewrote the released version's index digest and its OCI copy
      # while the (immutable) release asset kept the original bytes - a live
      # index-vs-asset mismatch, and silent digest drift on OCI. Decide the
      # state once here and gate both publish jobs on it, so such a merge is a
      # full no-op after lint-test.
      #
      # Only "published AND carrying the chart asset" counts as done: no
      # release yet or a leftover draft must still publish, and a published
      # release WITHOUT its asset must still reach the release job, whose loud
      # #154 error is the right output there. Publishing chart CHANGES always
      # means bumping the chart version - never re-running this workflow.
      # A failed query is treated as "not published": the release job re-checks
      # authoritatively, so that case is no worse than the pre-guard behaviour.
      #
      # The one legitimate reason to publish over a released version is repairing
      # a run whose asset upload succeeded but whose index or OCI push failed
      # (it happened to chart 0.1.5, hand-patched at the time). Bumping the chart
      # version cannot fix that - the released version would stay missing from
      # the index - so the force_republish dispatch input exists for exactly this
      # case and is loud about it. The release chain's dispatch passes no inputs,
      # so it can never take this path.
      - name: Check whether this chart version is already published
        id: published
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE_REPUBLISH: ${{ github.event.inputs.force_republish }}
        run: |
          set -euo pipefail
          # grep/awk for the same reason as the appVersion read above: yq is not
          # preinstalled and this job stays lean. '^version:' cannot match the
          # indented dependency versions or appVersion.
          version=$(grep '^version:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ -z "$version" ]; then
            echo "::error::could not read version from charts/libredb-studio/Chart.yaml"
            exit 1
          fi
          tag="libredb-studio-${version}"
          asset="${tag}.tgz"
          if [ "${FORCE_REPUBLISH:-}" = "true" ]; then
            echo "chart_published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::force_republish requested - publishing over '${tag}' if it already exists. Valid ONLY when charts/** is unchanged since that release; otherwise the published index/OCI digest drifts from the release asset (#167)."
            exit 0
          fi
          if ! is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "chart_published=false" >> "$GITHUB_OUTPUT"
            echo "No release '${tag}' yet - publishing may proceed."
            exit 0
          fi
          if [ "$is_draft" = "true" ] || ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fqx "$asset"; then
            echo "chart_published=false" >> "$GITHUB_OUTPUT"
            echo "Release '${tag}' exists but is not published with '${asset}' - publishing may proceed."
            exit 0
          fi
          echo "chart_published=true" >> "$GITHUB_OUTPUT"
          echo "::notice::${tag} is already published with ${asset} - skipping the index and OCI publishes (#167). Bump the chart version to publish chart changes."
          {
            echo "## Chart publish skipped"
            echo ""
            echo "\`${tag}\` is already released with \`${asset}\`, so this run touches neither the"
            echo "gh-pages index nor the OCI registry: re-packaging would change the published"
            echo "digest of an immutable release (#167). Bump \`version:\` in"
            echo "\`charts/libredb-studio/Chart.yaml\` to publish chart changes."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-test:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # helm3-pinned: our users install with Helm 3, and these two `ct install`
      # runs are the only place in this repo where a Helm 3 client installs the
      # chart into a cluster at all. Scope, precisely: `ct install` installs the
      # chart SOURCE directory, never the .tgz that release-github-pages packages
      # with Helm 4 - so this proves "Helm 3 installs this chart", not "Helm 3
      # installs the released artifact". That residual gap is tracked in
      # docs/BACKLOG.md. Every other setup-helm site here is v4.1.3 - see
      # tests/unit/helm-pin-matrix.test.ts. Do not "consistency fix" this.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Set up Python (for chart-testing)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing lint
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts charts/libredb-studio

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing install
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio \
            --helm-extra-set-args "\
              --set secrets.jwtSecret=test-jwt-secret-minimum-32-characters-long \
              --set secrets.adminPassword=TestAdmin123 \
              --set secrets.userPassword=TestUser123"

      # Certified catalogs (Rancher partner-charts) require the chart to deploy
      # with default values: zero-config bootstrap must bring the pod to Ready
      # with no secrets set. Guard that promise explicitly.
      - name: Run chart-testing install (default values, zero-config)
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio

  release-github-pages:
    needs: [preflight, lint-test]
    # Publish gate (#167): skip entirely when this chart version is already
    # released with its asset - see the preflight step for the rationale. The
    # expression carries no status-check function, so the implicit success()
    # keeps the existing "skipped when lint-test is skipped or fails" chaining.
    if: needs.preflight.outputs.chart_published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami --timeout 5m

      # --skip-refresh: the `helm repo add` above already fetched the index; Helm 4's `dependency build` re-fetches it by default and takes no --timeout.
      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio --skip-refresh

      - name: Package chart
        run: |
          rm -rf .cr-release-packages
          helm package charts/libredb-studio -d .cr-release-packages

      - name: Publish chart release (draft-first, immutable-compatible)
        # Immutable releases (issue #154) freeze assets at publish time, so the
        # chart .tgz must be attached while the release is still a draft and
        # the release published only afterwards. chart-releaser's own upload
        # (create published release, then attach asset) would 422; the repo
        # index is pushed manually in the next step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_path=$(ls .cr-release-packages/*.tgz)
          asset=$(basename "$asset_path")
          tag="${asset%.tgz}"
          # grep/awk for the same reason as the preflight reads above: yq is
          # not preinstalled. Both fields come from the very Chart.yaml that
          # `helm package` just packaged, so they cannot drift from the tag.
          version=$(grep '^version:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          app_version=$(grep '^appVersion:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          if IS_DRAFT=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fqx "$asset"; then
                echo "Release '$tag' is already published with '$asset' - nothing to do."
                exit 0
              fi
              echo "::error::Release '$tag' is published WITHOUT '$asset' and immutable releases cannot be amended - bump the chart version. See #154."
              exit 1
            fi
            echo "Reusing existing draft release '$tag'."
          else
            # Release copy is the only explanation a visitor to the Releases
            # page gets for the two version streams this repo publishes: the
            # application (tag `0.13.4`) and this chart (tag
            # `libredb-studio-0.1.49`, because `helm package` names its
            # artifact `<chart-name>-<chart-version>.tgz`). The old body -
            # the chart's `description:` line, identical on every chart
            # release - answered a question nobody asked.
            #
            # Quoted heredoc on purpose: the body is markdown whose backticks
            # and code fences must reach the release page literally, so the
            # two version numbers are substituted afterwards rather than
            # interpolated by the shell.
            notes="${RUNNER_TEMP}/chart-release-notes.md"
            cat > "$notes" <<'NOTES'
          LibreDB Studio Helm chart `__CHART_VERSION__`, deploying application version `__APP_VERSION__` by default.

          ## Install

          From the Helm repository:

          ```bash
          helm repo add libredb https://libredb.org/libredb-studio/
          helm repo update
          helm install libredb libredb/libredb-studio --version __CHART_VERSION__
          ```

          Or straight from the OCI registry:

          ```bash
          helm install libredb oci://ghcr.io/libredb/charts/libredb-studio --version __CHART_VERSION__
          ```

          Both commands work with default values: the chart bootstraps its own JWT secret and admin credentials on first boot. Every value is documented in [charts/libredb-studio/README.md](https://github.com/libredb/libredb-studio/blob/main/charts/libredb-studio/README.md).

          ## Why two version numbers?

          This repository publishes two independent release streams, so the Releases page carries two tag shapes:

          | Tag | What it releases |
          | --- | --- |
          | `__APP_VERSION__` | the LibreDB Studio application - npm, Docker, desktop and OS packages |
          | `libredb-studio-__CHART_VERSION__` | this Helm chart - `helm package` names its artifact `<chart-name>-<chart-version>.tgz`, and the release tag follows it |

          The chart version moves on its own so a chart-only fix ships without forcing an application release. The application version a given chart deploys is its `appVersion` - shown in the `APP VERSION` column of `helm search repo` and on ArtifactHub. The full rationale is in [docs/HELM_CHART.md](https://github.com/libredb/libredb-studio/blob/main/docs/HELM_CHART.md#versioning-policy-version-and-appversion-stay-independent-researched-2026-07).
          NOTES
            sed -i "s|__CHART_VERSION__|${version}|g; s|__APP_VERSION__|${app_version}|g" "$notes"
            gh release create "$tag" --draft \
              --title "Helm chart ${version} (app ${app_version})" \
              --notes-file "$notes"
          fi
          # Immutable releases require the git tag to exist at publish time.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          gh release upload "$tag" "$asset_path" --clobber
          # Chart releases (tag libredb-studio-<chart-version>) must never take
          # the repo's Latest marker away from product releases (PR #128).
          gh release edit "$tag" --draft=false --latest=false
          echo "Published chart release '$tag' with '$asset'."

      - name: Update Helm repo index on gh-pages
        # chart-releaser cannot do this here: its skip_upload flag (needed
        # because the upload is draft-first above) also skips the index push
        # entirely - the 0.1.5 release published with no index entry until it
        # was hand-patched. Merge the new package into the existing index
        # with helm itself and push; --merge keeps every prior entry (and its
        # per-release URL) untouched, only the new version gets --url.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_path=$(ls .cr-release-packages/*.tgz)
          tag=$(basename "$asset_path" .tgz)
          pages_dir="${RUNNER_TEMP}/gh-pages"
          rm -rf "$pages_dir"
          # Explicit fetch: keeps this step working even if the checkout
          # configuration ever stops fetching all branches.
          git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"
          git worktree add "$pages_dir" origin/gh-pages
          helm repo index .cr-release-packages \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            --merge "$pages_dir/index.yaml"
          if cmp -s .cr-release-packages/index.yaml "$pages_dir/index.yaml"; then
            echo "Index already contains ${tag} - nothing to push."
            exit 0
          fi
          cp .cr-release-packages/index.yaml "$pages_dir/index.yaml"
          cd "$pages_dir"
          git checkout -B gh-pages origin/gh-pages
          git add index.yaml
          git commit -m "Update index.yaml for ${tag}"
          git push origin gh-pages
          echo "Pushed index update for ${tag}."

      - name: Verify chart release asset was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Derive the exact release tag and asset name from the packaged chart
          # itself, instead of parsing the version out of Chart.yaml. `helm
          # package` names the file <chart-name>-<version>.tgz from the chart
          # metadata, so there is no version-string parsing to get wrong.
          # Use a clean directory so a leftover .tgz can never make the glob
          # below match more than one file.
          pkg_dir="${RUNNER_TEMP}/verify-pkg"
          rm -rf "${pkg_dir}"
          mkdir -p "${pkg_dir}"
          helm package charts/libredb-studio -d "${pkg_dir}" >/dev/null
          asset=$(basename "${pkg_dir}"/*.tgz)
          tag="${asset%.tgz}"
          echo "Verifying release '${tag}' has asset '${asset}'"
          # Check for the specific chart package (.tgz), not just any asset: a
          # release carrying some unrelated asset while the chart package is
          # missing is exactly the failure mode in #146. The Release/asset can
          # also lag behind chart-releaser via the API (eventual consistency),
          # so retry with backoff. stderr is left visible so a genuine failure
          # (permissions, rate limiting) surfaces in the log. grep -F matches the
          # asset name literally so the dots are not treated as regex wildcards.
          attempts=5
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if gh api "repos/${{ github.repository }}/releases/tags/${tag}" --jq '.assets[].name' | grep -Fqx "${asset}"; then
              echo "OK: ${tag} has asset ${asset} (attempt ${attempt})."
              exit 0
            fi
            if ((attempt < attempts)); then
              echo "Attempt ${attempt}/${attempts}: ${asset} not visible yet on ${tag}, retrying..."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::chart-releaser did not publish '${asset}' on release '${tag}' after ${attempts} attempts. The gh-pages index may now point to a broken download URL. See #146 for the same failure mode."
          exit 1

  release-oci:
    needs: [preflight, lint-test]
    # Publish gate (#167): `helm push` overwrites an existing OCI tag silently,
    # so this job is the other half of the guard. Immutable releases cover only
    # the release asset; the OCI copy and the index are mutable surfaces.
    if: needs.preflight.outputs.chart_published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami --timeout 5m

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # --skip-refresh: the `helm repo add` above already fetched the index; Helm 4's `dependency build` re-fetches it by default and takes no --timeout.
      - name: Build dependencies
        run: helm dependency build charts/libredb-studio --skip-refresh

      - name: Package chart
        run: helm package charts/libredb-studio -d .cr-release-packages

      - name: Push to OCI registry
        run: helm push .cr-release-packages/libredb-studio-*.tgz oci://ghcr.io/libredb/charts
