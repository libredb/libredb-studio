name: Helm Chart Release

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

# Serialize helm-release runs: overlapping runs would race on the shared
# gh-pages index/release state, so queue them instead. Defense-in-depth -
# the #146 incident itself turned out to be a post-publish release deletion
# (the run created the release and asset successfully; the runs were hours
# apart), not a workflow race, but rapid successive charts/** pushes should
# still never be able to overlap here.
concurrency:
  group: helm-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  preflight:
    # Image gate: the chart deploys ghcr.io/libredb/libredb-studio:<appVersion>
    # by default, so nothing here may run (or publish) before that image
    # exists. A version-bump merge fires this workflow ~25-35 minutes before
    # the release chain has built the image; in that case the push-triggered
    # run ends here as a green no-op and docker-build-push dispatches this
    # workflow again after it publishes the version tag (and never dispatches
    # it when the build failed - a failed image makes every downstream job
    # pointless). Chart-only releases pass instantly: their appVersion image
    # is already published. No polling by design: a wait would burn 45 min on
    # an image that a failed Docker run will never produce.
    name: Image gate
    runs-on: ubuntu-latest
    # A registry query is near-instant; never let a network hang hold a
    # runner.
    timeout-minutes: 5
    # The gate only reads Chart.yaml and queries the registry anonymously -
    # this relies on the GHCR package being PUBLIC (if visibility ever
    # changes, this step fails loudly and needs a registry login). Do not
    # inherit the workflow-level write scopes.
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check the appVersion image exists on GHCR
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # grep/awk on purpose (matching the description: extraction in the
          # release job below): yq is not preinstalled and this job stays
          # lean - do not "improve" this into a yq dependency.
          app_version=$(grep '^appVersion:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ -z "$app_version" ]; then
            echo "::error::could not read appVersion from charts/libredb-studio/Chart.yaml"
            exit 1
          fi
          image="ghcr.io/libredb/libredb-studio:${app_version}"
          if inspect_out=$(docker manifest inspect "$image" 2>&1); then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "OK: ${image} is published - proceeding."
            exit 0
          fi
          # Only a genuinely missing tag may defer the release. Any other
          # inspect failure (registry outage, DNS, auth, CLI) must fail
          # loudly: treating it as "missing" would green-no-op a chart-only
          # release that nothing ever re-dispatches - a silent never-publish.
          # Every alternative requires manifest context: a bare "not found"
          # would also match unrelated failures (e.g. "docker: command not
          # found") and wrongly defer instead of failing loudly.
          if ! grep -qiE "manifest unknown|no such manifest|manifest for .+ not found" <<< "$inspect_out"; then
            # Collapse newlines: a multi-line message breaks the ::error::
            # annotation format (the full output is in the step log anyway).
            echo "::error::could not query GHCR for ${image} - failing instead of deferring. Inspect output: ${inspect_out//$'\n'/ }"
            exit 1
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::${image} is not published. A dispatched run expects the image to exist - check docker-build-push for this version, then re-dispatch."
            exit 1
          fi
          echo "::notice::${image} is not published yet - ending as a no-op. docker-build-push re-dispatches this workflow after it pushes the version tag (release chain), so no action is needed unless that build failed."
          {
            echo "## Helm release deferred"
            echo ""
            echo "\`${image}\` is not on GHCR yet. This push-triggered run is a no-op;"
            echo "the release chain re-dispatches helm-release after the image is published."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-test:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Set up Python (for chart-testing)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing lint
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts charts/libredb-studio

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing install
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio \
            --helm-extra-set-args "\
              --set secrets.jwtSecret=test-jwt-secret-minimum-32-characters-long \
              --set secrets.adminPassword=TestAdmin123 \
              --set secrets.userPassword=TestUser123"

      # Certified catalogs (Rancher partner-charts) require the chart to deploy
      # with default values: zero-config bootstrap must bring the pod to Ready
      # with no secrets set. Guard that promise explicitly.
      - name: Run chart-testing install (default values, zero-config)
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio

  release-github-pages:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio

      - name: Package chart
        run: |
          rm -rf .cr-release-packages
          helm package charts/libredb-studio -d .cr-release-packages

      - name: Publish chart release (draft-first, immutable-compatible)
        # Immutable releases (issue #154) freeze assets at publish time, so the
        # chart .tgz must be attached while the release is still a draft and
        # the release published only afterwards. chart-releaser's own upload
        # (create published release, then attach asset) would 422; the repo
        # index is pushed manually in the next step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_path=$(ls .cr-release-packages/*.tgz)
          asset=$(basename "$asset_path")
          tag="${asset%.tgz}"
          desc=$(grep '^description:' charts/libredb-studio/Chart.yaml | cut -d' ' -f2-)
          if IS_DRAFT=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fqx "$asset"; then
                echo "Release '$tag' is already published with '$asset' - nothing to do."
                exit 0
              fi
              echo "::error::Release '$tag' is published WITHOUT '$asset' and immutable releases cannot be amended - bump the chart version. See #154."
              exit 1
            fi
            echo "Reusing existing draft release '$tag'."
          else
            gh release create "$tag" --draft --title "$tag" --notes "$desc"
          fi
          # Immutable releases require the git tag to exist at publish time.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          gh release upload "$tag" "$asset_path" --clobber
          # Chart releases (tag libredb-studio-<chart-version>) must never take
          # the repo's Latest marker away from product releases (PR #128).
          gh release edit "$tag" --draft=false --latest=false
          echo "Published chart release '$tag' with '$asset'."

      - name: Update Helm repo index on gh-pages
        # chart-releaser cannot do this here: its skip_upload flag (needed
        # because the upload is draft-first above) also skips the index push
        # entirely - the 0.1.5 release published with no index entry until it
        # was hand-patched. Merge the new package into the existing index
        # with helm itself and push; --merge keeps every prior entry (and its
        # per-release URL) untouched, only the new version gets --url.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_path=$(ls .cr-release-packages/*.tgz)
          tag=$(basename "$asset_path" .tgz)
          pages_dir="${RUNNER_TEMP}/gh-pages"
          rm -rf "$pages_dir"
          # Explicit fetch: keeps this step working even if the checkout
          # configuration ever stops fetching all branches.
          git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"
          git worktree add "$pages_dir" origin/gh-pages
          helm repo index .cr-release-packages \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            --merge "$pages_dir/index.yaml"
          if cmp -s .cr-release-packages/index.yaml "$pages_dir/index.yaml"; then
            echo "Index already contains ${tag} - nothing to push."
            exit 0
          fi
          cp .cr-release-packages/index.yaml "$pages_dir/index.yaml"
          cd "$pages_dir"
          git checkout -B gh-pages origin/gh-pages
          git add index.yaml
          git commit -m "Update index.yaml for ${tag}"
          git push origin gh-pages
          echo "Pushed index update for ${tag}."

      - name: Verify chart release asset was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Derive the exact release tag and asset name from the packaged chart
          # itself, instead of parsing the version out of Chart.yaml. `helm
          # package` names the file <chart-name>-<version>.tgz from the chart
          # metadata, so there is no version-string parsing to get wrong.
          # Use a clean directory so a leftover .tgz can never make the glob
          # below match more than one file.
          pkg_dir="${RUNNER_TEMP}/verify-pkg"
          rm -rf "${pkg_dir}"
          mkdir -p "${pkg_dir}"
          helm package charts/libredb-studio -d "${pkg_dir}" >/dev/null
          asset=$(basename "${pkg_dir}"/*.tgz)
          tag="${asset%.tgz}"
          echo "Verifying release '${tag}' has asset '${asset}'"
          # Check for the specific chart package (.tgz), not just any asset: a
          # release carrying some unrelated asset while the chart package is
          # missing is exactly the failure mode in #146. The Release/asset can
          # also lag behind chart-releaser via the API (eventual consistency),
          # so retry with backoff. stderr is left visible so a genuine failure
          # (permissions, rate limiting) surfaces in the log. grep -F matches the
          # asset name literally so the dots are not treated as regex wildcards.
          attempts=5
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if gh api "repos/${{ github.repository }}/releases/tags/${tag}" --jq '.assets[].name' | grep -Fqx "${asset}"; then
              echo "OK: ${tag} has asset ${asset} (attempt ${attempt})."
              exit 0
            fi
            if ((attempt < attempts)); then
              echo "Attempt ${attempt}/${attempts}: ${asset} not visible yet on ${tag}, retrying..."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::chart-releaser did not publish '${asset}' on release '${tag}' after ${attempts} attempts. The gh-pages index may now point to a broken download URL. See #146 for the same failure mode."
          exit 1

  release-oci:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/libredb-studio

      - name: Package chart
        run: helm package charts/libredb-studio -d .cr-release-packages

      - name: Push to OCI registry
        run: helm push .cr-release-packages/libredb-studio-*.tgz oci://ghcr.io/libredb/charts
