name: Helm Chart Release

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

# Prevent overlapping runs from racing on the shared gh-pages index/release
# state. See #146: back-to-back pushes to charts/** triggered overlapping
# runs, and chart-releaser silently produced a release with a missing asset.
concurrency:
  group: helm-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Set up Python (for chart-testing)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing lint
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts charts/libredb-studio

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing install
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio \
            --helm-extra-set-args "\
              --set secrets.jwtSecret=test-jwt-secret-minimum-32-characters-long \
              --set secrets.adminPassword=TestAdmin123 \
              --set secrets.userPassword=TestUser123"

  release-github-pages:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          # Chart releases (tag libredb-studio-<chart-version>) must never take
          # the repo's Latest marker away from product releases (bare semver).
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Verify chart release asset was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read the chart version robustly: split on the first colon and strip
          # surrounding whitespace and quotes, so a quoted or padded value still parses.
          version=$(awk -F':' '/^version:/ { gsub(/[[:space:]"'\'']/, "", $2); print $2; exit }' charts/libredb-studio/Chart.yaml)
          tag="libredb-studio-${version}"
          echo "Verifying GitHub Release asset for tag: ${tag}"
          # The Release/asset can lag behind chart-releaser via the API (eventual
          # consistency), so retry with backoff before treating it as a real failure.
          asset_count=0
          for attempt in 1 2 3 4 5; do
            asset_count=$(gh api "repos/${{ github.repository }}/releases/tags/${tag}" --jq '.assets | length' 2>/dev/null || echo "0")
            if [ "${asset_count}" -ge 1 ]; then
              echo "OK: ${tag} has ${asset_count} asset(s) (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: no asset visible yet for ${tag}, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::chart-releaser did not publish a release asset for '${tag}' after retries. The gh-pages index may now point to a broken download URL. See #146 for the same failure mode."
          exit 1

  release-oci:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/libredb-studio

      - name: Package chart
        run: helm package charts/libredb-studio -d .cr-release-packages

      - name: Push to OCI registry
        run: helm push .cr-release-packages/libredb-studio-*.tgz oci://ghcr.io/libredb/charts
