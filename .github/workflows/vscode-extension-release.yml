# The VS Code extension's release (docs/DISTRIBUTION.md, "VS Code extension (Marketplace)").
# It runs on a pushed vscode-extension-<version> tag, its own namespace: product
# tags stay bare semver and chart tags libredb-studio-<chart version>, so
# release-artifacts.yml and the chart's workflows never see these tags.
#
# verify refuses the tag unless it names vscode-extension/package.json's version
# and its commit is on main; gates then run the same reusable workflow as every
# pull request, smoke matrix included, and upload the tested VSIX as the
# vscode-extension-vsix artifact.
#
# publish then uploads that same VSIX to the Visual Studio Marketplace, from
# the vscode-marketplace environment, which requires a reviewer. It rebuilds
# nothing. Its only credential is the job's GitHub OIDC token, which
# `vsce publish --oidc` trades for a Marketplace token against the trusted
# publisher the libredb publisher names; no Marketplace token is stored.
# No GitHub Release: a published release starts the product's own publishes.
name: VS Code Extension Release

on:
  push:
    tags:
      - "vscode-extension-*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: The tag names the manifest's version
        working-directory: vscode-extension
        run: node scripts/release-tag.mjs "$GITHUB_REF_NAME"

      - name: The tag's commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag's commit is not on main." >&2
            exit 1
          fi

  gates:
    name: Gates
    needs: verify
    uses: ./.github/workflows/vscode-extension.yml

  publish:
    name: Publish to the Visual Studio Marketplace
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install the extension's dependencies, for vsce
        working-directory: vscode-extension
        run: npm ci --ignore-scripts

      - name: Download the VSIX the gates tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension-vsix
          path: vscode-extension/dist-vsix

      - name: Publish it
        working-directory: vscode-extension
        run: npm run publish:marketplace
