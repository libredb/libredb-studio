name: DO Packer Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released semver tag for snapshot name AND image pin - must exist on ghcr.io/libredb/libredb-studio'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy/digitalocean/droplet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3

      # DO's official validation scripts, pinned to a reviewed commit of
      # digitalocean/marketplace-partners (they run as root inside the image
      # build) — bump MP_SHA deliberately after reviewing upstream changes,
      # and keep the copy in deploy/digitalocean/README.md in sync
      - name: Fetch DO marketplace scripts
        env:
          MP_SHA: b70878804ca27c01d5f5e882d26485defbaba210 # master @ 2026-07-16
        run: |
          curl -fsSLo scripts/90-cleanup.sh   "https://raw.githubusercontent.com/digitalocean/marketplace-partners/${MP_SHA}/scripts/90-cleanup.sh"
          curl -fsSLo scripts/99-img-check.sh "https://raw.githubusercontent.com/digitalocean/marketplace-partners/${MP_SHA}/scripts/99-img-check.sh"

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver (e.g. 0.14.1), got: $VERSION"
            exit 1
          fi

      - name: Packer init & validate
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          packer init .
          packer validate -var "version=$VERSION" .

      - name: Packer build
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          VERSION: ${{ inputs.version }}
        # Birden fazla bolge denenir: DigitalOcean bir bolgede kapasite
        # yoksa 422 "Size is not available in this region" doner ve yapim
        # cokerdi - 0.18.3'te iki deneme de nyc3'te bu yuzden dustu. Snapshot
        # hangi bolgede uretildiginden bagimsiz, o yuzden sirayla denemek
        # guvenli. Ilk basarili bolge isi bitirir.
        run: |
          set -o pipefail
          for BOLGE in nyc3 nyc1 sfo3 ams3 fra1; do
            echo "::group::packer build (region=$BOLGE)"
            if packer build -var "version=$VERSION" -var "region=$BOLGE" . ; then
              echo "::endgroup::"
              echo "yapim bolgesi: $BOLGE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "$BOLGE basarisiz, siradaki bolge deneniyor" >&2
          done
          echo "FATAL: hicbir bolgede yapim tamamlanamadi" >&2
          exit 1

      # DO artifact_id format is "region1,region2:snapshot_id" — the ID is after the colon
      - name: Snapshot ID to job summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SNAPSHOT_ID=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)
          {
            echo "## DigitalOcean Snapshot"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Snapshot ID | \`${SNAPSHOT_ID}\` |"
            echo "| Version | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
