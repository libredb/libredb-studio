name: Agent Eval (real model)

# Drives the agent run loop against a REAL model and reports, per case, whether the
# run answered the question it was asked.
#
# This is deliberately NOT a job in ci.yml, and not a required check. Three reasons,
# each of which has already cost this repository something:
#
#  - **Its verdict is not a function of the code under review.** A model endpoint
#    answers differently on two runs of the same commit. `security-scan.yml` makes
#    the same argument for itself and stays out of the required set for it.
#  - **A fork PR cannot see secrets.** An eval inside ci.yml would hard-block every
#    fork PR the way SonarCloud once did, which is the defect that made SonarCloud
#    advisory in the first place.
#  - **It costs money and quota.** The reference model's free tier is 15 requests a
#    minute, and a morning of manual testing exhausted it (#341). `tests/evals/real-model.ts`
#    paces its cases and reports a rate limit as a rate limit rather than as a
#    failure — a quota says nothing about the model or about this code.
#
# What a red run means: a case did not answer. That is a finding about the MODEL's
# strategy, not necessarily a defect in this repository — the scripted corpus in
# `tests/evals/strategy-defects.test.ts` is what proves the harness can see it, and
# this is what tells you whether the shipped model still does it.
#
# Cron slot 07:12 Tue; the taken slots are 03:37 daily (security-scan), 05:23 daily
# (helm-index-check), 06:00 Mon (update-sponsors), 06:20 Fri (codeql) and 06:41 Mon
# (distribution-check).

on:
  schedule:
    - cron: "12 7 * * 2"
  workflow_dispatch:
    inputs:
      case:
        description: "Run a single case by name (blank runs all)"
        required: false
        type: string
      model:
        description: "Model id to evaluate (blank uses the repository default)"
        required: false
        type: string

concurrency:
  # Event-keyed as well as ref-keyed, for the reason security-scan.yml records: a
  # push must not cancel the week's only scheduled run.
  group: agent-eval-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Agent Eval (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      # A repository without the credential skips cleanly rather than going red:
      # a fork, or this repository before the secret exists, has nothing to say
      # about a model it cannot reach.
      - name: Check for a model credential
        id: credential
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "::notice::LLM_API_KEY is not set; skipping the real-model eval."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the eval
        if: steps.credential.outputs.present == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
          AGENT_EVAL_CASE: ${{ inputs.case }}
          # No LIBREDB_AGENT_ENABLED: since #331 T5 the runtime is available because
          # a model is configured, which the step above has already established, and
          # the ledger's default (.workflow-data under the runner's working
          # directory) is writable here. Setting the flag would state a condition
          # the job does not depend on.
          JWT_SECRET: test-secret-for-ci-build-only-32ch
        run: bun run agent:eval | tee "$GITHUB_STEP_SUMMARY"
