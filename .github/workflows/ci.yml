name: CI

on:
  push:
    branches:
      - ci
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  lint-and-build:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Chart version sync guard (issue #138)
        # Runs inside the required "Lint, Typecheck and Build" check on
        # purpose: a separate job would be advisory-only without a branch
        # protection change. actions/checkout is shallow and single-ref, so
        # fetch main explicitly for the base comparison (appVersion changed
        # => chart version must change too and must not be a released tag).
        # Strict mode makes unavailable git state a failure in CI rather than
        # a skipped check.
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          bun run chart:check
        env:
          CHART_SYNC_STRICT: "1"

      - name: Localized README drift guard (#317)
        # Same reasoning as the chart guard above: inside the required check so
        # it actually gates. README_zh.md and README_ja.md restate README.md's
        # engine table and install commands, and nothing else notices drift.
        run: bun run readme:check

      - name: Security posture drift guard (control 3.3)
        # Same reasoning as the two guards above: inside the required check so it actually gates.
        # docs/SECURITY.md claims which controls exist and names what verifies each one; this fails
        # the build when a row points at a file that is missing or never runs, when a security test
        # exists that no row accounts for, or when a control claims to be implemented with nothing
        # verifying it.
        run: bun run security:check

      - name: Check formatting (Biome)
        run: bun run format

      - name: Run linters (oxlint + ESLint)
        run: bun run lint

      # The Windows launcher (issue #114) is dependency-free Go whose pure
      # logic tests run on any OS. Gate it here, not only in the release
      # workflow: windows-package is a hard release gate, so a launcher
      # regression discovered first at tag time would block the release.
      - name: Setup Go (Windows launcher toolchain)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packaging/windows/launcher/go.mod
          # Dependency-free module (no go.sum) - caching would only warn.
          cache: false

      - name: Vet and test the Windows launcher (Go)
        run: |
          cd packaging/windows/launcher
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test ./...

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run knip (unused files, exports, dependencies)
        run: bun run knip

      - name: Build project
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: test-secret-for-ci-build-only-32ch
          ADMIN_EMAIL: admin@libredb.org
          ADMIN_PASSWORD: test-admin
          USER_EMAIL: user@libredb.org
          USER_PASSWORD: test-user

      - name: Build library package (tsup)
        run: bun run build:lib

      - name: Check package types resolution (attw)
        run: bun run attw

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio

      - name: Run merged test coverage (core + components)
        run: bun run test:coverage
        env:
          JWT_SECRET: test-secret-for-ci-build-only-32ch
          ADMIN_EMAIL: admin@libredb.org
          ADMIN_PASSWORD: test-admin
          USER_EMAIL: user@libredb.org
          USER_PASSWORD: test-user

      # The project holds 100% line coverage (#196). Fail fast with the exact
      # uncovered file:line ranges instead of letting coverage erode silently.
      - name: Enforce 100% line coverage
        run: bun run coverage:check

      - name: Upload coverage artifact
        # always(): keep the lcov available for debugging when coverage:check
        # fails for a non-obvious reason (e.g. malformed report, merge bug).
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info

  e2e:
    name: E2E Tests
    needs: [lint-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Install Playwright browsers
        # webkit is required alongside chromium: playwright.config.ts's
        # webkit-security project (scoped to e2e/security-headers.spec.ts)
        # runs under this job's unfiltered `playwright test` invocation. The
        # other Playwright-installing workflows (docker-build-push.yml,
        # release-artifacts.yml, and the channel-e2e job below) all drive
        # scripts/channel-embedded-sample-e2e.sh, which pins
        # --config=playwright.channel.config.ts - a chromium-only project
        # list that never resolves the webkit-security project - so they stay
        # chromium-only on purpose.
        run: bunx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: bunx playwright test
        env:
          JWT_SECRET: test-secret-for-ci-build-only-32ch
          ADMIN_EMAIL: admin@libredb.org
          ADMIN_PASSWORD: test-admin
          USER_EMAIL: user@libredb.org
          USER_PASSWORD: test-user

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # The engines floor in package.json (>=24.0.0) is a tested claim: build the
  # standalone payload once, then boot it through the npx launcher on every
  # supported Node tier and assert the documented behaviour of each
  # (scripts/engine-smoke.sh).
  engine-payload:
    name: Engine Smoke - Build Payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        # build-standalone-payload.sh aligns the better-sqlite3 binding to the
        # ambient node (probe + npm rebuild). The payload must ship the Node 24
        # ABI exactly like release-artifacts.yml does - without this, the
        # runner's default node dictates the ABI and the matrix legs assert
        # against a payload no release would ever ship.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Build standalone payload
        run: bash scripts/build-standalone-payload.sh dist-payload
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload payload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-smoke-payload
          path: dist-payload/libredb-studio-standalone-*.tar.gz
          retention-days: 1

  engine-smoke:
    name: Engine Smoke (Node ${{ matrix.node-version }})
    needs: [engine-payload]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference runtime the payload above was built on.
          - node-version: "24"
            tier: node24
          # The current upper release. Asserts the SAME outcome as node24,
          # which is what proves the payload is portable across majors:
          # better-sqlite3 is N-API since v13, so the binary built into a
          # Node 24 payload has to load and work here too.
          - node-version: "26"
            tier: node26
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download payload artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-smoke-payload
          path: dist-payload

      - name: Run engine smoke (${{ matrix.tier }})
        run: bash scripts/engine-smoke.sh dist-payload/libredb-studio-standalone-*.tar.gz ${{ matrix.tier }}

  # Browser E2E of the embedded samples against the PACKAGED artifact: the
  # tarball channel (extract + node server.js) and the npx channel
  # (bin/studio.js --archive). The regular e2e job covers the same spec
  # against the repo build; this one catches packaging-only regressions
  # (e.g. a payload missing seed-assets/). scripts/channel-embedded-sample-e2e.sh
  channel-e2e:
    name: Channel E2E (tarball + npx)
    needs: [engine-payload]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Download payload artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-smoke-payload
          path: dist-payload

      - name: Channel E2E - tarball
        run: bash scripts/channel-embedded-sample-e2e.sh tarball dist-payload/libredb-studio-standalone-*.tar.gz

      - name: Channel E2E - npx
        run: bash scripts/channel-embedded-sample-e2e.sh npx dist-payload/libredb-studio-standalone-*.tar.gz

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build charts/libredb-studio

      - name: Lint Helm chart
        run: helm lint charts/libredb-studio --strict

      # Deployability with DEFAULT values is a certified-catalog requirement
      # (Rancher partner-charts) and the chart's zero-config promise, but until
      # now only helm-release's lint-test job proved it - and that job runs on
      # main pushes, so a regression first surfaced post-merge (#170). Run the
      # same install here, skipped when the PR leaves charts/ alone: a kind
      # cluster is not worth several minutes on unrelated PRs. Same skip shape
      # as the operator-bundle step below.
      # Two conditions decide it. This file is in the path set on purpose:
      # otherwise a PR that edits the install step below would be the one PR
      # that never runs it.
      - name: Decide whether the default-values install can run
        id: chart-changes
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet origin/main...HEAD -- charts/ .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "charts/ and this workflow unchanged - skipping the default-values install"
            exit 0
          fi
          # Image gate, the same one helm-release's preflight applies (#161): with
          # default values the chart deploys
          # ghcr.io/libredb/libredb-studio:<appVersion>, and a version-bump commit
          # precedes that image by the whole release chain - so an ungated install
          # fails on every bump with ImagePullBackOff for an image that does not
          # exist yet. Nothing is lost by skipping: helm-release's lint-test runs
          # the same default-values install once the image is published.
          app_version=$(grep '^appVersion:' charts/libredb-studio/Chart.yaml | awk '{print $2}' | tr -d '"')
          if ! docker manifest inspect "ghcr.io/libredb/libredb-studio:${app_version}" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ghcr.io/libredb/libredb-studio:${app_version} is not on GHCR yet - skipping the default-values install. helm-release runs it after the image is published."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python (for chart-testing)
        if: steps.chart-changes.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        if: steps.chart-changes.outputs.changed == 'true'
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Create Kind cluster
        if: steps.chart-changes.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing install (default values, zero-config)
        if: steps.chart-changes.outputs.changed == 'true'
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --charts charts/libredb-studio

      # The operator embeds a copy of the chart (checked by the required
      # chart:check gate) and commits the OLM bundle generated from
      # operator/config. This step catches bundle drift: config edited without
      # re-running 'make bundle'. -I ignores the volatile createdAt stamp.
      # Skipped when the PR does not touch operator/ (the tool download is
      # not worth it on unrelated PRs).
      - name: Verify operator bundle is up to date
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet origin/main...HEAD -- operator/; then
            echo "operator/ unchanged - skipping bundle freshness check"
            exit 0
          fi
          make -C operator bundle
          # intent-to-add: without it, git diff ignores files the bundle
          # generation CREATED (the exact drift this gate exists to catch).
          git add --intent-to-add operator/
          if ! git diff -I '^ *createdAt:' --exit-code operator/; then
            echo "::error::operator/bundle or operator/config is stale. Run 'make -C operator bundle' and commit the result."
            exit 1
          fi

  sonarcloud:
    name: SonarCloud Analysis
    needs: [test]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: coverage

      - name: Verify coverage file
        run: |
          echo "=== Coverage file check ==="
          ls -la coverage/
          echo "=== First 5 SF lines ==="
          grep "^SF:" coverage/lcov.info | head -5
          echo "=== Record count ==="
          grep -c "^SF:" coverage/lcov.info
          echo "=== Sample record ==="
          head -20 coverage/lcov.info

      # Report the package version so SonarCloud's "previous_version" new-code
      # definition resets its baseline at each release. Single source of truth:
      # package.json (node is preinstalled on the runner). Read into a step
      # output, then passed to the scanner via args (not shell-interpolated).
      - name: Resolve project version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.pkg.outputs.version }}
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
