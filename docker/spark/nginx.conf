# The TLS proxy of the spark-tls service: HTTP/2 with TLS on 15005, gRPC passed to spark-auth:15002.
# Spark Connect has no TLS of its own, so a remote server is reached through a proxy like this one.
# The two timeouts are above the longest statement the live check runs (300 s); nginx's default of 60 s would end a
# silent run, which Spark would keep running.
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  server {
    listen 15005 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    grpc_read_timeout 300s;
    grpc_send_timeout 300s;
    location / {
      grpc_pass grpc://spark-auth:15002;
    }
  }
}
