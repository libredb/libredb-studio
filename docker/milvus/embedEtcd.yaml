# The embedded etcd's configuration, as Milvus's standalone_embed.sh at tag v3.0.2 writes it. It listens inside the
# container only: database-compose.yml never publishes 2379.
listen-client-urls: http://0.0.0.0:2379
advertise-client-urls: http://0.0.0.0:2379
quota-backend-bytes: 4294967296
auto-compaction-mode: revision
auto-compaction-retention: '1000'
