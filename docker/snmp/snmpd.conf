# The LibreDB live-check agent for the `snmp` provider (#1721), 14 October 2026.
# The values are chosen to be RECOGNISABLE: what shows on screen cannot have come from
# anywhere else.

# One community, READ ONLY, over the whole view. There is no write community: nothing can
# write to this agent.
view  everything  included .1
rocommunity  libredb-live  default -V everything

# The recognisable system group
sysName      live-test-agent
sysLocation  1721-live-test
sysContact   session-1721
sysDescr     LibreDB live-check agent, net-snmp, 127.0.0.1 port 1161
sysServices  72

# Fixed values and a three-row table, served by the `pass` script
pass .1.3.6.1.4.1.8072.9999.9999  /usr/local/bin/playpen.sh

agentaddress udp:161
