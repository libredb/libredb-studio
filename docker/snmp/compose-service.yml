# The service block for database-compose.yml, kept here until it is merged.
#
# It is NOT merged yet on purpose. `database-compose.yml` is one of the files every provider in
# flight edits, so a block merged here would collide with the ones landing beside it; the
# coordinating session merges all of them at once, and that merge is the last step of the PR.
#
# This sentence used to point at "the NETCONF fixture" for its reason. That fixture is not on the
# branch this one lands on, so the pointer led a reader to a file they could not open - the reason
# is written out here instead.
#
# The port is a decision, not a measurement: 1161 is 161 moved above the privileged range, bound to
# loopback the way the other fixtures are. A container cannot bind 161 without extra capability,
# and nothing in this repository needs the real port.
services:
  snmp:
    build: { context: ./docker/snmp }
    image: libredb-fixture/snmp:5.9.4
    pull_policy: build
    container_name: libredb-snmp
    profiles: ["snmp"]
    ports:
      - "127.0.0.1:1161:161/udp"
    healthcheck:
      # The agent answers its own sysName over the loopback inside the container. A UDP port that
      # is open says nothing: snmpd binds before it has read its configuration, so a port check
      # would report a fixture healthy while it still answers nothing. This asks a question whose
      # answer only the configured agent can give.
      test: ["CMD", "snmpget", "-v2c", "-c", "libredb-live", "-t", "2", "-r", "1", "127.0.0.1:161", "1.3.6.1.2.1.1.5.0"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
