# The fixture broker. Anonymous and unencrypted on purpose: this is a loopback-only fixture
# and a credential here would be committed in the open, which the compose file's other
# services avoid the same way.
listener 1883 0.0.0.0
allow_anonymous true

# No persistence. Removing the container resets the fixture, and a retained certificate that
# outlived a restart would make a stale reading look live.
persistence false

log_dest stdout
# Every PUBLISH and SUBSCRIBE is logged, because the one question a Sparkplug fixture is asked
# is "what did the reader actually subscribe to", and this is where that answer lives.
log_type all
