version: "1"

# Seed connections for the S3 fixtures of docker/s3/README.md: one per target and principal, for the browser pass and
# agent plan mode (a connection made in the browser cannot be rebuilt on the server for an agent run). Load it with
# SEED_CONFIG_PATH=docker/s3/seed-connections.yaml. Every connection is managed and read-only, and every target is
# loopback, so none needs allowInsecureAuth. The MinIO, MinIO region, Silo and RustFS passwords are the committed
# throwaway values of database-compose.yml; Garage's secrets are generated, so they come from the environment that
# docker/s3/garage-env.sh prints, and the TLS fixture's CA from LIBREDB_S3_TLS_CA as PEM text.
connections:
  # MinIO: 127.0.0.1:9000, signing region us-east-1.
  - id: "s3-minio-root"
    name: "S3 MinIO (root)"
    type: s3
    host: localhost
    port: 9000
    region: "us-east-1"
    user: "libredb"
    password: "Probe123pass!"
    roles: ["*"]
    managed: true
    readOnly: true
  - id: "s3-minio-browse"
    name: "S3 MinIO (browse)"
    type: s3
    host: localhost
    port: 9000
    region: "us-east-1"
    user: "studio-browse"
    password: "Browse123pass!"
    roles: ["*"]
    managed: true
    readOnly: true
  - id: "s3-minio-browse-demo"
    name: "S3 MinIO (browse-demo)"
    type: s3
    host: localhost
    port: 9000
    region: "us-east-1"
    user: "studio-browse"
    password: "Browse123pass!"
    database: "studio-demo"
    roles: ["*"]
    managed: true
    readOnly: true
  - id: "s3-minio-scoped"
    name: "S3 MinIO (scoped)"
    type: s3
    host: localhost
    port: 9000
    region: "us-east-1"
