# cppagent's own configuration. The adapter is a service of this compose file rather than a
# simulator inside the agent, so the provider reads an agent that is reading a device, which is
# the shape a real installation has.
Devices = devices.xml
Port = 5000
AllowPut = false
SchemaVersion = 2.0
# 2^17 observations. The window tests read sequence numbers against this buffer.
BufferSize = 17
Adapters {
  LIBREDB-LATHE-1722 {
    Host = mtconnect-adapter
    Port = 7878
  }
}
logger_config {
  # Every ReST request is logged with its full path, which is how a test tells a refusal this
  # provider made in phase 0 from one the agent made: the first leaves no line here.
  logging_level = info
  output = cout
}
