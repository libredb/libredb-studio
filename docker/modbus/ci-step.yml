# WHY THE Modbus live check STEP IS NOT IN THIS FILE ANY MORE.
#
# This file used to carry the step itself, staged here because five engines were landing in
# one round and five sessions editing one workflow would have been that round's merge in
# miniature. Whoever owned the workflow was to paste it in. MEASURED 19 October 2026: the
# paste never happened for any of the six engines, so none of the nineteen workflow files
# mentioned this fixture and the live check ran only by hand.
#
# The step now lives in `.github/workflows/ci.yml`, in the `functional-smoke` job, named
# `Modbus live check`. It is not duplicated here on purpose: the pin this fixture runs is held equal to
# the compose fragment's by a test, and a pin that lives in a third file nobody compares is a
# third pin. What stays here is the reasoning the step is too short to carry.
#
# The image is the one `docker/modbus/compose-service.yml` declares, and the test named above holds the two
# equal, so CI and a developer's machine run the same device.
#
# WHAT THE TWO READINESS CHECKS ARE FOR. The first asks whether anything there speaks Modbus: a
# reply whose MBAP header echoes what was sent. The second asks whether a known register answers
# the value the fixture is configured with. Both build their frames by hand rather than going
# through the provider being measured, because a readiness check that runs through the thing under
# test cannot tell a broken fixture from a broken provider and would name the wrong one.
#
# The second plainly implies the first, and they are still asked separately: it is what lets the
# step say WHICH of the two failed. Nothing speaking Modbus and a server serving another table's
# values are different things to go and fix.
#
# NOT `/dev/tcp`. The first question used to be whether the port accepted a connection, and
# MEASURED, against a published container port that is answered by Docker itself: 5 ms for the
# accept against 332 ms for the server behind it. A published port accepts while nothing inside
# the container is listening, so "the port is open" is not a readiness fact.
#
# AND WHAT THE RED SAYS. A fixture that never became ready exits before the live check runs and
# says NOT MEASURED, because nothing about the product was measured. A live check that ran and
# failed says which claim failed. Those are two different results and the step keeps them apart:
# the third state is in the sentence rather than hidden inside a red.

      # The Modbus provider's live check (#1723): the four tables of a third-party fixture read
      # through the real provider, the refusals it makes before dialling, and the device asked
      # afterwards whether it can still answer somebody else. It runs on both runtimes, because
      # the provider ships to both and the Node path is the one that bundles.
