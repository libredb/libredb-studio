# The Modbus step of `.github/workflows/ci.yml`, delivered on its own.
#
# Not written into that file directly, for the reason `docker/modbus/compose-service.yml` gives:
# five engines land in one round and five sessions editing one file is a small rerun of the merge
# this repository just finished.
#
# Paste the step below into the job that runs the other live checks, after the functional smoke.
# It needs no `if:` and no secret. The image is the one `docker/modbus/compose-service.yml`
# declares, and `tests/unit/db/modbus/live-environment.test.ts` holds the two equal, so CI and a
# developer's machine run the same device.
#
# WHAT THE TWO READINESS CHECKS ARE FOR. The first asks whether the port accepts a connection.
# That is not enough on its own and the gap was measured: a listener that accepts TCP and answers
# nothing passes it, so a fixture with no tables behind it would be called ready and the live
# check that followed would fail for a reason that reads like a product defect. The second asks
# whether a known register answers the value the fixture is configured with, over a frame built by
# hand rather than through the provider being measured.
#
# AND WHAT THE RED SAYS. A fixture that never became ready exits before the live check runs and
# says NOT MEASURED, because nothing about the product was measured. A live check that ran and
# failed says which claim failed. Those are two different results and the step keeps them apart:
# the third state is in the sentence rather than hidden inside a red.

      # The Modbus provider's live check (#1723): the four tables of a third-party fixture read
      # through the real provider, the refusals it makes before dialling, and the device asked
      # afterwards whether it can still answer somebody else. It runs on both runtimes, because
      # the provider ships to both and the Node path is the one that bundles.
      - name: Modbus live check
        run: |
          image="oitc/modbus-server@sha256:32bfe144512e1f070cf7e7e2513cdcb774d74db142ee5dbad45b21d6d705ab97"
          export MODBUS_LIVE_DIGEST="${image#*@}"
          trap 'docker rm -f libredb-ci-modbus > /dev/null' EXIT
          docker run -d --name libredb-ci-modbus \
            -v "$PWD/docker/modbus/modbus_server.json:/app/modbus_server.json:ro" \
            -p 127.0.0.1:1502:5020 "$image"
          ready=""
          end=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$end" ]; do
            # Two independent questions: the socket, then the data. Either alone is answered by a
            # fixture that is not serving this repository's tables.
            if (exec 3<>/dev/tcp/127.0.0.1/1502) 2>/dev/null && bun tests/live/modbus-ready-probe.ts; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "NOT MEASURED: the Modbus fixture did not answer within 60 s, so the live check never ran."
            docker logs --tail 50 libredb-ci-modbus
            exit 1
          fi
          bun tests/live/modbus-live-check.ts
          out="$(mktemp -d)"
          bun build tests/live/modbus-live-check.ts --target=node --outfile "$out/live.mjs"
          node "$out/live.mjs"
