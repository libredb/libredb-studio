# The `modbus` service of `database-compose.yml`, delivered on its own.
#
# Not written into that file directly: five engines land their fixtures in one round, and five
# sessions editing one file is a small rerun of the merge this repository just finished, with
# nobody to blame but us. The manager lands all five in one pass.
#
# Paste the block below into `database-compose.yml` before the Kubernetes note at the end of the
# services, and nothing else changes: it declares no volume, no network and no dependency.
#
# The digest here is the one `docker/modbus/ci-step.yml` runs and the one
# `tests/unit/db/modbus/live-environment.test.ts` holds the two to, so the fixture under the live
# check is the fixture under CI.

  modbus:
    # Pinned by digest, and by digest rather than by tag because the values this fixture answers
    # with ARE the expected outcomes: tests/integration/db/modbus-provider.test.ts and
    # tests/live/modbus-live-check.ts read them back. A tag that moved would change the device
    # under tests that never mention a version.
    #
    # Third party on purpose. The provider was first measured against a server written in this
    # repository, which left the same question open on every read: the side that wrote the device
    # and the side that read it were the same side. This image wraps pymodbus 3.12.x, so framing,
    # function-code decoding and exception responses are all somebody else's code, and the only
    # thing configured here is the values. It also took zero lines of wrapper code, which the two
    # alternatives did not: libmodbus is a C library and not a server, so using it means writing
    # the server that wraps it.
    image: oitc/modbus-server:2.3.0@sha256:32bfe144512e1f070cf7e7e2513cdcb774d74db142ee5dbad45b21d6d705ab97
    container_name: libredb-modbus
    hostname: libredb-modbus
    restart: unless-stopped
    volumes:
      # The tables, and the one-based key trap, are documented in docker/modbus/README.md.
      - ./docker/modbus/modbus_server.json:/app/modbus_server.json:ro
    ports:
      # Loopback only: a device that answers reads to anyone on the network is not a fixture,
      # and this one has no authentication of any kind because Modbus TCP has none.
      - "127.0.0.1:1502:5020"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    memswap_limit: 128M

