  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: |
        - "The Linux desktop AppImage could not start at all on Ubuntu 22.04, Debian 12 or an enterprise distribution of that generation: built on a newer image, it required GLIBC_2.38 in every bundled GTK and WebKit library, so the loader refused every shared object and no window ever opened"
        - "The x64 AppImage is now built on the oldest still-supported LTS and a test refuses a floating runner label on that job, because no release gate can see a glibc floor that only older machines hit"
        - "MariaDB is named as MariaDB - the overview published every MariaDB server as MySQL, an assertion the server never made - and an unmeasured cache hit ratio is no longer reported as 99%"
        - "Trino returned every bigint past 2^53 silently rounded, because the client protocol sends it as an unquoted JSON number"
        - "The two connection routes outside the provider caches never opened the SSH tunnel and reached the raw database host instead"
        - "MongoDB: the ordinary host and port deployment could not be connected to at all, authSource was dropped, and distinct queries and their errors were handled wrongly"
        - "The query agent's foreign-key read came back empty under the least-privilege PostgreSQL role the documentation prescribes; it now reads pg_constraint"
        - "Eight engines offered a transaction control the engine rejects with HTTP 400, because transaction support was assumed rather than declared per provider"
        - "Chart 0.1.46 changes no template: its content is the appVersion move to 0.13.2"
        - "Track app release 0.13.2 (appVersion bump; default image tag follows)"
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: libredb-studio
          image: ghcr.io/libredb/libredb-studio:0.13.2
          platforms:
            - linux/amd64
            - linux/arm64
