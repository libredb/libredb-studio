apiVersion: v1
entries:
  libredb-studio:
  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: |
        - "The query agent can be given settings for a model it has never measured, without a new release: agent.modelTuning mounts a JSON document of measured per-model settings and names it to the app"
        - "Give agent.modelTuning.existingConfigMap a ConfigMap you created from a file, or agent.modelTuning.document the same content inline; there is no separate enable flag, because naming a source is what enables it"
        - "A document that is missing, unreadable or off-schema is ignored and the settings the image ships with stand, so this cannot break a working agent - and GET /api/agent/config now tells an admin session which of the two happened"
        - "Until this version the setting existed but could not be used on Kubernetes: it names a file, and the pod runs with a read-only root filesystem and nowhere to put one"
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: libredb-studio
          image: ghcr.io/libredb/libredb-studio:0.13.3
          platforms:
            - linux/amd64
            - linux/arm64
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Documentation
          url: https://github.com/libredb/libredb-studio#readme
        - name: Container Image
          url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
