# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec
#
# One-click "deploy your own" from a fork. Boots zero-config: password
# (local) auth and browser-scoped storage. OIDC, AI, and durable
# server-side storage are opt-in below. Every `sync: false` value is
# prompted once during the Blueprint create flow (never committed here).

services:
  - type: web
    name: libredb-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Health check endpoint (matches the Dockerfile HEALTHCHECK and fly.toml).
    healthCheckPath: /api/db/health
    # Redeploy on push to the connected branch. `autoDeployTrigger` replaces
    # the deprecated `autoDeploy: true`; use `off` to deploy manually.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # --- Authentication (required) -------------------------------------
      # Zero-config default is email/password ("local"). Set the two
      # passwords and a 32+ char JWT secret at create time (prompted).
      - key: NEXT_PUBLIC_AUTH_PROVIDER
        value: local
      - key: JWT_SECRET
        sync: false # must be at least 32 characters
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PASSWORD
        sync: false

      # --- OIDC / SSO (optional) -----------------------------------------
      # For SSO instead of passwords, set NEXT_PUBLIC_AUTH_PROVIDER=oidc
      # above and uncomment these. The login page is force-dynamic, so the
      # provider is read at runtime - no rebuild needed to switch.
      # - key: OIDC_ISSUER
      #   sync: false
      # - key: OIDC_CLIENT_ID
      #   sync: false
      # - key: OIDC_CLIENT_SECRET
      #   sync: false
      # - key: OIDC_SCOPE
      #   value: openid profile email
      # - key: OIDC_ROLE_CLAIM
      #   sync: false
      # - key: OIDC_ADMIN_ROLES
      #   value: admin

      # --- Public demo access (optional) ---------------------------------
      # Turns the login screen into a one-click way in for visitors who have
      # no account, for a public showcase instance. Deliberately left
      # commented and without a value: this Blueprint is the target of the
      # README's "Deploy to Render" button and redeploys on every commit, so
      # a value here would open every service deployed from it. Set it in the
      # Render dashboard (Environment tab) on the one instance that wants it.
      # Never enable it on a service holding real data - anyone reaching the
      # URL gets a session.
      # - key: DEMO_MODE
      #   value: "true"

      # --- AI query assistance (optional) --------------------------------
      # Fully opt-in: uncomment and provide a key to enable. See the README
      # configuration section for supported providers/models.
      # - key: LLM_PROVIDER
      #   value: gemini
      # - key: LLM_MODEL
      #   value: gemini-2.5-flash
      # - key: LLM_API_KEY
      #   sync: false

      # --- Durable server-side storage (optional) ------------------------
      # Default ("local") keeps connections/settings in the browser's
      # localStorage: per-browser, but survives redeploys (nothing lives on
      # the server filesystem). For shared, multi-user, cross-device storage
      # switch to server-side SQLite on a persistent disk. This requires a
      # PAID instance - Render free web services cannot attach disks. Enable
      # BOTH the two vars below AND the `disk:` block at the bottom:
      # - key: STORAGE_PROVIDER
      #   value: sqlite
      # - key: STORAGE_SQLITE_PATH
      #   value: /app/data/libredb-storage.db
      #
      # Alternatively, provision a managed Postgres in this Blueprint
      # (`databases:` list) and set STORAGE_PROVIDER=postgres with
      # STORAGE_POSTGRES_URL from `fromDatabase` - durable without a disk and
      # safe to scale to multiple instances.

    # Persistent disk for the SQLite store above. Paid instances only;
    # uncomment together with the STORAGE_* vars.
    # disk:
    #   name: libredb-data
    #   mountPath: /app/data
    #   sizeGB: 1
