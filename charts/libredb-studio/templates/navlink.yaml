{{- /*
Rancher's link to Studio in the cluster's navigation. A NavLink is cluster-scoped, so the
name carries the namespace to keep two releases of the same name apart, joined with a dot,
which a namespace never holds, so two releases cannot render the same name. A cluster-scoped
name takes up to 253 characters, so nothing is cut. app.kubernetes.io/name stays
libredb-studio whatever nameOverride says, because that is the label the LibreDB Rancher
extension finds the link by. The link is always
https, the only scheme the LibreDB Rancher extension opens. The icon defaults to the LibreDB
logo inline as a data URI, files/logo.svg being a copy of the app's public/logo.svg, so
the browser fetches nothing from another host; without one Rancher draws a book. Rendered
only where the cluster serves the API; NOTES.txt says when it does not. The guards live in
_helpers.tpl.
*/}}
{{- $navLink := get (.Values.rancher | default dict) "navLink" | default dict }}
{{- if and (get $navLink "enabled") (.Capabilities.APIVersions.Has "ui.cattle.io/v1/NavLink") }}
{{- include "libredb-studio.clusterStudioNamespaceGuard" (dict "ctx" $ "what" "rancher.navLink.enabled renders a cluster-scoped NavLink") }}
apiVersion: ui.cattle.io/v1
kind: NavLink
metadata:
  name: {{ printf "%s.%s" .Release.Namespace (include "libredb-studio.fullname" .) }}
  {{- $labels := include "libredb-studio.labels" . | fromYaml }}
  {{- $_ := set $labels "app.kubernetes.io/name" "libredb-studio" }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  label: {{ get $navLink "label" | quote }}
  group: {{ get $navLink "group" | quote }}
  target: {{ get $navLink "target" | quote }}
  toURL: {{ printf "https://%s%s" (include "libredb-studio.navLinkHost" .) (.Values.config.basePath | default "") | quote }}
  iconSrc: {{ get $navLink "iconSrc" | default (printf "data:image/svg+xml;base64,%s" (.Files.Get "files/logo.svg" | b64enc)) | quote }}
{{- end }}
