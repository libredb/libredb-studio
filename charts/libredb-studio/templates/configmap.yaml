apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "libredb-studio.configMapName" . }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PORT: {{ .Values.service.targetPort | quote }}
  # Empty is the sentinel meaning "nobody chose": the image's entrypoint then
  # resolves the bind address itself and prefers a verified dual-stack "::".
  # The key is written explicitly rather than omitted so that whatever HOSTNAME
  # the runtime injects (a pod name, a container id) can never reach the server.
  HOSTNAME: {{ .Values.config.bindAddress | quote }}
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=384"
  NEXT_PUBLIC_AUTH_PROVIDER: {{ .Values.authProvider | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.authBootstrap }}
  AUTH_BOOTSTRAP: {{ .Values.config.authBootstrap | quote }}
  {{- end }}
  {{- /* Three-state, on the same rule as agent.enabled: unset writes nothing, so the
         app keeps its own default (Secure in production, except a loopback host reached
         over plain http). `false` is the operator's answer for a browser reaching a
         non-loopback host over plain http, where a Secure cookie is rejected and login
         silently loops. kindIs "invalid" rather than truthiness, because `false` is the
         value that matters most here and an `if` would drop it.

         The empty string is tested BESIDE nil because the two spellings of "unset" are
         not the same across Helm versions: 4.1 leaves the `authCookieSecure: null` in
         values.yaml as nil, and 4.2 coerces it to "", which passes `kindIs "invalid"`
         and writes `AUTH_COOKIE_SECURE: ""` on a default install. The app reads that
         back as unset, so nothing about the cookie changed — but the ConfigMap then
         carries a key nobody set, which an operator reading it takes as a decision
         somebody made. `--set config.authCookieSecure=null` still produced a true nil
         on both, which is why only the default install broke and only on 4.2. */}}
  {{- $cookieSecure := get .Values.config "authCookieSecure" }}
  {{- if and (not (kindIs "invalid" $cookieSecure)) (ne (toString $cookieSecure) "") }}
  AUTH_COOKIE_SECURE: {{ $cookieSecure | quote }}
  {{- end }}
  STORAGE_PROVIDER: {{ include "libredb-studio.storageProvider" . | quote }}
  {{- if eq (include "libredb-studio.storageProvider" .) "sqlite" }}
  STORAGE_SQLITE_PATH: {{ .Values.config.storageSqlitePath | quote }}
  {{- end }}
  {{- if .Values.config.llmProvider }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  {{- end }}
  {{- if .Values.config.llmModel }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  {{- end }}
  {{- if .Values.config.llmApiUrl }}
  LLM_API_URL: {{ .Values.config.llmApiUrl | quote }}
  {{- end }}
  {{- if eq .Values.authProvider "oidc" }}
  {{- if .Values.config.oidcIssuer }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  {{- end }}
  OIDC_SCOPE: {{ .Values.config.oidcScope | quote }}
  {{- if .Values.config.oidcRoleClaim }}
  OIDC_ROLE_CLAIM: {{ .Values.config.oidcRoleClaim | quote }}
  {{- end }}
  OIDC_ADMIN_ROLES: {{ .Values.config.oidcAdminRoles | quote }}
  {{- end }}
