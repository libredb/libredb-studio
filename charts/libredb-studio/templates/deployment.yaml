{{- /*
The sign-in mode guard comes first, as every mode guard keys on authProvider, then the openshift-mode
guards, so a values set that mode refuses names the openshift reason rather than one of the general
guards below.
*/}}
{{- include "libredb-studio.authProviderGuard" . }}
{{- include "libredb-studio.openshiftModeGuards" . }}
{{- include "libredb-studio.discoveryOnOpenShiftGuard" . }}
{{- /*
Zero-config bootstrap generates JWT_SECRET per pod on its own data volume, so
two replicas would sign sessions with different keys (intermittent 401s behind
the Service). Refuse the combination instead of shipping it broken.
*/}}
{{- if and (not (include "libredb-studio.authStrict" .)) (not .Values.secrets.jwtSecret) (not .Values.secrets.existingSecret) (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1)) }}
{{- fail "zero-config bootstrap generates a per-pod JWT secret, which breaks sessions across replicas: with replicaCount > 1 or autoscaling.enabled, set secrets.jwtSecret (or secrets.existingSecret), or use config.authBootstrap=off" }}
{{- end }}
{{- /*
The seed ConfigMap is only rendered from inline config; with neither an
inline config nor an existing ConfigMap the pod would mount a ConfigMap
that does not exist and never start. Refuse the combination instead.
*/}}
{{- if and .Values.seedConnections.enabled (not .Values.seedConnections.config) (not .Values.seedConnections.existingConfigMap) (not (get .Values.seedConnections "existingSecret")) }}
{{- fail "seedConnections.enabled requires seedConnections.config (inline), seedConnections.existingConfigMap or seedConnections.existingSecret - with none, the pod would mount a ConfigMap that does not exist" }}
{{- end }}
{{- include "libredb-studio.rancherModeGuards" . }}
{{- /*
The permission-fix init container needs root, which OpenShift's restricted-v2
SCC rejects - and where the SCC applies, the pod's UID/GID come from the
namespace range instead of podSecurityContext, so chowning to the configured
runAsUser/fsGroup would target the wrong owner anyway. Refuse the combination
rather than render a manifest that cannot work (#170).
*/}}
{{- /*
The agent's zero-config durable backend keeps run state in a directory on local
disk and takes file locks. Each pod mounts its own /app/data, so above one replica
a run started on one pod is simply not there when the browser's next request lands
on another - and on a shared RWX volume the locks contend instead. The only backend
that lifts this is @workflow/world-postgres, which the published image cannot load
at all (docs/BACKLOG.md B16), so this is refused rather than rendered broken (#331).
*/}}
{{- if and (include "libredb-studio.agentPossible" .) (include "libredb-studio.multiReplica" .) (not (include "libredb-studio.agentPostgresWorld" .)) }}
{{- fail "the agent runtime is single-instance: its zero-config ledger keeps run state on each pod's own disk behind file locks, so above one replica a run started on one pod is invisible to the next request. This release can run agents (an AI configuration is set in these values, or agent.enabled=true) and asks for more than one replica. Set replicaCount=1 (with autoscaling off) to keep the agent, or agent.enabled=false to run Studio on many replicas with no agent. The one backend that lifts the constraint, WORKFLOW_TARGET_WORLD=@workflow/world-postgres, is not loadable in the published container image today (B16 in docs/BACKLOG.md), so multi-replica agent runs are unsupported rather than merely unconfigured: set it (with WORKFLOW_POSTGRES_URL) through extraEnv only if image.repository points at an image that carries that world" }}
{{- end }}
{{- include "libredb-studio.governanceGuards" . }}
{{- if and .Values.persistence.fixPermissions (include "libredb-studio.adaptOpenShiftSecurityContext" .) }}
{{- fail "persistence.fixPermissions cannot be combined with the OpenShift security-context adaptation: restricted-v2 rejects the root init container, and the pod's UID/GID come from the namespace range rather than podSecurityContext, so the chown would target the wrong owner. On OpenShift, use a storage class whose volumes the kubelet applies fsGroup to (or pre-chown the volume) and leave persistence.fixPermissions=false; set global.compatibility.openshift.adaptSecurityContext=disabled only if this is not an OpenShift cluster" }}
{{- end }}
{{- /*
openshift.trustedCABundle needs the Cluster Network Operator (config.openshift.io/v1):
without it the ConfigMap is never filled and the boot check would restart the pod
forever. NODE_EXTRA_CA_CERTS takes one file, so a second one from extraEnv would
silently replace the cluster bundle (an extraEnvFrom source carrying the name is a
blind spot, as in effectiveBindAddress).
*/}}
{{- if include "libredb-studio.trustedCABundleEnabled" . }}
{{- if not (include "libredb-studio.openshiftApiServed" (dict "ctx" $ "api" "config.openshift.io/v1")) }}
{{- fail "openshift.trustedCABundle.enabled is true but this cluster does not serve config.openshift.io/v1, so nothing would ever fill the trusted CA bundle: install on OpenShift, or set global.compatibility.openshift.apis=force to render it without API detection (GitOps, offline helm template)" }}
{{- end }}
{{- range .Values.extraEnv }}
{{- if eq (.name | default "") "NODE_EXTRA_CA_CERTS" }}
{{- fail "openshift.trustedCABundle.enabled sets NODE_EXTRA_CA_CERTS, which takes one file, and extraEnv sets it too: remove the extraEnv entry and add your private CA to the cluster's trusted bundle, or turn openshift.trustedCABundle.enabled off and keep the extraVolumes recipe" }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
The MCP server (#246) accepts a token only when both channel values are set, and only the
operator knows the public address and its basePath, so an enabled block without them is refused
rather than rendered as an endpoint that accepts nothing. `default dict` keeps a values set that
predates the block, as an upgrade with --reuse-values carries, rendering as before.
*/}}
{{- $mcp := .Values.mcp | default dict }}
{{- if and (get $mcp "enabled") (not (get $mcp "url")) }}
{{- fail "mcp.enabled is true but mcp.url is empty: set it to the address MCP clients use, such as https://studio.example.com/api/mcp, including config.basePath when one is set" }}
{{- end }}
{{- if and (get $mcp "enabled") (not (get $mcp "tokenLabel")) }}
{{- fail "mcp.enabled is true but mcp.tokenLabel is empty: set it to any value, and change it to revoke every MCP token at once" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "libredb-studio.fullname" . }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
    {{- with include "libredb-studio.topologyLabels" . }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- /* The OpenShift console's Topology view draws the Studio-to-database arrow from this
         annotation, a JSON array of {apiVersion, kind, name}; the bundled subchart is the only
         workload the chart knows. */}}
  {{- if .Values.postgresql.enabled }}
  annotations:
    app.openshift.io/connects-to: {{ list (dict "apiVersion" "apps/v1" "kind" "StatefulSet" "name" (include "libredb-studio.postgresql.fullname" .)) | toJson | squote }}
  {{- end }}
spec:
  {{- if not (include "libredb-studio.autoscalingEnabled" .) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- /* With one pod on a volume claim, the old pod is stopped before the new one is created, and
         the new one waits for the claim. The default rolling update keeps the old pod until the new
         one is ready, and the new one never gets an exclusive claim the old one holds: a
         ReadWriteOnce volume attached to another node (Longhorn, a cloud block volume) or a
         ReadWriteOncePod claim, so the rollout waits until helm --wait gives up. Not type Recreate:
         the API server defaults rollingUpdate on every Deployment already installed, and a
         server-side apply (Helm 4, Rancher's Apps page) cannot remove a field no manager owns, so
         an upgrade to Recreate is refused. More than one replica shares the claim, which only
         ReadWriteMany allows, and keeps the default. */}}
  {{- if and (include "libredb-studio.persistenceEnabled" .) (not (include "libredb-studio.multiReplica" .)) }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "libredb-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- /* The tuning document, and only when this chart is the one rendering it.
               Without this the feature silently does not update: a `helm upgrade` with a new
               agent.modelTuning.document rewrites the ConfigMap and leaves the pod template
               untouched, so nothing rolls - and the app reads the file once per process, so the
               running pods keep the profile they started with until something unrelated restarts
               them. The operator changed a value, the chart took it, and the agent goes on
               running the old settings.
               Rendered only for the INLINE document, because an existingConfigMap is the
               operator's own object: this chart renders nothing for it and so has nothing to
               hash, and a constant here would be a trigger that never fires pretending to be one.
               Rolling after editing that ConfigMap is the operator's move, and the README says so.
               Conditional rather than always-on so an install not using the feature gains no
               annotation, and therefore no restart, on the upgrade that adds this. */}}
        {{- $tuning := get (.Values.agent | default dict) "modelTuning" | default dict }}
        {{- if and (get $tuning "document") (not (get $tuning "existingConfigMap")) }}
        checksum/agent-model-tuning: {{ include (print $.Template.BasePath "/agent-tuning-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "libredb-studio.labels" . | nindent 8 }}
        {{- with include "libredb-studio.topologyLabels" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "libredb-studio.serviceAccountName" . }}
      {{- /* Set on the pod as well as on the ServiceAccount: with serviceAccount.create=false
             the pod runs as an account this chart does not render, usually the namespace's
             default one, whose own setting would mount its API token. Studio reads that token
             only for Vault Kubernetes auth (VAULT_ROLE). Only an explicit true mounts it, so a
             removed value renders false, never empty. */}}
      automountServiceAccountToken: {{ if .Values.serviceAccount.automountServiceAccountToken }}true{{ else }}false{{ end }}
      securityContext:
        {{- include "libredb-studio.podSecurityContext" . | nindent 8 }}
      {{- /* The kubelet does not apply fsGroup to hostPath (and some local) volumes, so a
             statically provisioned PV leaves /app/data unwritable until someone chowns it.
             Opt-in, and only with a real volume: it needs a root container, which the
             restricted-v2 SCC on OpenShift rejects, and an emptyDir gets fsGroup anyway (#170). */}}
      {{- if and (include "libredb-studio.persistenceEnabled" .) .Values.persistence.fixPermissions }}
      initContainers:
        - name: fix-data-permissions
          image: {{ include "libredb-studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} /app/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "libredb-studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "libredb-studio.configMapName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.secrets.jwtSecret .Values.secrets.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.jwtSecret }}
                  {{- if not (include "libredb-studio.authStrict" .) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.secrets.adminEmail .Values.secrets.existingSecret }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.adminEmail }}
                  optional: true
            {{- end }}
            {{- /* Never under governance, the access review or openshift sign-in, whose boot checks refuse
                   ADMIN_PASSWORD and USER_PASSWORD: the guards refuse the inline values, and an existingSecret is
                   not read for them. */}}
            {{- $passwordsOff := or (include "libredb-studio.governanceEnabled" .) (include "libredb-studio.accessReviewEnabled" .) (include "libredb-studio.openshiftSignIn" .) }}
            {{- if and (or .Values.secrets.adminPassword .Values.secrets.existingSecret) (not $passwordsOff) }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.adminPassword }}
                  {{- /* A hard ref only where a missing password really is an error: strict
                         mode AND the local provider. Under OIDC the app never reads it, so an
                         existingSecret built for OIDC must not keep the pod from starting (#170). */}}
                  {{- if not (and (include "libredb-studio.authStrict" .) (include "libredb-studio.localAuth" .)) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if and (or .Values.secrets.userPassword .Values.secrets.existingSecret) (not $passwordsOff) }}
            - name: USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.userEmail }}
                  optional: true
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.userPassword }}
                  optional: true
            {{- end }}
            {{- /* TOTP second factor. Always optional: MFA is opt-in per account, so a missing
                   key must never keep the pod from starting, and the app treats an absent value
                   as "no second factor". Keyed separately from the passwords rather than nested
                   under them so an operator can rotate a secret without touching a credential. */}}
            {{- if or .Values.secrets.adminTotpSecret .Values.secrets.existingSecret }}
            - name: ADMIN_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.adminTotpSecret }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.userTotpSecret .Values.secrets.existingSecret }}
            - name: USER_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.userTotpSecret }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.llmApiKey .Values.secrets.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.llmApiKey }}
                  optional: true
            {{- end }}
            {{- /* secrets.oidcExistingSecret: the two client values from that Secret, not optional, so a
                   missing Secret or key stops the pod instead of starting it without a client. */}}
            {{- with get .Values.secrets "oidcExistingSecret" }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.existingSecretKeys.oidcClientId }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.existingSecretKeys.oidcClientSecret }}
            {{- end }}
            {{- if or .Values.secrets.oidcClientId .Values.secrets.existingSecret }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.oidcClientId }}
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.oidcClientSecret .Values.secrets.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.oidcClientSecret }}
                  optional: true
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.postgresql.fullname" . }}
                  key: password
            - name: STORAGE_POSTGRES_URL
              value: {{ include "libredb-studio.postgresql.url" . | quote }}
            {{- else if or .Values.secrets.storagePostgresUrl .Values.secrets.existingSecret }}
            - name: STORAGE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ .Values.secrets.existingSecretKeys.storagePostgresUrl }}
                  optional: true
            {{- end }}
            {{- /* Governance: the URL from the Secret, never optional, and a stable instance id. One pod
                   reports the chart's fullname (or governance.instanceId), so a rollout updates the same
                   heartbeat row (docs/GOVERNANCE.md#instance-id); more than one reports each pod's own name. */}}
            {{- if include "libredb-studio.governanceEnabled" . }}
            - name: GOVERNANCE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libredb-studio.secretName" . }}
                  key: {{ include "libredb-studio.governanceSecretKey" (dict "root" . "name" "governancePostgresUrl") }}
            - name: GOVERNANCE_INSTANCE_ID
              {{- if include "libredb-studio.governanceMultiReplica" . }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
              {{- else }}
              value: {{ get .Values.governance "instanceId" | default (include "libredb-studio.fullname" .) | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.seedConnections.enabled }}
            - name: SEED_CONFIG_PATH
              value: "/app/config/{{ .Values.seedConnections.configMapKey | default "seed-connections.yaml" }}"
            {{- end }}
            {{- /* The managed list's cache also paces how soon the discovery export is read again. Never in
                   openshift mode: there the app tells the browser to refresh the list every 10 seconds while
                   SEED_CACHE_TTL_MS is unset, so a RoleBinding change shows without waiting on this cache. */}}
            {{- if and (or .Values.seedConnections.enabled (include "libredb-studio.discoveryEnabled" .)) (not (include "libredb-studio.openshiftSignIn" .)) }}
            - name: SEED_CACHE_TTL_MS
              value: {{ .Values.seedConnections.cacheTTL | default 60000 | quote }}
            {{- end }}
            {{- /* Kubernetes discovery: the export.json of the export Secret mounted below. */}}
            {{- if include "libredb-studio.discoveryEnabled" . }}
            - name: SEED_KUBERNETES_DISCOVERY_PATH
              value: "{{ include "libredb-studio.discoveryMountDir" . }}/export.json"
            {{- $maxAge := get .Values.discovery.kubernetes "maxAgeMs" }}
            {{- if and (not (kindIs "invalid" $maxAge)) (ne (toString $maxAge) "") }}
            - name: SEED_KUBERNETES_DISCOVERY_MAX_AGE_MS
              value: {{ $maxAge | int64 | toString | quote }}
            {{- end }}
            {{- /* Studio maps the export to rows, so the cluster domain is read here, not by the exporter. */}}
            {{- $clusterDomain := get .Values.discovery.kubernetes "clusterDomain" }}
            {{- if and (not (kindIs "invalid" $clusterDomain)) (ne (toString $clusterDomain) "") }}
            - name: SEED_KUBERNETES_DISCOVERY_CLUSTER_DOMAIN
              value: {{ $clusterDomain | quote }}
            {{- end }}
            {{- end }}
            {{- /* The Kubernetes access review: its switch, Studio's own Deployment as the admin review's
                   target, and the projected token and CA mounted below. */}}
            {{- if include "libredb-studio.accessReviewEnabled" . }}
            {{- $review := .Values.accessReview }}
            - name: KUBERNETES_ACCESS_REVIEW
              value: "on"
            - name: KUBERNETES_ACCESS_REVIEW_ADMIN_DEPLOYMENT
              value: {{ printf "%s/%s" .Release.Namespace (include "libredb-studio.fullname" .) | quote }}
            - name: KUBERNETES_ACCESS_REVIEW_TOKEN_PATH
              value: "{{ include "libredb-studio.accessReviewDir" . }}/token"
            - name: KUBERNETES_ACCESS_REVIEW_CA_PATH
              value: "{{ include "libredb-studio.accessReviewDir" . }}/ca.crt"
            {{- $cache := get $review "cacheSeconds" }}
            {{- if and (not (kindIs "invalid" $cache)) (ne (toString $cache) "") }}
            - name: KUBERNETES_ACCESS_REVIEW_CACHE_SECONDS
              value: {{ $cache | int64 | toString | quote }}
            {{- end }}
            {{- with get $review "signIn" }}
            - name: KUBERNETES_ACCESS_REVIEW_SIGN_IN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- /* Only when the operator said something. Unset writes nothing, so the app
                   derives availability from the AI configuration and the ledger (#331 T5);
                   quoted because EnvVar.value is a string and an unquoted `true` is rejected
                   by the API server. Written before extraEnv so an extraEnv entry of the same
                   name still wins. */}}
            {{- if include "libredb-studio.agentFlagSet" . }}
            - name: LIBREDB_AGENT_ENABLED
              value: {{ get .Values.agent "enabled" | quote }}
            {{- end }}
            {{- /* The conversation off-switch, on the same rule as the flag above: unset
                   writes nothing and the app keeps its own default, which is on. Quoted for
                   the same reason, and written before extraEnv for the same reason. Only a
                   boolean is written: Helm 4.2, which Rancher's Apps page installs with, drops
                   the null default from the values, and `get` reads the missing key as "", so a
                   null-only guard wrote an empty variable there and nothing under Helm 4.1. */}}
            {{- $threadContext := get .Values.agent "threadContext" }}
            {{- if kindIs "bool" $threadContext }}
            - name: LIBREDB_AGENT_THREAD_CONTEXT
              value: {{ $threadContext | quote }}
            {{- end }}
            {{- /* Where the mounted tuning document lands. Its own directory rather than
                   /app/config, which the seed ConfigMap already claims: a second volume at
                   the same mountPath would hide the first. Written before extraEnv so an
                   extraEnv entry of the same name still wins, like the flag above. */}}
            {{- if include "libredb-studio.agentTuningSet" . }}
            - name: AGENT_MODEL_TUNING_PATH
              value: "/app/model-tuning/{{ include "libredb-studio.agentTuningKey" . }}"
            {{- end }}
            {{- /* The MCP server (#246): nothing by default, and all four variables as strings
                   when mcp.enabled is true; the guards at the top of this file have already
                   refused an enabled block without url or tokenLabel. Written before extraEnv,
                   like the agent flag, so an extraEnv entry of the same name still wins. */}}
            {{- with (.Values.mcp | default dict) }}
            {{- if .enabled }}
            - name: LIBREDB_MCP_ENABLED
              value: "true"
            - name: LIBREDB_MCP_URL
              value: {{ .url | quote }}
            - name: LIBREDB_MCP_TOKEN_LABEL
              value: {{ .tokenLabel | quote }}
            - name: LIBREDB_MCP_TOKEN_TTL_DAYS
              value: {{ .tokenTtlDays | default 30 | quote }}
            {{- end }}
            {{- end }}
            {{- /* The agent's ledger directory, set by the chart because the image a
                   default install pulls does not yet set it. image.tag defaults to
                   .Chart.AppVersion, and the Dockerfile's own
                   WORKFLOW_LOCAL_DATA_DIR default landed after that version was
                   tagged - so on the image this chart actually deploys today the
                   ledger would resolve to `.workflow-data` under WORKDIR /app, which
                   securityContext.readOnlyRootFilesystem makes unwritable, and every
                   run would refuse with LEDGER_UNAVAILABLE. /app/data is mounted in
                   every render (emptyDir, or the PVC when persistence is enabled).
                   Once an image carrying the ENV is released the two agree on the
                   same path, so this stays correct rather than becoming redundant.
                   Written before extraEnv, so an operator can still move it. */}}
            - name: WORKFLOW_LOCAL_DATA_DIR
              value: /app/data/workflow
            {{- /* The cluster's trusted CA bundle, read by Node at start and checked at
                   boot (src/lib/config/ca-bundle-preflight.ts). Written before extraEnv;
                   the guard above refuses an extraEnv entry of the same name. */}}
            {{- if include "libredb-studio.trustedCABundleEnabled" . }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/libredb-studio/trusted-ca/ca-bundle.crt
            {{- end }}
            {{- /* openshift sign-in (src/lib/openshift-auth/config.ts): the ServiceAccount client, the Route's
                   public URL, the client token and CA mounted below, and the self review's admin target
                   (src/lib/kubernetes-access/config.ts): Studio's Deployment for a Helm install, the
                   LibreDBStudio resource, which the operator names after the release, under the operator. No
                   OPENSHIFT_API_URL (the app keeps https://kubernetes.default.svc), no AUTH_SESSION_TTL_SECONDS
                   unless config.sessionTtlSeconds is set, and no review cache unless
                   openshift.signIn.reviewCacheSeconds is: the app's defaults for this mode stand. Written before
                   extraEnv, so an extraEnv entry of the same name still wins. */}}
            {{- if include "libredb-studio.openshiftSignIn" . }}
            {{- $signIn := dig "signIn" dict (.Values.openshift | default dict) }}
            - name: OPENSHIFT_OAUTH_CLIENT_ID
              value: {{ include "libredb-studio.openshiftClientId" . | quote }}
            - name: OPENSHIFT_PUBLIC_URL
              value: {{ printf "https://%s%s" (get (.Values.openshiftRoute | default dict) "host") (.Values.config.basePath | default "") | quote }}
            - name: OPENSHIFT_OAUTH_TOKEN_FILE
              value: "{{ include "libredb-studio.openshiftSignInDir" . }}/oauth-client-token"
            - name: OPENSHIFT_API_CA_FILE
              value: "{{ include "libredb-studio.openshiftSignInDir" . }}/ca.crt"
            {{- if include "libredb-studio.operatorManaged" . }}
            - name: KUBERNETES_ACCESS_REVIEW_ADMIN_LIBREDBSTUDIO
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
            {{- else }}
            - name: KUBERNETES_ACCESS_REVIEW_ADMIN_DEPLOYMENT
              value: {{ printf "%s/%s" .Release.Namespace (include "libredb-studio.fullname" .) | quote }}
            {{- end }}
            {{- $cache := get $signIn "reviewCacheSeconds" }}
            {{- if and (not (kindIs "invalid" $cache)) (ne (toString $cache) "") }}
            - name: KUBERNETES_ACCESS_REVIEW_CACHE_SECONDS
              value: {{ $cache | int64 | toString | quote }}
            {{- end }}
            {{- with get $signIn "review" }}
            - name: KUBERNETES_ACCESS_REVIEW_SIGN_IN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- include "libredb-studio.probe" (dict "probe" . "basePath" ($.Values.config.basePath | default "")) | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- include "libredb-studio.probe" (dict "probe" . "basePath" ($.Values.config.basePath | default "") "ready" (include "libredb-studio.governanceEnabled" $ | eq "true")) | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- include "libredb-studio.probe" (dict "probe" . "basePath" ($.Values.config.basePath | default "")) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            {{- if .Values.seedConnections.enabled }}
            - name: seed-config
              mountPath: /app/config
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.agentTuningSet" . }}
            - name: agent-model-tuning
              mountPath: /app/model-tuning
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.governanceEnabled" . }}
            - name: governance-keyring
              mountPath: {{ include "libredb-studio.governanceKeyringDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.discoveryEnabled" . }}
            - name: kubernetes-discovery
              mountPath: {{ include "libredb-studio.discoveryMountDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.accessReviewEnabled" . }}
            - name: access-review
              mountPath: {{ include "libredb-studio.accessReviewDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.trustedCABundleEnabled" . }}
            - name: trusted-ca
              mountPath: /etc/libredb-studio/trusted-ca
              readOnly: true
            {{- end }}
            {{- if include "libredb-studio.openshiftSignIn" . }}
            - name: openshift-oauth
              mountPath: {{ include "libredb-studio.openshiftSignInDir" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if include "libredb-studio.persistenceEnabled" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "libredb-studio.pvcName" . }}
        {{- else }}
        - name: data
          {{- /* /app/data is the one volume a user can grow (SQLite storage, seeded samples),
                 so it is the one worth capping. Empty stays uncapped: a retroactive limit
                 would start evicting pods that are fine today (#170). */}}
          {{- if .Values.persistence.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.seedConnections.enabled }}
        - name: seed-config
          {{- with get .Values.seedConnections "existingSecret" }}
          secret:
            secretName: {{ . }}
          {{- else }}
          configMap:
            name: {{ .Values.seedConnections.existingConfigMap | default (printf "%s-seed-connections" (include "libredb-studio.fullname" .)) }}
          {{- end }}
        {{- end }}
        {{- if include "libredb-studio.agentTuningSet" . }}
        - name: agent-model-tuning
          configMap:
            name: {{ get (get .Values.agent "modelTuning") "existingConfigMap" | default (printf "%s-agent-model-tuning" (include "libredb-studio.fullname" .)) }}
        {{- end }}
        {{- /* The keyring, from the same Secret as the URL, as one read-only file. 256 is mode 0400,
               written in decimal because YAML 1.2 readers take 0400 as four hundred. The file is
               root-owned and the kubelet adds group read for podSecurityContext.fsGroup, the group
               uid 1001 reads it through, which the governance guards require (docs/GOVERNANCE.md#keyring). */}}
        {{- if include "libredb-studio.governanceEnabled" . }}
        - name: governance-keyring
          secret:
            secretName: {{ include "libredb-studio.secretName" . }}
            defaultMode: 256
            items:
              - key: {{ include "libredb-studio.governanceSecretKey" (dict "root" . "name" "governancePrivateKeys") }}
                path: keyring.json
        {{- end }}
        {{- /* The export Secret, whole: it starts with no key, and export.json appears once the exporter
               has written it, which a projection of that one key would not wait for. */}}
        {{- if include "libredb-studio.discoveryEnabled" . }}
        - name: kubernetes-discovery
          secret:
            secretName: {{ include "libredb-studio.discoveryExportSecret" . }}
        {{- end }}
        {{- /* A short-lived token of Studio's ServiceAccount for the reviews only, and the cluster's CA
               from the kube-root-ca.crt ConfigMap every namespace carries; the kubelet renews the token. */}}
        {{- if include "libredb-studio.accessReviewEnabled" . }}
        - name: access-review
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.accessReview.tokenExpirationSeconds | default 3600 | int64 }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- /* Whole, without items or subPath: the kubelet then refreshes the file once the
               Cluster Network Operator has injected the bundle. */}}
        {{- if include "libredb-studio.trustedCABundleEnabled" . }}
        - name: trusted-ca
          configMap:
            name: {{ include "libredb-studio.fullname" . }}-trusted-ca
        {{- end }}
        {{- /* openshift mode: Studio's OAuth client secret, a short-lived token of its ServiceAccount
               with an audience of its own, so it is no use at the API server, and the cluster's CA,
               which also signs the OAuth route's certificate; the kubelet renews the token. */}}
        {{- if include "libredb-studio.openshiftSignIn" . }}
        - name: openshift-oauth
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "libredb-studio.openshiftOAuthAudience" . }}
                  expirationSeconds: {{ dig "signIn" "tokenExpirationSeconds" 600 (.Values.openshift | default dict) | int64 }}
                  path: oauth-client-token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
