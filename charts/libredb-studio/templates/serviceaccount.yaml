{{- if .Values.serviceAccount.create -}}
{{- /* In openshift mode the account is the OAuth client: the redirect reference names the Route
       (its host is where the OAuth server may send the code) and the redirect URI adds the
       callback path, so only that path under the Route's host is a registered redirect. Merged
       with serviceAccount.annotations, the chart's winning on a collision. */}}
{{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
{{- if include "libredb-studio.openshiftSignIn" . }}
{{- $reference := printf "{\"kind\":\"OAuthRedirectReference\",\"apiVersion\":\"v1\",\"reference\":{\"kind\":\"Route\",\"name\":%s}}" (include "libredb-studio.fullname" . | toJson) }}
{{- $callback := trimPrefix "/" (printf "%s/api/auth/openshift/callback" (.Values.config.basePath | default "")) }}
{{- $annotations = merge (dict "serviceaccounts.openshift.io/oauth-redirectreference.first" $reference "serviceaccounts.openshift.io/oauth-redirecturi.first" $callback) $annotations }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "libredb-studio.serviceAccountName" . }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
