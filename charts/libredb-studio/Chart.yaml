apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting fourteen engines - PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino and Apache Cassandra
type: application
version: 0.1.48
appVersion: "0.13.3"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # False: what 0.1.48 ADDS is a new optional ConfigMap and a read-only mount - no
  # dependency moves and no security behaviour changes with it. The appVersion it
  # carries, 0.13.3, is the one 0.1.47 already published, and 0.13.3's transport fixes
  # (a rediss:// or couchbases:// URL landing on SSL mode disable, and Couchbase posting
  # plain HTTP to the TLS management port) are recorded there with this flag set - which
  # is where an operator looking for them will find them. The app-level security fixes of
  # earlier releases remain recorded on 0.1.37, the chart version that first shipped
  # them; the adm-zip pin note belongs to 0.1.44, unchanged.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.3
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "The query agent can be given settings for a model it has never measured, without a new release: agent.modelTuning mounts a JSON document of measured per-model settings and names it to the app"
    - "Give agent.modelTuning.existingConfigMap a ConfigMap you created from a file, or agent.modelTuning.document the same content inline; there is no separate enable flag, because naming a source is what enables it"
    - "A document that is missing, unreadable or off-schema is ignored and the settings the image ships with stand, so this cannot break a working agent - and GET /api/agent/config now tells an admin session which of the two happened"
    - "Until this version the setting existed but could not be used on Kubernetes: it names a file, and the pod runs with a read-only root filesystem and nowhere to put one"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
