apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting seventeen engines - PostgreSQL, MySQL, SQLite, DuckDB, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino, Apache Cassandra, libSQL and Prometheus
type: application
version: 0.1.68
appVersion: "0.16.2"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  # Two keywords for one engine, and the second is the one that gets searched: the
  # provider is registered as `libsql`, but the product an evaluator types is Turso.
  - libsql
  - turso
  # One keyword only, unlike the pair above: DuckDB is registered as `duckdb` and that
  # is also the product name an evaluator types, so there is no second spelling to catch.
  - duckdb
  # Two keywords, like the libsql pair above: `prometheus` is the type-id and the product,
  # and `promql` is what an evaluator looking for a PromQL client types.
  - prometheus
  - promql
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # False: 0.1.60 tracks app release 0.14.1, which repairs how the light theme is
  # painted and how two wire families are asked for a query plan. Accent colours were
  # picked for a dark ground and reused on the light one, so warning, success and danger
  # text sat as low as 1.46:1 against the surface behind it; and both EXPLAIN grammars
  # are now measured when the connection opens rather than assumed from the type id. No
  # template, value or default moves, and the image is where every one of them lands.
  # False: 0.1.58 tracks app release 0.13.7, which adds one metadata field to
  # package.json and nothing else. The npm artifact declared no licence, so
  # @libredb/studio showed as unlicensed on the registry while the repository shipped
  # MIT throughout and the LICENSE file was always in the tarball. Nothing an operator
  # deploys moves, no template or value changes, and the image behaves identically -
  # the fix is legible only on the npm package page.
  # False: 0.1.57 changes only what a DEFAULT install renders, and only on Helm 4.2+.
  # `authCookieSecure: null` in values.yaml stayed nil under Helm 4.1 and is coerced to ""
  # under 4.2, which passed the template's `kindIs "invalid"` guard and wrote
  # AUTH_COOKIE_SECURE: "" into the ConfigMap of an install that configured nothing. The app
  # reads an empty value as unset, so no cookie behaviour changed on any install - what
  # changed is that the ConfigMap stopped carrying a key nobody set, which an operator
  # reading it takes as a decision somebody made. Explicit `true`/`false` are untouched.
  # False: 0.1.56 tracks app release 0.13.6, which removes a claim rather than fixing a
  # weakness. The sign-in page carried an "Encrypted" badge that named no subject; on the
  # default STORAGE_PROVIDER=local it had no referent beyond the TLS the browser already
  # indicates, since credentials stay in the browser's localStorage in plaintext by design.
  # Nothing an operator deploys moves, and no behaviour changes - the at-rest AES-256-GCM
  # over the sqlite and postgres store is exactly what it was.
  # True: 0.1.55 tracks app release 0.13.5, which carries three fixes an operator should
  # weigh. The SSH tunnel passed no `hostVerifier` to ssh2 and the library has no default,
  # so the tunnel completed its handshake with whatever answered on the bastion's address
  # and everything it carried - the database password among it - was readable to anything
  # that could occupy that address; it is now trust-on-first-use pinned per connection. The
  # destructive-command confirmation gate spoke SQL only, so FLUSHALL and a deleteMany with
  # an empty filter ran unconfirmed while DELETE FROM asked. And POST /api/db/maintenance
  # validated that an operation exists rather than that it could take the given target, so
  # a direct request could vacuum a whole SQLite file while naming one table. No chart
  # template or value moves for any of them - the fixes are in the application image.
  # False: 0.1.54 changes no packaged template and no value - it names one more engine in
  # the README, the description and the keywords, DuckDB, which is a new provider in the
  # app rather than a chart change. The README is a packaged file, so #167 costs it a
  # chart version even though nothing an operator deploys moves.
  # False: 0.1.53 changes no packaged template and no value - it names one more engine in
  # the README, the description and the keywords, libSQL, which is a new provider in the
  # app rather than a chart change. The README is a packaged file, so #167 costs it a
  # chart version even though nothing an operator deploys moves.
  # False: 0.1.52 adds one value, config.authCookieSecure, and changes no behaviour on its
  # own - unset (the default) writes no AUTH_COOKIE_SECURE and the app keeps deciding, so
  # every existing install renders exactly as before. It makes an already-supported setting
  # discoverable from values.yaml instead of reachable only through extraEnv; `false` is a
  # deliberate weakening an operator asks for, not one this version applies.
  # 0.13.3's transport fixes stay recorded on 0.1.47 with this flag set, which is where an
  # operator looking for them will find them. The app-level security fixes of earlier
  # releases remain recorded on 0.1.37, the chart version that first shipped them; the
  # adm-zip pin note belongs to 0.1.44, unchanged.
  # True: 0.1.64 tracks app release 0.16.0, which carries two security-relevant changes in the
  # image. A transaction belonged to the cached provider rather than to the session, so any
  # account reaching a shared connection id could roll back another account's uncommitted work,
  # measured through the product's own route on PostgreSQL 18.4; and the local auth provider
  # gains an optional TOTP second factor, asserted as control 1.6 in docs/SECURITY.md. The first
  # is a cross-account authorization defect an operator running a shared connection needs to know
  # about, which is what this flag exists to tell them.
  # False: 0.1.66 tracks app release 0.16.1, which fixes correctness and startup
  # behaviour rather than a weakness. The one an operator should still read before
  # upgrading is the boot refusal: with AUTH_BOOTSTRAP off and no JWT secret the
  # container used to start, report itself healthy and answer every login with a 503,
  # and it now prints what is missing and exits. A chart install that set
  # secrets.jwtSecret (or secrets.existingSecret) is unaffected, because the chart has
  # always required it; an install that reached that state some other way now stops at
  # boot instead of serving a login nobody can pass.
  # True: 0.1.67 tracks app release 0.16.2, whose headline change is an authorization fix in
  # the image. The database provider cache was keyed on the connection id the caller sent, so
  # any signed-in account that named another session's connection id was handed that session's
  # already-open provider, with its credentials, and could also disconnect it. It was reported
  # privately as GHSA-3wh2-8x78-jfw4 and scored 8.8. An operator running shared or seeded
  # connections should read it before deciding whether to upgrade; no chart template or value
  # moves, so the upgrade is the image.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.16.2
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "Names one more engine, Prometheus, in the description, the keywords and the README. It is a new provider in the application image, and no template, value or default moves in this chart version"
    - "A connection id sent by the caller no longer selects a cached database provider. Any signed-in account that named another session's connection id was handed that session's already-open provider, with its credentials, and could disconnect it; the cache key is now derived from the stored connection, the server it resolves to and a digest of its credentials. Reported privately as GHSA-3wh2-8x78-jfw4 and scored 8.8"
    - "A seed connection sent inline that claims a seed id is now resolved through the same role filter as a seed id sent on its own, so a role that may not reach a seed connection can no longer reach it by naming it inline"
    - "Schema diff reads a column default as SQL text and compares it by presence, so a default of 0, an empty string or false is no longer dropped as absent; a MariaDB default is read as its value rather than as the expression text, measured against live servers. ClickHouse MATERIALIZED, ALIAS and EPHEMERAL columns are emitted without a DEFAULT clause, which no engine accepts on them"
    - "Elasticsearch connections authenticate with an API key pair as well as with a username and password, sent as the Authorization ApiKey scheme Elasticsearch publishes. OpenSearch is unchanged: nothing has measured whether its security plugin accepts the same scheme, so the form does not offer the fields there"
    - "Query results page from the stats strip. The preview cap now travels as an execution option instead of being written into the SQL, so a LIMIT a user typed is a hard bound that is never paged past, while a capped preview can be read beyond its first page"
    - "The example compose files publish their PostgreSQL and Vault containers on the loopback interface only, so a demo brought up on a host with a public address no longer exposes them to the network"
    - "Track app release 0.16.2 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
