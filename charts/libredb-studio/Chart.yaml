apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting fourteen engines - PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino and Apache Cassandra
type: application
version: 0.1.46
appVersion: "0.13.2"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # False: 0.13.2 changes no dependency and no security behaviour. Its content is
  # the Linux desktop AppImage's glibc floor and provider correctness, neither of
  # which reaches the chart or the image. The app-level security fixes remain
  # recorded on 0.1.37, the chart version that first shipped them; the adm-zip pin
  # note belongs to 0.1.44 and is unchanged.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.2
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "The Linux desktop AppImage could not start at all on Ubuntu 22.04, Debian 12 or an enterprise distribution of that generation: built on a newer image, it required GLIBC_2.38 in every bundled GTK and WebKit library, so the loader refused every shared object and no window ever opened"
    - "The x64 AppImage is now built on the oldest still-supported LTS and a test refuses a floating runner label on that job, because no release gate can see a glibc floor that only older machines hit"
    - "MariaDB is named as MariaDB - the overview published every MariaDB server as MySQL, an assertion the server never made - and an unmeasured cache hit ratio is no longer reported as 99%"
    - "Trino returned every bigint past 2^53 silently rounded, because the client protocol sends it as an unquoted JSON number"
    - "The two connection routes outside the provider caches never opened the SSH tunnel and reached the raw database host instead"
    - "MongoDB: the ordinary host and port deployment could not be connected to at all, authSource was dropped, and distinct queries and their errors were handled wrongly"
    - "The query agent's foreign-key read came back empty under the least-privilege PostgreSQL role the documentation prescribes; it now reads pg_constraint"
    - "Eight engines offered a transaction control the engine rejects with HTTP 400, because transaction support was assumed rather than declared per provider"
    - "Chart 0.1.46 changes no template: its content is the appVersion move to 0.13.2"
    - "Track app release 0.13.2 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
