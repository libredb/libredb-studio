apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, and Redis
type: application
version: 0.1.33
appVersion: "0.11.0"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.11.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "Documentation only. No default, template or image change, so an upgrade from 0.1.32 alters nothing a cluster runs"
    - "Documented the optional agent runtime: it is off unless LIBREDB_AGENT_ENABLED is set, it reuses the existing AI configuration, and both of its variables are passed through extraEnv"
    - "Documented the single-instance constraint the agent runtime adds. Its zero-config durable backend keeps run state on local disk behind file locks, so running agents above replicaCount 1 requires WORKFLOW_TARGET_WORLD set to the opt-in PostgreSQL backend, which is not yet reachable in the published image"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
