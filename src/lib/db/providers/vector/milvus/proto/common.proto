enum IndexState {
    IndexStateNone = 0;
    Unissued = 1;
    InProgress = 2;
    Finished = 3;
    Failed = 4;
    Retry = 5;
}

enum SegmentState {
    SegmentStateNone = 0;
    NotExist = 1;
    Growing = 2;
    Sealed = 3;
    Flushed = 4;
    Flushing = 5;
    Dropped = 6;
    Importing = 7;
}

enum SegmentLevel {
    Legacy = 0; // zero value for legacy logic
    L0 = 1; // L0 segment, contains delta data for current channel
    L1 = 2; // L1 segment, normal segment, with no extra compaction attribute
    L2 = 3; // L2 segment, segment with extra data distribution info
}

message Status {
    ErrorCode error_code = 1 [deprecated=true];
    string reason = 2;
    int32 code = 3;
    bool retriable = 4;
    string detail = 5;
    map<string, string> extra_info = 6;
}

message KeyValuePair {
    string key = 1;
    string value = 2;
}

message KeyDataPair {
    string key = 1;
    bytes data = 2;
}

message Blob {
    bytes value = 1;
}

enum PlaceholderType {
    None = 0;
    BinaryVector = 100;
    FloatVector = 101;
    Float16Vector = 102;
    BFloat16Vector = 103;
    SparseFloatVector = 104;
    Int8Vector = 105;
    Int64 = 5;
    VarChar = 21;

    EmbListBinaryVector = 300;
    EmbListFloatVector = 301;
    EmbListFloat16Vector = 302;
    EmbListBFloat16Vector = 303;
    EmbListSparseFloatVector = 304;
    EmbListInt8Vector = 305;
}

message PlaceholderValue {
    string tag = 1;
    PlaceholderType type = 2;
    // values is a 2d-array of nq rows, every row contains a query vector.
    // for dense vector, all rows are of the same length; for sparse vector,
    // the length of each row may vary depending on their number of non-zeros.
    repeated bytes values = 3;
    bool element_level = 4;
}

message PlaceholderGroup {
    repeated PlaceholderValue placeholders = 1;
}


message Address {
    string ip = 1;
    int64 port = 2;
}

