message MsgBase {
    MsgType msg_type = 1;
    int64  msgID = 2;
    uint64 timestamp = 3;
    int64 sourceID = 4;
    int64 targetID = 5;
    map<string, string> properties = 6;
    ReplicateInfo replicateInfo = 7 [deprecated = true];
}

message ReplicateInfo {
    option deprecated = true;
    bool isReplicate = 1;
    uint64 msgTimestamp = 2;
    string replicateID = 3;
}

enum DslType {
    Dsl = 0;
    BoolExprV1 = 1;
}

// Don't Modify This. @czs
message MsgHeader {
    common.MsgBase base = 1;
}

// Don't Modify This. @czs
message DMLMsgHeader {
    common.MsgBase base = 1;
    string shardName = 2;
}

enum CompactionState {
    UndefiedState = 0;
    Executing = 1;
    Completed = 2;
}

// State of one compaction task, distinct from the aggregate CompactionState.
enum CompactionTaskState {
    CompactionTaskStateUnknown = 0;
    CompactionTaskStateExecuting = 1;
    CompactionTaskStatePipelining = 2;
    CompactionTaskStateCompleted = 3;
    CompactionTaskStateFailed = 4;
    CompactionTaskStateTimeout = 5;
    CompactionTaskStateAnalyzing = 6;
    CompactionTaskStateIndexing = 7;
    // Cleanup does not by itself indicate whether the task succeeded.
    CompactionTaskStateCleaned = 8;
    CompactionTaskStateMetaSaved = 9;
    CompactionTaskStateStatistic = 10;
}

// Type of one compaction task.
enum CompactionType {
    CompactionTypeUndefined = 0;
    reserved 1;
    CompactionTypeMerge = 2;
    CompactionTypeMix = 3;
    CompactionTypeSingle = 4;
    CompactionTypeMinor = 5;
    CompactionTypeMajor = 6;
    CompactionTypeLevel0Delete = 7;
    CompactionTypeClustering = 8;
    CompactionTypeSort = 9;
    CompactionTypePartitionKeySort = 10;
    CompactionTypeClusteringPartitionKeySort = 11;
    CompactionTypeBumpSchemaVersion = 12;
}

enum ConsistencyLevel {
    Strong = 0;
    Session = 1; // default in PyMilvus
    Bounded = 2;
    Eventually = 3;
    Customized = 4; // Users pass their own `guarantee_timestamp`.
}

enum ImportState {
    ImportPending = 0;              // the task in in pending list of rootCoord, waiting to be executed
    ImportFailed = 1;               // the task failed for some reason, get detail reason from GetImportStateResponse.infos
    ImportStarted = 2;              // the task has been sent to datanode to execute
    ImportPersisted = 5;            // all data files have been parsed and all meta data already persisted, ready to be flushed.
    ImportFlushed = 8;              // all segments are successfully flushed.
    ImportCompleted = 6;            // all indexes are successfully built and segments are able to be compacted as normal.
    ImportFailedAndCleaned = 7;     // the task failed and all segments it generated are cleaned up.
}

