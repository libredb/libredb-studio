message PrivilegeExt {
    ObjectType object_type = 1;
    ObjectPrivilege object_privilege = 2;
    int32 object_name_index = 3;
    int32 object_name_indexs = 4;
}

extend google.protobuf.MessageOptions {
    PrivilegeExt privilege_ext_obj = 1001;
}

enum StateCode {
    Initializing = 0;
    Healthy = 1;
    Abnormal = 2;
    StandBy = 3;
    Stopping = 4;
}

enum LoadState {
    LoadStateNotExist = 0;
    LoadStateNotLoad = 1;
    LoadStateLoading = 2;
    LoadStateLoaded = 3;
}

message SegmentStats {
    int64 SegmentID = 1;
    int64 NumRows = 2;
}

message ClientInfo {
    // sdk_type can be `python`, `golang`, `nodejs` and etc. It's not proper to make `sdk_type` an
    // enumerate type, since we cannot always update the enum value everytime when newly sdk is supported.
    string sdk_type = 1;
    string sdk_version = 2;
    string local_time = 3;
    string user = 4;
    string host = 5;
    // reserved for newly-added feature if necessary.
    map<string, string> reserved = 6;
}

message Metrics {
    int64 request_count = 1;
    int64 success_count = 2;
    int64 error_count = 3;
    double avg_latency_ms = 4;
    double p99_latency_ms = 5;
    double max_latency_ms = 6;
}

message OperationMetrics {
    string operation = 1;
    Metrics global = 2;
    map<string, Metrics> collection_metrics = 3;
}

message ClientCommand {
    string command_id = 1;
    string command_type = 2;
    bytes payload = 3;
    int64 create_time = 4;
    bool persistent = 5;
    string target_scope = 6;
}

message CommandReply {
    string command_id = 1;
    bool success = 2;
    string error_message = 3;
    bytes payload = 4;
}

message ServerInfo {
    string build_tags = 1;
    string build_time = 2;
    string git_commit = 3;
    string go_version = 4;
    string deploy_mode = 5;
    // reserved for newly-added feature if necessary.
    map<string, string> reserved = 6;
}

// NodeInfo is used to describe the node information.
message NodeInfo {
    int64 node_id = 1;
    string address = 2;
    string hostname = 3;
}

enum LoadPriority {
    HIGH = 0;
    LOW = 1;
}

enum WALName {
  Unknown = 0;
  RocksMQ = 1;
  Pulsar = 2;
  Kafka = 3;
  WoodPecker = 4;
  Test = 999;
}

// ReplicateConfiguration is the configuration that
// describes the replication topology cross multiple cluster milvus.
message ReplicateConfiguration {
  repeated MilvusCluster clusters                      = 1;
  repeated CrossClusterTopology cross_cluster_topology = 2;
}

// ConnectionParam defines the params to connect to the Milvus cluster.
message ConnectionParam {
  string uri   = 1;
  string token = 2;
}

// MilvusCluster describes the Milvus cluster information, 
// including pchannel mapping details.
message MilvusCluster {
  string cluster_id                = 1;
  ConnectionParam connection_param = 2;
  repeated string pchannels        = 3;
}

// CrossClusterTopology is the topology that 
// describes the topology cross multiple cluster milvus.
message CrossClusterTopology {
  string source_cluster_id = 1;
  string target_cluster_id = 2;
}

message MessageID {
  string id               = 1;
  common.WALName WAL_name = 2;
}

// ImmutableMessage is the message that can not be modified anymore.
message ImmutableMessage {
  MessageID id                   = 1; // message id
  bytes payload                  = 2; // message body
  map<string, string> properties = 3; // message properties
}

// ReplicateCheckpoint is the WAL replicate checkpoint of source cluster.
// It will be persisted in the target cluster metadata.
// When a replication started, we will get the replicate checkpoint from target cluster metadata.
// And use it to continue the replication at source cluster.
message ReplicateCheckpoint {
  string cluster_id = 1; // the cluster id of source cluster
  string pchannel = 2;   // the pchannel of source cluster
  common.MessageID message_id = 3; // the last confirmed message id of the last replicated message
  uint64 time_tick = 4; // the time tick of the last replicated message
}

message HighlightData {
  repeated string fragments = 1;
  repeated float scores = 2;
}

message HighlightResult {        
  string field_name = 1;
  repeated HighlightData datas = 2;
}

enum HighlightType {
    Lexical = 0;
    Semantic = 1;
}

message Highlighter {
    HighlightType type = 1;
    repeated KeyValuePair params = 2;
}

message MetricAggSpec {
    string op = 1;          // "avg" | "sum" | "count" | "min" | "max"
    string field_name = 2;  // field name | "_score" | "*" (count(*))
}

message SortSpec {
    string field_name = 1;  // field name (JSON path expression OK) | "_score"
    string direction = 2;   // "asc" | "desc"
    bool null_first = 3;
}

message TopHitsSpec {
    int64 size = 1;
    repeated SortSpec sort = 2;
}

message OrderSpec {
    string key = 1;         // metric alias | "_count" | "_key"
    string direction = 2;   // "asc" | "desc"
    bool null_first = 3;
}

message SearchAggregationSpec {
    repeated string fields = 1;                        // field names, JSON path expression OK
    int64 size = 2;                                    // max buckets returned at this level
    map<string, MetricAggSpec> metrics = 3;            // alias -> MetricAggSpec
    repeated OrderSpec order = 4;                      // index 0 = highest priority
    TopHitsSpec top_hits = 5;                          // nil = pure aggregation level
    SearchAggregationSpec sub_aggregation = 6;         // recursive nesting
    int64 search_size = 7;                             // candidate buckets searched at this level; 0 means size
}

// IDRange is a half-open range of int64 ids [begin, end).
message IDRange {
  int64 begin = 1;
  int64 end = 2;
}
