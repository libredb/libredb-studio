syntax = "proto3";
package milvus.proto.msg;
option go_package = "github.com/milvus-io/milvus-proto/go-api/v3/msgpb";

import "common.proto";
import "schema.proto";

enum InsertDataVersion {
  // 0 must refer to row-based format, since it's the first version in Milvus.
  RowBased = 0;
  ColumnBased = 1;
}

message InsertRequest {
  common.MsgBase base = 1;
  string shardName = 2;
  string db_name = 3;
  string collection_name = 4;
  string partition_name = 5;
  int64 dbID = 6;
  int64 collectionID = 7;
  int64 partitionID = 8;
  int64 segmentID = 9;
  repeated uint64 timestamps = 10;
  repeated int64 rowIDs = 11;
  // row_data was reserved for compatibility
  repeated common.Blob row_data = 12;
  repeated schema.FieldData fields_data = 13;
  uint64 num_rows = 14;
  InsertDataVersion version = 15;
  optional string namespace = 16;
}

message DeleteRequest {
  common.MsgBase base = 1;
  string shardName = 2;
  string db_name = 3;
  string collection_name = 4;
  string partition_name = 5;
  int64 dbID = 6;
  int64 collectionID = 7;
  int64 partitionID = 8;
  repeated int64 int64_primary_keys = 9; // deprecated
  repeated uint64 timestamps = 10;
  int64 num_rows = 11;
  schema.IDs primary_keys = 12;
  int64 segment_id = 13;

  // Serialized predicate plan for non-simple delete expressions. When this field
  // is set, timestamps[0] is the delete timestamp and partitionID is the delete scope.
  bytes serialized_expr_plan = 14;
}

message MsgPosition {
  string channel_name = 1;
  bytes msgID = 2;
  string msgGroup = 3;
  uint64 timestamp = 4;
  common.WALName WAL_name = 5;
}

message CreateCollectionRequest {
  common.MsgBase base = 1;
  string db_name = 2;
  string collectionName = 3;
  string partitionName = 4;
  // `schema` is the serialized `schema.CollectionSchema`
  int64 dbID = 5;
  int64 collectionID = 6;
  int64 partitionID = 7 [deprecated = true];
  bytes schema = 8 [deprecated = true]; // legacy representation, will be set if collection_schema is not set.
  repeated string virtualChannelNames = 9;
  repeated string physicalChannelNames = 10;
  repeated int64 partitionIDs = 11;
  repeated string partitionNames = 12;
  schema.CollectionSchema collection_schema = 13;
}

message DropCollectionRequest {
  common.MsgBase base = 1;
  string db_name = 2;
  string collectionName = 3;
  int64 dbID = 4;
  int64 collectionID = 5;
}

message CreatePartitionRequest {
  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  string partition_name = 4;
  int64 dbID = 5;
  int64 collectionID = 6;
  int64 partitionID = 7;
}

message DropPartitionRequest {
  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  string partition_name = 4;
  int64 dbID = 5;
  int64 collectionID = 6;
  int64 partitionID = 7;
}

message TimeTickMsg {
  common.MsgBase base = 1;
}

message DataNodeTtMsg {
  common.MsgBase base =1;
  string channel_name = 2;
  uint64 timestamp = 3;
  repeated common.SegmentStats segments_stats = 4;
}

message ReplicateMsg {
  option deprecated = true;
  common.MsgBase base = 1;
  bool is_end = 2;
  bool is_cluster = 3;
  string database = 4;
  string collection = 5;
}

message ImportFile {
  int64 id = 1;
  // A singular row-based file or multiple column-based files.
  repeated string paths = 2;
  // Pre-allocated autoID range for this file's rows; the i-th row takes begin+i.
  // Only meaningful when the primary key has autoID enabled; for a VarChar
  // primary key the id is materialized as its decimal string form.
  // end - begin is an upper bound on the file's row count, not necessarily equal.
  // Unset means the ids are allocated during the import.
  common.IDRange pre_allocated_auto_ids = 3;
}
message ImportMsg {
  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  int64 collectionID = 4;
  repeated int64 partitionIDs = 5;
  map<string, string> options = 6;
  repeated ImportFile files = 7;
  schema.CollectionSchema schema = 8;
  int64 jobID = 9;
}
