syntax = "proto3";
package milvus.proto.milvus;

option go_package = "github.com/milvus-io/milvus-proto/go-api/v3/milvuspb";

option java_multiple_files = true;
option java_package = "io.milvus.grpc";
option java_outer_classname = "MilvusProto";
option java_generate_equals_and_hash = true;

option csharp_namespace = "Milvus.Client.Grpc";

import "common.proto";
import "rg.proto";
import "schema.proto";
import "feder.proto";
import "msg.proto";
import "google/protobuf/descriptor.proto";

service MilvusService {
  rpc CreateCollection(CreateCollectionRequest) returns (common.Status) {}
  rpc DropCollection(DropCollectionRequest) returns (common.Status) {}
  rpc HasCollection(HasCollectionRequest) returns (BoolResponse) {}
  rpc LoadCollection(LoadCollectionRequest) returns (common.Status) {}
  rpc ReleaseCollection(ReleaseCollectionRequest) returns (common.Status) {}
  rpc DescribeCollection(DescribeCollectionRequest) returns (DescribeCollectionResponse) {}
  rpc BatchDescribeCollection(BatchDescribeCollectionRequest) returns (BatchDescribeCollectionResponse) {}
  rpc GetCollectionStatistics(GetCollectionStatisticsRequest) returns (GetCollectionStatisticsResponse) {}
  rpc ShowCollections(ShowCollectionsRequest) returns (ShowCollectionsResponse) {}
  rpc AlterCollection(AlterCollectionRequest) returns (common.Status) {}
  rpc AlterCollectionField(AlterCollectionFieldRequest) returns (common.Status) {}
  rpc AddCollectionFunction(AddCollectionFunctionRequest) returns (common.Status) {}
  rpc AlterCollectionFunction(AlterCollectionFunctionRequest) returns (common.Status) {}
  rpc DropCollectionFunction(DropCollectionFunctionRequest) returns (common.Status) {}
  rpc TruncateCollection(TruncateCollectionRequest) returns (TruncateCollectionResponse) {}

  rpc CreatePartition(CreatePartitionRequest) returns (common.Status) {}
  rpc DropPartition(DropPartitionRequest) returns (common.Status) {}
  rpc HasPartition(HasPartitionRequest) returns (BoolResponse) {}
  rpc LoadPartitions(LoadPartitionsRequest) returns (common.Status) {}
  rpc Prewarm(PrewarmRequest) returns (PrewarmResponse) {}
  rpc DescribePrewarmTask(DescribePrewarmTaskRequest) returns (DescribePrewarmTaskResponse) {}
  rpc ReleasePartitions(ReleasePartitionsRequest) returns (common.Status) {}
  rpc GetPartitionStatistics(GetPartitionStatisticsRequest) returns (GetPartitionStatisticsResponse) {}
  rpc ShowPartitions(ShowPartitionsRequest) returns (ShowPartitionsResponse) {}

  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse) {}
  rpc DescribeNamespace(DescribeNamespaceRequest) returns (DescribeNamespaceResponse) {}
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse) {}
  rpc DropNamespace(DropNamespaceRequest) returns (DropNamespaceResponse) {}
  rpc HasNamespace(HasNamespaceRequest) returns (HasNamespaceResponse) {}
  rpc GetNamespaceStats(GetNamespaceStatsRequest) returns (GetNamespaceStatsResponse) {}

  rpc GetLoadingProgress(GetLoadingProgressRequest) returns (GetLoadingProgressResponse) {}
  rpc GetLoadState(GetLoadStateRequest) returns (GetLoadStateResponse) {}

  rpc CreateAlias(CreateAliasRequest) returns (common.Status) {}
  rpc DropAlias(DropAliasRequest) returns (common.Status) {}
  rpc AlterAlias(AlterAliasRequest) returns (common.Status) {}
  rpc DescribeAlias(DescribeAliasRequest) returns (DescribeAliasResponse) {}
  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse) {}

  rpc CreateIndex(CreateIndexRequest) returns (common.Status) {}
  rpc AlterIndex(AlterIndexRequest) returns (common.Status) {}
  rpc DescribeIndex(DescribeIndexRequest) returns (DescribeIndexResponse) {}
  rpc GetIndexStatistics(GetIndexStatisticsRequest) returns (GetIndexStatisticsResponse) {}
  // Deprecated: use DescribeIndex instead
  rpc GetIndexState(GetIndexStateRequest) returns (GetIndexStateResponse) {
      option deprecated = true;
  }
  // Deprecated: use DescribeIndex instead
  rpc GetIndexBuildProgress(GetIndexBuildProgressRequest) returns (GetIndexBuildProgressResponse) {
      option deprecated = true;
  }
  rpc DropIndex(DropIndexRequest) returns (common.Status) {}

  rpc Insert(InsertRequest) returns (MutationResult) {}
  rpc Delete(DeleteRequest) returns (MutationResult) {}
  rpc Upsert(UpsertRequest) returns (MutationResult) {}
  rpc Search(SearchRequest) returns (SearchResults) {}
  rpc HybridSearch(HybridSearchRequest) returns (SearchResults) {}
  rpc Flush(FlushRequest) returns (FlushResponse) {}
  rpc Query(QueryRequest) returns (QueryResults) {}
  rpc CalcDistance(CalcDistanceRequest) returns (CalcDistanceResults) {}
  rpc FlushAll(FlushAllRequest) returns (FlushAllResponse) {}

  rpc AddCollectionField(AddCollectionFieldRequest) returns (common.Status) {}
  rpc AddCollectionStructField(AddCollectionStructFieldRequest) returns (common.Status) {}

  rpc GetFlushState(GetFlushStateRequest) returns (GetFlushStateResponse) {}
  rpc GetFlushAllState(GetFlushAllStateRequest) returns (GetFlushAllStateResponse) {}
  rpc GetPersistentSegmentInfo(GetPersistentSegmentInfoRequest) returns (GetPersistentSegmentInfoResponse) {}
  rpc GetQuerySegmentInfo(GetQuerySegmentInfoRequest) returns (GetQuerySegmentInfoResponse) {}
  rpc GetReplicas(GetReplicasRequest) returns (GetReplicasResponse) {}

  rpc Dummy(DummyRequest) returns (DummyResponse) {}

  // TODO: remove
  rpc RegisterLink(RegisterLinkRequest) returns (RegisterLinkResponse) {}

  // https://wiki.lfaidata.foundation/display/MIL/MEP+8+--+Add+metrics+for+proxy
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {}
  rpc GetComponentStates(GetComponentStatesRequest) returns (ComponentStates) {}

  rpc LoadBalance(LoadBalanceRequest) returns (common.Status) {}
  rpc GetCompactionState(GetCompactionStateRequest) returns (GetCompactionStateResponse) {}
  rpc ManualCompaction(ManualCompactionRequest) returns (ManualCompactionResponse) {}
  rpc GetCompactionStateWithPlans(GetCompactionPlansRequest) returns (GetCompactionPlansResponse) {}

  // https://wiki.lfaidata.foundation/display/MIL/MEP+24+--+Support+bulk+load
  rpc Import(ImportRequest) returns (ImportResponse) {}
  rpc GetImportState(GetImportStateRequest) returns (GetImportStateResponse) {}
  rpc ListImportTasks(ListImportTasksRequest) returns (ListImportTasksResponse) {}

  // https://wiki.lfaidata.foundation/display/MIL/MEP+27+--+Support+Basic+Authentication
  rpc CreateCredential(CreateCredentialRequest) returns (common.Status) {}
  rpc UpdateCredential(UpdateCredentialRequest) returns (common.Status) {}
  rpc DeleteCredential(DeleteCredentialRequest) returns (common.Status) {}
  rpc ListCredUsers(ListCredUsersRequest) returns (ListCredUsersResponse) {}

  // https://wiki.lfaidata.foundation/display/MIL/MEP+29+--+Support+Role-Based+Access+Control
  rpc CreateRole(CreateRoleRequest) returns (common.Status) {}
  rpc AlterRole(AlterRoleRequest) returns (common.Status) {}
  rpc DropRole(DropRoleRequest) returns (common.Status) {}
  rpc OperateUserRole(OperateUserRoleRequest) returns (common.Status) {}
  rpc SelectRole(SelectRoleRequest) returns (SelectRoleResponse) {}
  rpc SelectUser(SelectUserRequest) returns (SelectUserResponse) {}
  rpc OperatePrivilege(OperatePrivilegeRequest) returns (common.Status) {}
  rpc OperatePrivilegeV2(OperatePrivilegeV2Request) returns (common.Status) {}
  rpc SelectGrant(SelectGrantRequest) returns (SelectGrantResponse) {}

  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {}
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse) {}

  rpc CreateResourceGroup(CreateResourceGroupRequest) returns (common.Status) {}
  rpc DropResourceGroup(DropResourceGroupRequest) returns (common.Status) {}
  rpc UpdateResourceGroups(UpdateResourceGroupsRequest) returns (common.Status) {}
  rpc TransferNode(TransferNodeRequest) returns (common.Status) {}
  rpc TransferReplica(TransferReplicaRequest) returns (common.Status) {}
  rpc ListResourceGroups(ListResourceGroupsRequest) returns (ListResourceGroupsResponse) {}
  rpc DescribeResourceGroup(DescribeResourceGroupRequest) returns (DescribeResourceGroupResponse) {}

  rpc RenameCollection(RenameCollectionRequest) returns (common.Status) {}

  rpc ListIndexedSegment(feder.ListIndexedSegmentRequest) returns(feder.ListIndexedSegmentResponse) {}
  rpc DescribeSegmentIndexData(feder.DescribeSegmentIndexDataRequest) returns(feder.DescribeSegmentIndexDataResponse) {}

  rpc Connect(ConnectRequest) returns (ConnectResponse) {}

  rpc AllocTimestamp(AllocTimestampRequest) returns (AllocTimestampResponse) {}

  rpc CreateDatabase(CreateDatabaseRequest) returns (common.Status) {}
  rpc DropDatabase(DropDatabaseRequest) returns (common.Status) {}
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse) {}
  rpc AlterDatabase(AlterDatabaseRequest) returns (common.Status) {}
  rpc DescribeDatabase(DescribeDatabaseRequest) returns (DescribeDatabaseResponse) {}

  // Deprecated CDC API
  rpc ReplicateMessage(ReplicateMessageRequest) returns (ReplicateMessageResponse) {
    option deprecated = true;
  }

  rpc BackupRBAC(BackupRBACMetaRequest) returns (BackupRBACMetaResponse){}
  rpc RestoreRBAC(RestoreRBACMetaRequest) returns (common.Status){}

  rpc CreatePrivilegeGroup(CreatePrivilegeGroupRequest) returns (common.Status) {}
  rpc DropPrivilegeGroup(DropPrivilegeGroupRequest) returns (common.Status) {}
  rpc ListPrivilegeGroups(ListPrivilegeGroupsRequest) returns (ListPrivilegeGroupsResponse) {}
  rpc OperatePrivilegeGroup(OperatePrivilegeGroupRequest) returns (common.Status) {}

  rpc RunAnalyzer(RunAnalyzerRequest) returns (RunAnalyzerResponse) {}
  rpc AddFileResource(AddFileResourceRequest) returns (common.Status) {}
  rpc RemoveFileResource(RemoveFileResourceRequest) returns (common.Status) {}
  rpc ListFileResources(ListFileResourcesRequest) returns (ListFileResourcesResponse) {}

  // Row Level Security (RLS) APIs
  rpc AddUserTags(AddUserTagsRequest) returns (common.Status) {}
  rpc DeleteUserTags(DeleteUserTagsRequest) returns (common.Status) {}
  rpc GetUserTags(GetUserTagsRequest) returns (GetUserTagsResponse) {}
  rpc ListUsersWithTag(ListUsersWithTagRequest) returns (ListUsersWithTagResponse) {}

  rpc CreateRowPolicy(CreateRowPolicyRequest) returns (common.Status) {}
  rpc DropRowPolicy(DropRowPolicyRequest) returns (common.Status) {}
  rpc ListRowPolicies(ListRowPoliciesRequest) returns (ListRowPoliciesResponse) {}

  // CDC v2 APIs
  // UpdateReplicateConfiguration applies a full replacement of the current
  // replication configuration across Milvus clusters.
  //
  // Semantics:
  //   - The provided ReplicateConfiguration completely replaces any existing
  //     configuration persisted in the metadata store.
  //   - Passing an empty ReplicateConfiguration is treated as a "clear"
  //     operation, effectively removing all replication configuration.
  //   - The RPC is expected to be idempotent: submitting the same configuration
  //     multiple times must not cause side effects.
  rpc UpdateReplicateConfiguration(UpdateReplicateConfigurationRequest) returns (common.Status){}
  //
  // GetReplicateConfiguration retrieves the current cross-cluster replication topology.
  // Sensitive fields (like connection tokens) are redacted in the response.
  rpc GetReplicateConfiguration(GetReplicateConfigurationRequest) returns (GetReplicateConfigurationResponse){}
  //
  // GetReplicateInfo retrieves replication-related metadata of specified channel from a target Milvus cluster.
  rpc GetReplicateInfo(GetReplicateInfoRequest) returns (GetReplicateInfoResponse){}
  //
  // CreateReplicateStream establishes a replication stream on the target Milvus cluster.
  //
  // Semantics:
  //   - Sets up a continuous data stream that receives replicated messages
  //     (DDL, insert, delete, etc.) from the source cluster via CDC.
  //   - Once established, the target cluster persists incoming messages into
  //     its WAL (Write-Ahead Log) ensuring durability and consistency.
  rpc CreateReplicateStream(stream ReplicateRequest) returns (stream ReplicateResponse){}
  //
  // DumpMessages streams messages from a WAL range for data salvage.
  //
  // Semantics:
  //   - Reads messages starting from start_message_id position (inclusive).
  //   - Use start_timetick/end_timetick to filter messages by timetick range.
  //   - Only returns non-system messages (filters out TimeTick, CreateSegment, Flush, RollbackTxn).
  //   - Streams messages until end_timetick is reached or context is cancelled.
  //   - Typically used after force failover to recover unsynchronized messages
  //     from the old primary cluster using the salvage checkpoint.
  rpc DumpMessages(DumpMessagesRequest) returns (stream DumpMessagesResponse){}

  rpc ComputePhraseMatchSlop(ComputePhraseMatchSlopRequest) returns (ComputePhraseMatchSlopResponse) {}
  
  // snapshot related
  rpc CreateSnapshot(CreateSnapshotRequest) returns (common.Status) {}
  rpc DropSnapshot(DropSnapshotRequest) returns (common.Status) {}
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {}
  rpc DescribeSnapshot(DescribeSnapshotRequest) returns (DescribeSnapshotResponse) {}
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {}
  rpc RestoreExternalSnapshot(RestoreExternalSnapshotRequest) returns (RestoreExternalSnapshotResponse) {}
  rpc ExportSnapshot(ExportSnapshotRequest) returns (ExportSnapshotResponse) {}
  rpc GetExportSnapshotState(GetExportSnapshotStateRequest) returns (GetExportSnapshotStateResponse) {}
  rpc GetRestoreSnapshotState(GetRestoreSnapshotStateRequest) returns (GetRestoreSnapshotStateResponse) {}
  rpc ListRestoreSnapshotJobs(ListRestoreSnapshotJobsRequest) returns (ListRestoreSnapshotJobsResponse) {}
  rpc PinSnapshotData(PinSnapshotDataRequest) returns (PinSnapshotDataResponse) {}
  rpc UnpinSnapshotData(UnpinSnapshotDataRequest) returns (common.Status) {}
  rpc AlterCollectionSchema(AlterCollectionSchemaRequest) returns (AlterCollectionSchemaResponse) {}
  rpc BatchUpdateManifest(BatchUpdateManifestRequest) returns (common.Status) {}

  // External Collection APIs
  rpc RefreshExternalCollection(RefreshExternalCollectionRequest) returns (RefreshExternalCollectionResponse) {}
  rpc GetRefreshExternalCollectionProgress(GetRefreshExternalCollectionProgressRequest) returns (GetRefreshExternalCollectionProgressResponse) {}
  rpc ListRefreshExternalCollectionJobs(ListRefreshExternalCollectionJobsRequest) returns (ListRefreshExternalCollectionJobsResponse) {}
}

// Client Telemetry Service
service ClientTelemetryService {
  rpc ClientHeartbeat(ClientHeartbeatRequest) returns (ClientHeartbeatResponse) {}
  rpc GetClientTelemetry(GetClientTelemetryRequest) returns (GetClientTelemetryResponse) {}
  rpc PushClientCommand(PushClientCommandRequest) returns (PushClientCommandResponse) {}
  rpc DeleteClientCommand(DeleteClientCommandRequest) returns (DeleteClientCommandResponse) {}
}

message CreateAliasRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeCreateAlias
    object_name_index: -1
  };

  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  string alias = 4;
}

message DropAliasRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeDropAlias
    object_name_index: -1
  };

  common.MsgBase base = 1;
  string db_name = 2;
  string alias = 3;
}

message AlterAliasRequest{
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeCreateAlias
    object_name_index: -1
  };

  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  string alias = 4;
}

message DescribeAliasRequest{
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeDescribeAlias
    object_name_index: -1
  };

  common.MsgBase base = 1;
  string db_name = 2;
  string alias = 3;
}

/*
* Describe alias response
*/
message DescribeAliasResponse {
  // Response status
  common.Status status = 1;
  string db_name = 2;
  string alias = 3;
  string collection = 4;
}

message ListAliasesRequest{
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeListAliases
    object_name_index: -1
  };

  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
}

/*
* List aliases response
*/
message ListAliasesResponse {
  // Response status
  common.Status status = 1;
  string db_name = 2;
  string collection_name = 3;
  repeated string aliases = 4;
}

/**
* Create collection in milvus
*/
message CreateCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeCreateCollection
    object_name_index: -1
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The unique collection name in milvus.(Required)
  string collection_name = 3;
  // The serialized `schema.CollectionSchema`(Required)
  bytes schema = 4;
  // Once set, no modification is allowed (Optional)
  // https://github.com/milvus-io/milvus/issues/6690
  int32 shards_num = 5;
  // The consistency level that the collection used, modification is not supported now.
  common.ConsistencyLevel consistency_level = 6;
  repeated common.KeyValuePair properties = 7;
  int64 num_partitions = 8; // num of default physical partitions, only used in partition key mode and changes are not supported
}

/**
* Drop collection in milvus, also will drop data in collection.
*/
message DropCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeDropCollection
    object_name_index: -1
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The unique collection name in milvus.(Required)
  string collection_name = 3;
}

/**
* Alter collection in milvus
*/
message AlterCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeCreateCollection
    object_name_index: -1
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The unique collection name in milvus.(Required)
  string collection_name = 3;
  int64  collectionID = 4;
  repeated common.KeyValuePair properties = 5;
  repeated string delete_keys = 6;
}

message AlterCollectionFieldRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeCreateCollection
    object_name_index: -1
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The unique collection name in milvus.(Required)
  string collection_name = 3;
  string field_name =4;
  repeated common.KeyValuePair properties = 5;
  repeated string delete_keys = 6;
}

/**
* Check collection exist in milvus or not.
*/
message HasCollectionRequest {
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want to check.
  string collection_name = 3;
  // If time_stamp is not zero, will return true when time_stamp >= created collection timestamp, otherwise will return false.
  uint64 time_stamp = 4;
}


message BoolResponse {
  common.Status status = 1;
  bool value = 2;
}

message StringResponse {
  common.Status status = 1;
  string value = 2;
}

/**
* Get collection meta datas like: schema, collectionID, shards number ...
*/
message DescribeCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeDescribeCollection
    object_name_index: -1
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want to describe, you can pass collection_name or collectionID
  string collection_name = 3;
  // The collection ID you want to describe
  int64 collectionID = 4;
  // If time_stamp is not zero, will describe collection success when time_stamp >= created collection timestamp, otherwise will throw error.
  uint64 time_stamp = 5;
}

/**
* DescribeCollection Response
*/
message DescribeCollectionResponse {
  // Contain error_code and reason
  common.Status status = 1;
  // The schema param when you created collection.
  schema.CollectionSchema schema = 2;
  // The collection id
  int64 collectionID = 3;
  // System design related, users should not perceive
  repeated string virtual_channel_names = 4;
  // System design related, users should not perceive
  repeated string physical_channel_names = 5;
  // Hybrid timestamp in milvus
  uint64 created_timestamp = 6;
  // The utc timestamp calculated by created_timestamp
  uint64 created_utc_timestamp = 7;
  // The shards number you set.
  int32 shards_num = 8;
  // The aliases of this collection
  repeated string aliases = 9;
  // The message ID/posititon when collection is created
  repeated common.KeyDataPair start_positions = 10;
  // The consistency level that the collection used, modification is not supported now.
  common.ConsistencyLevel consistency_level = 11;
  // The collection name
  string collection_name = 12;
  repeated common.KeyValuePair properties = 13;
  string db_name = 14;
  int64 num_partitions = 15;
  int64 db_id =16;
  uint64 request_time = 17;
  uint64 update_timestamp = 18;
  string update_timestamp_str = 19;
}


message BatchDescribeCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeDescribeCollection
    object_name_index: -1
  };
  string db_name = 1;
  // The collection name you want to describe, you can pass collection_name or collectionID
  repeated string collection_name = 2;
  // The collection ID you want to describe
  repeated int64 collectionID = 3;
}

message BatchDescribeCollectionResponse {
  // Contain error_code and reason
  common.Status status = 1;
  repeated DescribeCollectionResponse responses = 2;
}


/**
* Load collection data into query nodes, then you can do vector search on this collection.
*/
message LoadCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeLoad
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want to load
  string collection_name = 3;
  // The replica number to load, default by 1
  int32 replica_number = 4;
  // create replica used resource group
  repeated string resource_groups = 5;
  // Whether to enable refresh mode.
  bool refresh = 6;
  // Field Partial Load fields list
  repeated string load_fields = 7;
  // Field Partial load skip load dynamic fields 
  bool skip_load_dynamic_field = 8;
  // Additional parameters for load
  map<string, string> load_params = 9;
}

/**
* Release collection data from query nodes, then you can't do vector search on this collection.
*/
message ReleaseCollectionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeRelease
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want to release
  string collection_name = 3;
}

/**
* Get statistics like row_count.
* WARNING: This API is experimental and not useful for now.
*/
message GetStatisticsRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeGetStatistics
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want get statistics
  string collection_name = 3;
  // The partition names you want get statistics, empty for all partitions
  repeated string partition_names = 4;
  // Not useful for now, reserved for future
  uint64 guarantee_timestamp = 5;
}

/**
* Will return statistics in stats field like [{key:"row_count",value:"1"}]
* WARNING: This API is experimental and not useful for now.
*/
message GetStatisticsResponse {
  // Contain error_code and reason
  common.Status status = 1;
  // Collection statistics data
  repeated common.KeyValuePair stats = 2;
}

/**
* Get collection statistics like row_count.
*/
message GetCollectionStatisticsRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeGetStatistics
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name you want get statistics
  string collection_name = 3;
}

/**
* Will return collection statistics in stats field like [{key:"row_count",value:"1"}]
*/
message GetCollectionStatisticsResponse {
  // Contain error_code and reason
  common.Status status = 1;
  // Collection statistics data
  repeated common.KeyValuePair stats = 2;
}

/*
* This is for ShowCollectionsRequest type field.
*/
// Deprecated: use GetLoadingProgress rpc instead
enum ShowType {
  option deprecated = true;
  // Will return all collections
  All = 0;
  // Will return loaded collections with their inMemory_percentages
  InMemory = 1;
}

/*
* List collections
*/
message ShowCollectionsRequest {
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // Not useful for now
  uint64 time_stamp = 3;
  // Decide return Loaded collections or All collections(Optional)
  ShowType type = 4;
  // When type is InMemory, will return these collection's inMemory_percentages.(Optional)
  // Deprecated: use GetLoadingProgress rpc instead
  repeated string collection_names = 5 [deprecated=true];
}

/*
* Return basic collection infos.
*/
message ShowCollectionsResponse {
  // Contain error_code and reason
  common.Status status = 1;
  // Collection name array
  repeated string collection_names = 2;
  // Collection Id array
  repeated int64 collection_ids = 3;
  // Hybrid timestamps in milvus
  repeated uint64 created_timestamps = 4;
  // The utc timestamp calculated by created_timestamp
  repeated uint64 created_utc_timestamps = 5;
  // Load percentage on querynode when type is InMemory
  // Deprecated: use GetLoadingProgress rpc instead
  repeated int64 inMemory_percentages = 6 [deprecated=true];
  // Indicate whether query service is available
  repeated bool query_service_available = 7;
  repeated int32 shards_num = 8;
}

/*
* Create partition in created collection.
*/
message CreatePartitionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeCreatePartition
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name in milvus
  string collection_name = 3;
  // The partition name you want to create.
  string partition_name = 4;
}

/*
* Drop partition in created collection.
*/
message DropPartitionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeDropPartition
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name in milvus
  string collection_name = 3;
  // The partition name you want to drop
  string partition_name = 4;
}

/*
* Check if partition exist in collection or not.
*/
message HasPartitionRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeHasPartition
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name in milvus
  string collection_name = 3;
  // The partition name you want to check
  string partition_name = 4;
}

/*
* Load specific partitions data of one collection into query nodes
* Then you can get these data as result when you do vector search on this collection.
*/
message LoadPartitionsRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeLoad
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name in milvus
  string collection_name = 3;
  // The partition names you want to load
  repeated string partition_names = 4;
  // The replicas number you would load, 1 by default
  int32 replica_number = 5;
  // create replica used resource group
  repeated string resource_groups = 6;
  // Whether to enable refresh mode.
  bool refresh = 7;
  // Field Partial Load fields list
  repeated string load_fields = 8;
  // Field Partial load skip load dynamic fields 
  bool skip_load_dynamic_field = 9;
  // Additional parameters for load
  map<string, string> load_params = 10;
}

/*
* Prewarm namespace partition data into query node memory/cache.
*/
message PrewarmRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeLoad
    object_name_index: 3
  };
  // Not useful for now
  common.MsgBase base = 1;
  string db_name = 2;
  // The collection name in milvus
  string collection_name = 3;
  // The namespace you want to prewarm. Only namespace.mode=partition is supported.
  optional string namespace = 4;
  // The replicas number you would load if the namespace partition is not loaded, 1 by default.
  int32 replica_number = 5;
  // create replica used resource group if the namespace partition is not loaded
  repeated string resource_groups = 6;
  // Field Partial Load fields list if the namespace partition is not loaded
  repeated string load_fields = 7;
  // Field Partial load skip load dynamic fields if the namespace partition is not loaded
  bool skip_load_dynamic_field = 8;
  // Additional parameters for load
  map<string, string> load_params = 9;
  // Expected warm retention duration. Reserved for future support.
  int64 ttl_seconds = 10;
  // Prewarm priority. Currently supports "low"; other values use default priority.
  string priority = 11;
}

enum PrewarmTaskState {
  PrewarmTaskStateUnknown = 0;
  PrewarmTaskStatePending = 1;
  PrewarmTaskStateWarming = 2;
  PrewarmTaskStateCompleted = 3;
  PrewarmTaskStateFailed = 4;
}

message PrewarmResponse {
  common.Status status = 1;
  string taskID = 2;
  optional string namespace = 3;
}

message DescribePrewarmTaskRequest {
  // Not useful for now
  common.MsgBase base = 1;
  string taskID = 2;
}

message DescribePrewarmTaskResponse {
  common.Status status = 1;
  string taskID = 2;
  PrewarmTaskState state = 3;
  int32 progress = 4;
  string error_message = 5;
}

/*
* Release specific partitions data of one collection from query nodes.
