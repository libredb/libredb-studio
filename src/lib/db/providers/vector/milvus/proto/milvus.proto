message UpsertRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeUpsert
    object_name_index: 3
  };
  common.MsgBase base = 1;
  string db_name = 2;
  string collection_name = 3;
  string partition_name = 4;
  repeated schema.FieldData fields_data = 5;
  repeated uint32 hash_keys = 6;
  uint32 num_rows = 7;
  uint64 schema_timestamp = 8;
  bool partial_update = 9;
  optional string namespace = 10;
  // field_ops carries per-field FieldPartialUpdateOp directives describing
  // how each FieldData should be merged during a partial upsert. Ops are
  // matched to fields_data entries by field_name. A non-REPLACE op implies
  // partial_update=true regardless of the partial_update flag.
  repeated schema.FieldPartialUpdateOp field_ops = 11;
}

message MutationResult {
  common.Status status = 1;
  schema.IDs IDs = 2; // required for insert, delete, upsert
  repeated uint32 succ_index = 3; // error indexes indicate
  repeated uint32 err_index = 4; // error indexes indicate
  bool acknowledged = 5;
  int64 insert_cnt = 6;
  int64 delete_cnt = 7;
  int64 upsert_cnt = 8;
  uint64 timestamp = 9;
}

