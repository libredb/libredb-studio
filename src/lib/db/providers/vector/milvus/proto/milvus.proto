  string cluster_id           = 1;
  string cchannel             = 2;
  repeated string pchannels   = 3;
}

message FlushAllResponse {
  common.Status status                                = 1;
  uint64 flush_all_ts                                 = 2 [deprecated = true];
  repeated FlushAllResult flush_results               = 3 [deprecated = true];
  map<string, common.ImmutableMessage> flush_all_msgs = 4; // pchannel -> FlushAllMsg
  ClusterInfo cluster_info                            = 5;
}

// Deprecated
// Flush result for a single flush target
message FlushAllResult {
  // Database name containing the collections
  string db_name = 1;
  
  // List of collections that were actually processed for this target
  // If the target had empty collection_names (flush all), this shows all collections in the database
  // If the target specified collection_names, this shows only those collections
