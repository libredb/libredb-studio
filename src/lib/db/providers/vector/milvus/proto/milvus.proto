  repeated SearchRequest requests = 5;
  repeated common.KeyValuePair rank_params = 6; // must
  uint64 travel_timestamp = 7;
  uint64 guarantee_timestamp = 8; // guarantee_timestamp
  bool not_return_all_meta = 9;
  repeated string output_fields = 10;
  common.ConsistencyLevel consistency_level = 11;
  bool use_default_consistency = 12;
  // Mutually exclusive with function_chains. Milvus returns invalid argument if both are set.
  schema.FunctionScore function_score = 13;
  optional string namespace = 14;
  // Function chains for top-level hybrid fusion/rerank.
  // Mutually exclusive with function_score. Milvus returns invalid argument if both are set.
  repeated schema.FunctionChain function_chains = 15;
}

