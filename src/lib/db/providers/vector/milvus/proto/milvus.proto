  common.ReplicateCheckpoint checkpoint = 1;
  // salvage_checkpoint is captured during force promote.
  // It represents the last synced position from the old primary.
  // Data salvage tools can use this to dump unsynchronized messages from the old primary.
  common.ReplicateCheckpoint salvage_checkpoint = 2;
}

message ReplicateMessage {
  string source_cluster_id = 1; // the cluster id of source cluster
  common.ImmutableMessage message = 2; // replicate message to be sent
}

message ReplicateRequest {
  oneof request {
    ReplicateMessage replicate_message = 1;
  }
}

message ReplicateConfirmedMessageInfo {
  uint64 confirmed_time_tick = 1; // the source time tick of the last confirmed message that persisted into target WAL. 
}

message ReplicateResponse {
  oneof response {
    ReplicateConfirmedMessageInfo replicate_confirmed_message_info = 1;
  }
}

// DumpMessagesRequest is used to dump messages from a WAL range for data salvage.
//
// Usage: After force failover, use GetReplicateInfo to get the salvage_checkpoint,
// then call DumpMessages with the checkpoint's message_id and timetick to retrieve
// unsynchronized messages from the old primary cluster.
message DumpMessagesRequest {
  string pchannel = 1;                   // Physical channel name to dump from (required)
  common.MessageID start_message_id = 2; // Start position in WAL (required) - typically from salvage_checkpoint.message_id
  uint64 start_timetick = 3;             // Start timetick filter (optional) - only dump messages with timetick >= start_timetick, typically from salvage_checkpoint.time_tick
  uint64 end_timetick = 4;               // End timetick filter (optional) - only dump messages with timetick <= end_timetick, 0 means no limit (stream until cancelled)
  bool include_start_message = 5;        // If true, dump starts from start_message_id inclusively; otherwise starts after it.
}

// DumpMessagesResponse streams messages from the WAL.
// Each response contains either an error status or a message (never both).
message DumpMessagesResponse {
  oneof response {
    common.Status status = 1;              // Error status (only sent when an error occurs)
    common.ImmutableMessage message = 2;   // A dumped message (filtered to exclude system messages)
  }
}

