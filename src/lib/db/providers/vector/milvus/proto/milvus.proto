}


message SubSearchRequest {
  string dsl = 1; // must
  // serialized `PlaceholderGroup`
  bytes placeholder_group = 2; // must
  common.DslType dsl_type = 3; // must
  repeated common.KeyValuePair search_params = 4; // must
  int64 nq = 5;
  map<string, schema.TemplateValue> expr_template_values = 6;
  optional string namespace = 7;
}

message SearchRequest {
  option (common.privilege_ext_obj) = {
    object_type: Collection
    object_privilege: PrivilegeSearch
    object_name_index: 3
  };
  common.MsgBase base = 1; // must
  string db_name = 2;
  string collection_name = 3; // must
  repeated string partition_names = 4; // must
  string dsl = 5; // must
  oneof search_input {
    bytes placeholder_group = 6; // serialized `PlaceholderGroup` for vector search
    schema.IDs ids = 22; // primary keys for search by IDs
  }
  common.DslType dsl_type = 7; // must
  repeated string output_fields = 8;
  repeated common.KeyValuePair search_params = 9; // must
  uint64 travel_timestamp = 10;
  uint64 guarantee_timestamp = 11; // guarantee_timestamp
  int64  nq = 12;
  bool not_return_all_meta = 13;
  common.ConsistencyLevel consistency_level = 14;
  bool use_default_consistency = 15;
  bool search_by_primary_keys = 16 [deprecated = true]; // use search_input instead
  repeated SubSearchRequest sub_reqs = 17;
  map<string, schema.TemplateValue> expr_template_values = 18;
  // Mutually exclusive with function_chains. Milvus returns invalid argument if both are set.
  schema.FunctionScore function_score = 19;
  optional string namespace = 20;
  common.Highlighter highlighter = 21;
  common.SearchAggregationSpec search_aggregation = 23;
  // Mutually exclusive with function_score. Milvus returns invalid argument if both are set.
  repeated schema.FunctionChain function_chains = 24;
}

message Hits {
  repeated int64 IDs = 1;
  repeated bytes row_data = 2;
  repeated float scores = 3;
}

message SearchResults {
  common.Status status = 1;
