message CalcDistanceRequest {
  common.MsgBase base = 1;
  VectorsArray op_left = 2; // vectors on the left of operator
  VectorsArray op_right = 3; // vectors on the right of operator
  repeated common.KeyValuePair params = 4; // "metric":"L2"/"IP"/"HAMMIN"/"TANIMOTO"
}

message CalcDistanceResults {
  common.Status status = 1;
  // num(op_left)*num(op_right) distance values, "HAMMIN" return integer distance
  oneof array {
    schema.IntArray int_dist = 2;
    schema.FloatArray float_dist = 3;
  }
}

// Deprecated, FlushAll semantics changed to flushing the entire cluster.
// Specific collection to flush with database context
// This message allows targeting specific collections within a database for flush operations
message FlushAllTarget {
  // Database name to target for flush operation
  string db_name = 1;
  // Collection names within this database to flush
  // If empty, flush all collections in this database
  repeated string collection_names = 2;
}

message FlushAllRequest {
  option (common.privilege_ext_obj) = {
    object_type: Global
    object_privilege: PrivilegeFlushAll
    object_name_index: -1
  };
  common.MsgBase base = 1;
  
  string db_name                        = 2 [deprecated = true];
  repeated FlushAllTarget flush_targets = 3 [deprecated = true];
}

