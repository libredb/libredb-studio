// Stand-in for protoc-gen-openapiv2/options/annotations.proto, which etcd's rpc.proto imports for grpc-gateway's
// OpenAPI annotations. Only grpc-gateway's code generator reads those options and a gRPC client never does, so this
// file declares the package and nothing else. See README.md at the root of this proto directory.
syntax = "proto3";

package grpc.gateway.protoc_gen_openapiv2.options;
