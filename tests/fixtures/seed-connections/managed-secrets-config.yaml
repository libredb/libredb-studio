version: "1"

# Every credential a seed can carry, on managed connections and on an editable one.
# `ssl.clientKey` is not a resolvable field, so it is written as a literal here, the way an
# operator pastes a PEM block into a seed file.
connections:
  - id: "managed-search"
    name: "Elasticsearch (managed, API key)"
    type: elasticsearch
    host: es.internal
    port: 9200
    apiKeyId: "${MANAGED_ES_KEY_ID}"
    apiKeySecret: "${MANAGED_ES_KEY_SECRET}"
    roles: ["*"]
    managed: true

  - id: "managed-mtls"
    name: "Postgres (managed, mutual TLS)"
    type: postgres
    host: pg.internal
    port: 5432
    database: appdb
    user: "app"
    password: "${MANAGED_PG_PASSWORD}"
    ssl:
      mode: verify-full
      caCert: "CA-CERTIFICATE-PEM"
      clientCert: "CLIENT-CERTIFICATE-PEM"
      clientKey: "CANARY-MANAGED-TLS-CLIENT-KEY"
    roles: ["*"]
    managed: true

  - id: "managed-uri"
    name: "MongoDB (managed, connection string)"
    type: mongodb
    connectionString: "${MANAGED_MONGO_URI}"
    roles: ["*"]
    managed: true

  - id: "editable-search"
    name: "Elasticsearch (editable, API key)"
    type: elasticsearch
    host: es.internal
    port: 9200
    apiKeyId: "${EDITABLE_ES_KEY_ID}"
    apiKeySecret: "${EDITABLE_ES_KEY_SECRET}"
    roles: ["*"]
    managed: false
