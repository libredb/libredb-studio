version: "1"

# A seed with an agent credential: its agent execution profiles and MCP calls sign in as agentUser, never as the
# connection's own user. Every secret is a reference, the agent's password a quoted `${vault:...}` one, because YAML
# reads an unquoted `#` as the start of a comment.
connections:
  - id: "agent-postgres"
    name: "Postgres (agent credential)"
    type: postgres
    host: pg.internal
    port: 5432
    database: appdb
    user: "owner"
    password: "${AGENT_FIXTURE_OWNER_PASSWORD}"
    agentUser: "${AGENT_FIXTURE_AGENT_USER}"
    agentPassword: "${vault:secret/data/prod/agent#password}"
    roles: ["*"]
    managed: true
    mcp: true
