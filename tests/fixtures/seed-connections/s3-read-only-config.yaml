version: "1"

# The read-only seed of docs/providers/s3.md: one S3-compatible endpoint over TLS, verified against the system trust
# store, pinned to one bucket, read-only and managed, signing with a key pair read from the environment so no key is
# written in the file. S3 connections are read-only whatever readOnly says, and managed: true is written out because
# the load refuses readOnly: true on a connection that is not managed.
connections:
  - id: "s3-read-only"
    name: "S3 (read-only)"
    type: s3
    host: s3.example.internal
    port: 443
    region: "us-east-1"
    database: "reports"
    user: "${S3_ACCESS_KEY_ID}"
    password: "${S3_SECRET_ACCESS_KEY}"
    ssl: { mode: verify-full }
    roles: ["user"]
    managed: true
    readOnly: true
