sonar.projectKey=libredb_libredb-studio
sonar.organization=libredb

sonar.projectName=libredb-studio
# sonar.projectVersion is intentionally NOT hardcoded here. CI injects it from
# package.json (-Dsonar.projectVersion=<version>) so the "previous_version"
# new-code definition resets its baseline at every release. A hardcoded value
# freezes the baseline, making months of code count as "new" forever.

# The JavaScript analyzer's Node.js heap, in MB. At its default, 4288 MB on the hosted runner,
# the analysis ran out of memory (ERR_WORKER_OUT_OF_MEMORY, "The bridge server is unresponsive")
# once #1785 added the governance sources and tests, so every SonarCloud Analysis on main failed
# from 173d9679a on. The runner has 16 GB, and the scanner's JVM takes 3 GB of it.
sonar.javascript.node.maxspace=8192

# A workspace package keeps its source under packages/<name>/src/ and its tests under
# packages/<name>/tests/ (packages/README.md, "Layout"). packages is therefore both a
# source and a test directory, which SonarCloud accepts only when no file is both: the
# package tests are excluded from the sources below and included as tests here.
sonar.sources=src,packages
sonar.tests=tests,e2e,packages
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,e2e/**/*.spec.ts,packages/*/tests/**/*.test.ts,packages/*/tests/**/*.test.tsx

# Exclude only runtime/generated code, NOT test files, and the package tests that
# sonar.tests reads.
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/out/**,src/components/ui/**,packages/*/tests/**

# Duplication: test files, a workspace package's included, share intentional
# mock/setup boilerplate (provider mocks, request fixtures). That repetition is expected harness scaffolding, not
# production duplication, so exclude tests from copy-paste detection.
#
# src/lib/db/compatibility.ts is a declarative data table: nine entries with an
# identical key sequence (name, via, tier, probedVersion, caveats), so the copy-paste
# detector reads 56 of its 180 lines as duplication. Compressing it into tuples plus a
# mapper would satisfy the detector and make the file worse: each entry publishes a
# user-facing support claim that a maintainer has to be able to audit line by line
# against the probe that produced it. The repetition is the schema, not copied logic.
#
# src/lib/db/providers/vector/milvus/proto/descriptor.ts is generated by
# scripts/generate-milvus-descriptor.mjs from the vendored Milvus .proto files, one
# JSON.stringify literal of thousands of lines, and its drift test holds it to that
# output, so the detector's matches inside it are the protobuf schema repeating itself.
#
# src/lib/db/providers/keyvalue/oxia/proto/descriptor.ts is generated the same way by
# scripts/generate-oxia-descriptor.mjs from the vendored Oxia and gRPC health .proto
# files, and its drift test holds it to that output.
#
# src/lib/db/providers/sql/spark/proto/descriptor.ts is generated the same way by
# scripts/generate-spark-descriptor.mjs from the vendored Spark Connect .proto files,
# and its drift test holds it to that output.
#
# src/lib/db/providers/network/snmp/mib-objects.ts is generated by
# scripts/generate-snmp-mib-objects.ts from net-snmp's own snmptranslate output over
# the bundled MIB modules: one record per table and scalar group, the same shape repeated.
# src/lib/db/confirmation-claim-review.ts is Studio's review record of the claims a
# provider row makes that loosen the confirmation gate: 44 entries with one key sequence
# (claim, reason), so the copy-paste detector reads most of it as duplication. Each entry
# is a reviewed claim with its reason and source, audited line by line; compressing the
# entries into tuples would satisfy the detector and make the record harder to review.
# The repetition is the schema, not copied logic.
#
# src/lib/db/engine-catalog/*.generated.ts (the engine catalog, the connection tables,
# the connection flags, the connection forms, the connection strings, the execution UI
# and fence aliases, the query dialects, tab type editors and editor languages, the
# SQL text, the SQL writing, the migration DDL, the SQL generator forms and the claim
# requests) are
# generated by scripts/generate-engine-catalog.ts from the committed engine declarations,
# one frozen entry per key in one shape, and its drift guard holds each to that output, so the
# detector's matches inside them are the declarations' shape repeating itself.
sonar.cpd.exclusions=tests/**,e2e/**,packages/*/tests/**,src/lib/db/compatibility.ts,src/lib/db/providers/vector/milvus/proto/descriptor.ts,src/lib/db/providers/keyvalue/oxia/proto/descriptor.ts,src/lib/db/providers/sql/spark/proto/descriptor.ts,src/lib/db/providers/network/snmp/mib-objects.ts,src/lib/db/confirmation-claim-review.ts,src/lib/db/engine-catalog/*.generated.ts

# src/exports/index.js is a one-line CJS shim (module.exports = require("./index.ts"))
# for bundlers that cannot resolve .ts entry points. It has no testable logic; it is
# smoke-tested by tests/isolated/exports-shim.test.ts, which runs WITHOUT coverage
# because importing the shim loads the entire component chain unexercised and would
# pollute the merged lcov with load-only zero-hit records. What enforces that is
# COVERAGE_EXEMPT_FILES in tests/runner/discover.ts, which names that file (and the
# Monaco loader wiring test) as the ones the runner spawns without --coverage; its
# docblock carries the measurement.
sonar.coverage.exclusions=src/exports/index.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# S2245 (insecure pseudorandom number generator) is a false positive in
# TestDataGenerator: Math.random there only produces fake sample rows (names,
# addresses, lorem ipsum) to populate dev/test tables. No security, crypto, or
# token use, so a CSPRNG is unwarranted. Suppress the rule for that file only.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=src/components/TestDataGenerator.tsx

# S2871 wants String.localeCompare when sorting strings. In diff-engine the
# .sort() calls build internal canonical keys for index-column SETS (used for
# equality matching), not user-facing ordering. They must be deterministic and
# locale-independent, so the default code-point sort is correct here and
# localeCompare would be a bug. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e2.resourceKey=src/lib/schema-diff/diff-engine.ts

# Same rule, same reason, in the agent operation registry: registeredIds() sorts
# internal operation ids for a deterministic enumeration that tests assert by
# exact array equality. Nothing here is user-facing text, and localeCompare would
# make the order depend on the host locale, so it would be a bug rather than a
# fix. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e3.resourceKey=src/lib/db/operations/registry.ts

# Same rule, same reason, a third time, and here it is load-bearing for a SEAL
# rather than for an enumeration (#789). The .sort() in object-edit-plan-token.ts
# orders an object's own keys while building the digest an edit plan is sealed
# with, so mint and verify must agree byte for byte on every host that runs this
# code. localeCompare would tie that ordering to the host's locale and ICU
# version, so a plan minted on one host could fail to verify on another and the
# reader would be told their preview could not be verified. That is not a
# theoretical difference: the sort is pinned by a mutation test that reverses key
# order AT EVERY DEPTH. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e6.resourceKey=src/lib/api/object-edit-plan-token.ts

# S2068 (hard-coded credentials) fires on the field-classification maps in
# use-connection-payload.ts and use-connection-form.ts: they are
# Record<keyof DatabaseConnection, ...> literals, so `password: "resolution"` and
# `agentPassword: "preserved"` are a KEY named password beside a classification
# string, not a credential. The key set is fixed by `keyof`, so it cannot be
# renamed away, and the exhaustiveness is the whole point of the maps (see
# secret-fields.ts for the same technique applied to credentials). Neither
# file holds or reads a secret value. Suppress S2068 for these two files only —
# named individually rather than by a use-connection-*.ts glob, which would also
# cover the manager and adapter hooks and quietly widen the exemption.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=src/hooks/use-connection-payload.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=src/hooks/use-connection-form.ts

# S2068 also fires on src/lib/db/engine-declarations/milvus.json, the generated
# engine declaration of Milvus: its credential warning names the root pair every
# Milvus server starts with, which Milvus publishes in its own documentation and
# which Studio warns about when a connection still uses it. The pair is the
# warning's subject, not a credential Studio holds or sends, and the file is
# written by `bun run engines:generate` from src/lib/db/credential-warnings.ts.
# Suppress S2068 for that one generated file only.
sonar.issue.ignore.multicriteria.e8.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e8.resourceKey=src/lib/db/engine-declarations/milvus.json

# S7780 (String.raw should be used to avoid escaping) fires on the generated modules
# under src/lib/db/engine-catalog/ (the catalog, the connection modules, the execution
# UI and fence aliases, the query editor records, the SQL text, the SQL writing, the
# migration DDL and the SQL generator forms), written by
# `bun run engines:generate`
# (scripts/generate-engine-catalog.ts): the renderer writes every text as a JSON-style
# string literal on purpose, a backslash doubled, so each module is what the formatter
# leaves as it is and the drift guard compares it byte for byte. Suppress S7780 for
# those generated files only.
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.e9.resourceKey=src/lib/db/engine-catalog/*.generated.ts

# S5332 (clear-text protocol) fires on the lines of the OPC UA provider that
# declare the OPC Foundation's URIs: the security policy URI
# `http://opcfoundation.org/UA/SecurityPolicy#None` and the namespace-0 URI
# `http://opcfoundation.org/UA/`. The `http` there is not a
# transport this code chooses, it is the OPC Foundation's own spelling: Part 7
# names every policy by a URI under `http://opcfoundation.org/UA/`, nothing ever
# dereferences it, and a server compares the bytes. Writing `https` would simply
# stop matching every server, and the connection it is used on is an `opc.tcp`
# binary channel whose protection is the security mode, not a scheme. Suppress
# S5332 for that one file only, which is also the one place these URIs are declared.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e7.resourceKey=src/lib/db/providers/industrial/opcua/constants.ts
