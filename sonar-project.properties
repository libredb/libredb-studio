sonar.projectKey=libredb_libredb-studio
sonar.organization=libredb

sonar.projectName=libredb-studio
# sonar.projectVersion is intentionally NOT hardcoded here. CI injects it from
# package.json (-Dsonar.projectVersion=<version>) so the "previous_version"
# new-code definition resets its baseline at every release. A hardcoded value
# freezes the baseline, making months of code count as "new" forever.

sonar.sources=src
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,e2e/**/*.spec.ts

# Exclude only runtime/generated code, NOT test files
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/out/**,src/components/ui/**

# Duplication: test files share intentional mock/setup boilerplate (provider
# mocks, request fixtures). That repetition is expected harness scaffolding, not
# production duplication, so exclude tests from copy-paste detection.
#
# src/lib/db/compatibility.ts is a declarative data table: nine entries with an
# identical key sequence (name, via, tier, probedVersion, caveats), so the copy-paste
# detector reads 56 of its 180 lines as duplication. Compressing it into tuples plus a
# mapper would satisfy the detector and make the file worse: each entry publishes a
# user-facing support claim that a maintainer has to be able to audit line by line
# against the probe that produced it. The repetition is the schema, not copied logic.
sonar.cpd.exclusions=tests/**,e2e/**,src/lib/db/compatibility.ts

# src/exports/index.js is a one-line CJS shim (module.exports = require("./index.ts"))
# for bundlers that cannot resolve .ts entry points. It has no testable logic; it is
# smoke-tested by tests/isolated/exports-shim.test.ts, which runs WITHOUT coverage
# because importing the shim loads the entire component chain unexercised and would
# pollute the merged lcov with load-only zero-hit records. What enforces that is
# COVERAGE_EXEMPT_FILES in tests/runner/discover.ts, which names that file (and the
# Monaco loader wiring test) as the ones the runner spawns without --coverage; its
# docblock carries the measurement.
sonar.coverage.exclusions=src/exports/index.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# S2245 (insecure pseudorandom number generator) is a false positive in
# TestDataGenerator: Math.random there only produces fake sample rows (names,
# addresses, lorem ipsum) to populate dev/test tables. No security, crypto, or
# token use, so a CSPRNG is unwarranted. Suppress the rule for that file only.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=src/components/TestDataGenerator.tsx

# S2871 wants String.localeCompare when sorting strings. In diff-engine the
# .sort() calls build internal canonical keys for index-column SETS (used for
# equality matching), not user-facing ordering. They must be deterministic and
# locale-independent, so the default code-point sort is correct here and
# localeCompare would be a bug. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e2.resourceKey=src/lib/schema-diff/diff-engine.ts

# Same rule, same reason, in the agent operation registry: registeredIds() sorts
# internal operation ids for a deterministic enumeration that tests assert by
# exact array equality. Nothing here is user-facing text, and localeCompare would
# make the order depend on the host locale, so it would be a bug rather than a
# fix. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e3.resourceKey=src/lib/db/operations/registry.ts

# Same rule, same reason, a third time, and here it is load-bearing for a SEAL
# rather than for an enumeration (#789). The .sort() in object-edit-plan-token.ts
# orders an object's own keys while building the digest an edit plan is sealed
# with, so mint and verify must agree byte for byte on every host that runs this
# code. localeCompare would tie that ordering to the host's locale and ICU
# version, so a plan minted on one host could fail to verify on another and the
# reader would be told their preview could not be verified. That is not a
# theoretical difference: the sort is pinned by a mutation test that reverses key
# order AT EVERY DEPTH. Suppress S2871 for this file only.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e6.resourceKey=src/lib/api/object-edit-plan-token.ts

# S2068 (hard-coded credentials) fires on the field-classification maps in
# use-connection-payload.ts and use-connection-form.ts: they are
# Record<keyof DatabaseConnection, ...> literals, so `password: "resolution"` and
# `agentPassword: "preserved"` are a KEY named password beside a classification
# string, not a credential. The key set is fixed by `keyof`, so it cannot be
# renamed away, and the exhaustiveness is the whole point of the maps (see
# connection-secrets.ts for the same technique applied to credentials). Neither
# file holds or reads a secret value. Suppress S2068 for these two files only —
# named individually rather than by a use-connection-*.ts glob, which would also
# cover the manager and adapter hooks and quietly widen the exemption.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=src/hooks/use-connection-payload.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=src/hooks/use-connection-form.ts
