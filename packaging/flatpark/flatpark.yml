# FlatPark catalog descriptor for LibreDB Studio (issue #241).
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; org.libredb.Studio.yml is the Flatpak manifest it
# points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: org.libredb.Studio
name: LibreDB Studio
summary: AI-powered SQL IDE for PostgreSQL, MySQL, MongoDB and more
website: https://libredb.org
source_url: https://github.com/libredb/libredb-studio
build:
  manifest: org.libredb.Studio.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  tags:
    - Database
    - SQL
    - PostgreSQL
    - MySQL
    - MongoDB
    - Redis
    - SQLite
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
